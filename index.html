<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CPTED MAP</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --navy-900:#14273B;   /* 배경 베이스(가장 깊은 네이비) */
    --navy-700:#1E3A5F;   /* Sightline prussian navy (앱 강조색) */
    --grid:rgba(120,150,190,.09);  /* 측량 그리드 라인 */
    --paper:#F2F5F9;      /* 제목 글자 */
    --mist:#9FB2C9;       /* 부제 글자 */
    --steel:#3C6FA6;      /* 강조 룰 */
    --tick:rgba(159,178,201,.45);  /* 모서리 등록 마크 */
  }
  html,body{height:100%;}
  body{
    min-height:100vh;          /* 구형 폴백 */
    min-height:100svh;         /* 모바일 동적 툴바 대응 */
    display:flex;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    color:var(--paper);
    background-color:var(--navy-900);
    /* 측량 좌표 그리드 + 중앙을 살짝 밝히는 비네팅(깊이감) */
    background-image:
      radial-gradient(120% 90% at 50% 42%, rgba(46,77,116,.55) 0%, rgba(20,39,59,0) 60%),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:auto, 58px 58px, 58px 58px;
    -webkit-font-smoothing:antialiased;
  }

  /* 지도 시트처럼 보이게 하는 모서리 등록 마크(시그니처) */
  .sheet{position:fixed;inset:18px;pointer-events:none;}
  .sheet i{position:absolute;width:18px;height:18px;}
  .sheet i::before,.sheet i::after{content:"";position:absolute;background:var(--tick);}
  .sheet i::before{width:100%;height:1px;top:0;}
  .sheet i::after{height:100%;width:1px;left:0;}
  .sheet .tl{top:0;left:0;}
  .sheet .tr{top:0;right:0;transform:rotate(90deg);}
  .sheet .bl{bottom:0;left:0;transform:rotate(-90deg);}
  .sheet .br{bottom:0;right:0;transform:rotate(180deg);}

  .wrap{
    text-align:center;max-width:640px;
    animation:rise .7s cubic-bezier(.2,.7,.2,1) both;
  }
  h1{
    font-size:clamp(42px,12.5vw,100px);
    font-weight:800;line-height:.96;letter-spacing:-.02em;
    color:var(--paper);white-space:nowrap;
  }
  h1 .map{color:var(--mist);}   /* MAP은 살짝 낮은 명도로 위계 */
  .rule{
    width:clamp(40px,9vw,60px);height:2px;border-radius:2px;
    background:var(--steel);
    margin:clamp(20px,4vw,30px) auto clamp(16px,3vw,22px);
  }
  .sub{
    font-size:clamp(14px,4.1vw,19px);font-weight:500;
    letter-spacing:-.01em;color:var(--mist);
  }

  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.wrap{animation:none;}}
</style>
</head>
<body>
  <div class="sheet" aria-hidden="true"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
  <main class="wrap">
    <h1>CPTED&nbsp;<span class="map">MAP</span></h1>
    <div class="rule"></div>
    <p class="sub">위치기반 CPTED 현장조사 앱</p>
  </main>
</body>
</html>
