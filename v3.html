  }
  var title = titleEl.value.trim();
  var memo  = (document.getElementById('pmMemo')||{}).value || '';
  var today = new Date().toLocaleDateString('ko-KR', {year:'numeric', month:'2-digit', day:'2-digit'}).replace(/ /g,'');
  var lines = [];
  if (pmDraft.cats.length)  lines.push('원칙: ' + pmDraft.cats.join(', '));
  if (pmDraft.rating)       lines.push('취약도: ' + '★'.repeat(pmDraft.rating) + '☆'.repeat(5-pmDraft.rating) + ' (' + pmDraft.rating + '/5)');
  if (pmTags.length)        lines.push('태그: ' + pmTags.join(', '));
  if (pmDraft.lat)          lines.push('위치: ' + pmDraft.lat.toFixed(5) + ', ' + pmDraft.lng.toFixed(5) + ' (' + (pmDraft.gpsSource||'GPS') + ')');
  lines.push('조사일: ' + today);
  var desc = lines.join('\n') + (memo ? '\n---\n' + memo : '');

  var saveBtn = document.getElementById('pmSave');
  if (saveBtn) { saveBtn.disabled=true; saveBtn.textContent='저장 중...'; }

  try {
    // ── 1단계: 원본 dataUrl 확보
    var originalUrl = pmDraft.dataUrl || await toDataURL(pmDraft.file);

    // ── 2단계: 압축본 생성 (지도 썸네일·앱 표시용)
    if (saveBtn) saveBtn.textContent = '압축 중...';
    var thumbUrl = await compressImage(originalUrl, 1280, 0.72);

    // ── 3단계: IndexedDB 저장 (먼저 — 이후 단계 실패해도 데이터 보존)
    if (saveBtn) saveBtn.textContent = '저장 중...';
    // 촬영 방위: EXIF 촬영방위가 있으면 우선, 없으면 촬영 순간 나침반값 (둘 다 없으면 null → 삼각형 미표시)
    var _hdg = (pmDraft.imgDir != null && !isNaN(pmDraft.imgDir)) ? Math.round(((pmDraft.imgDir % 360) + 360) % 360)
             : (pmDraft.camHeading != null ? pmDraft.camHeading : null);
    var p = {
      id: 'p' + Date.now(),
      name: title, desc: desc, memo: memo,
      tags: pmTags.slice(), cats: pmDraft.cats.slice(),
      rating: pmDraft.rating,
      dataUrl: thumbUrl,        // 압축본 → 지도 썸네일·앱 표시
      originalUrl: originalUrl, // 원본   → 다운로드·ZIP 내보내기
      lat: pmDraft.lat, lng: pmDraft.lng,
      gpsSource: pmDraft.gpsSource,
      address: pmDraft.address || '',
      date: pmDraft.exifDate || today,
      hasXmp: false,
      heading: _hdg
    };
    p.thumb = await makeThumb(thumbUrl);   // 200px 썸네일(지도·목록·호버)
    await idbPut('photos', photoRecord(p, thumbUrl, p.thumb));   // 1280px 표시 레코드
    // 원본(풀해상도+EXIF) 보관 (JPEG만): 세션 메모리 + IDB(가능 시)
    if(pmDraft.file && (pmDraft.file.type==='image/jpeg' || /\.jpe?g$/i.test(pmDraft.file.name))){
      _origFiles[p.id] = pmDraft.file;   // 세션 원본
      try{ await updatePhotoMeta(p.id, {origBlob: pmDraft.file}); }catch(_){}   // IDB 영속(실패해도 세션 원본)
    }
    var pLite = photoLite(p);              // 메모리엔 메타+썸네일만
    photos.push(pLite);
    if (pLite.lat) addMkr('photo', mkPhotoMkr(pLite));
    updCounts();
    if (pLite.lat) map.flyTo([pLite.lat, pLite.lng], 17, {duration:.8});

    // ── 4단계: 폼 닫기 (데이터 안전 보장 후)
    closeAll();
    if (onNextCb) setTimeout(onNextCb, 400);
    toast('📷 저장됨' + (_hdg != null ? ' · 🧭 ' + _hdg + '°' : ' · 방위 없음(나침반 미작동)'));

    // ── 5단계: XMP 삽입 + 다운로드 (백그라운드, 원본 화질)
    var isJpeg = pmDraft.file && (pmDraft.file.type==='image/jpeg'||pmDraft.file.type==='image/jpg'||pmDraft.file.name.match(/\.jpe?g$/i));
    if (isJpeg && pmDraft.file) {
      try {
        var meta = { title:title, description:desc, tags:pmTags.slice(),
          rating:pmDraft.rating, location:pmDraft.lat?pmDraft.lat.toFixed(6)+','+pmDraft.lng.toFixed(6):'' };
        var annotated = await injectXMPIntoJPEG(pmDraft.file, buildXMPPacket(meta));
        p.hasXmp = true;
        await updatePhotoMeta(p.id, {hasXmp:true});   // ★ 플래그만 갱신(원본 full 보존)
        var d = new Date(), pad = function(n){return String(n).padStart(2,'0');};
        var ts = d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());
        var _ok=await shareOrDownload(annotated, 'CPTED_'+ts+'.jpg', 'CPTED 현장사진');
        if(_ok!==false){ pLite.origSafe=true; _markOrigSafe(p); }
        toast('✅ 원본 화질 파일 저장됨');
      } catch(xe) {
        console.warn('[pmSave] XMP/다운로드 실패:', xe);
        toast('📷 저장됨 (파일 다운로드 실패 — 내보내기로 추출 가능)');
      }
    }

  } catch(err) {
    toast('❌ 저장 실패: ' + err.message);
    if (saveBtn) { saveBtn.disabled=false; saveBtn.textContent='✅ 지도에 저장'; }
  }
}

function sfAutoGPS(force) {
  var dotEl = document.getElementById('sfGpsDot');
  var txtEl = document.getElementById('sfLocTxt');

  function setOk(src, lat, lng) {
    draft.lat = lat; draft.lng = lng; draft.gpsSource = src;
    lastPos = {lat:lat, lng:lng};
    if (dotEl) { dotEl.className = 'pm-gps-dot'; }
    if (txtEl) txtEl.textContent = src + '  ' + lat.toFixed(5) + ', ' + lng.toFixed(5);
  }
  function setFail() {
    if (dotEl) { dotEl.className = 'pm-gps-dot fail'; }
    if (txtEl) txtEl.textContent = '위치 확인 불가 — 저장은 가능합니다';
  }

  // lastPos가 있고 강제 재요청이 아니면 즉시 표시 후 백그라운드 갱신
  if (lastPos && !force) {
    setOk('캐시 위치', lastPos.lat, lastPos.lng);
    // 백그라운드로 신선한 위치도 요청
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function(pos){ setOk('현재 위치', pos.coords.latitude, pos.coords.longitude); },
        function(){},
        {enableHighAccuracy:true, timeout:10000, maximumAge:0}
      );
    }
    return;
  }

  if (!navigator.geolocation) { setFail(); return; }
  navigator.geolocation.getCurrentPosition(
    function(pos){ setOk('현재 위치', pos.coords.latitude, pos.coords.longitude); toast('📍 위치 취득'); },
    function(){ setFail(); },
    {enableHighAccuracy:true, timeout:12000, maximumAge:0}
  );
}

async function saveSurvey(){
  var title = document.getElementById('sfTitle');
  if (!title||!title.value.trim()) { toast('⚠️ 제목을 입력하세요'); return; }
  var sv = {
    id: 'sv'+Date.now(),
    title: title.value.trim(),
    note: (document.getElementById('sfNote')||{}).value||'',
    tag:  (document.getElementById('sfTag')||{}).value||'',
    photo: draft.photo||null,
    lat: draft.lat, lng: draft.lng,
    gpsSource: draft.gpsSource||null,
    time: new Date().toLocaleString('ko-KR')
  };
  surveys.push(sv);
  await idbPut('surveys', sv);
  if (sv.lat) addMkr('survey', mkSurveyMkr(sv));

  toast(sv.lat ? '✅ 저장됨 · 📍'+sv.lat.toFixed(4)+','+sv.lng.toFixed(4) : '✅ 저장됨 (위치 없음)');
  if (sv.lat) map.flyTo([sv.lat,sv.lng],17,{duration:.8});
}

      (sv.tag?'<div class="ic-row"><div class="ic-k">태그</div><div class="ic-v">#'+sv.tag.split(',').map(function(t){return t.trim();}).join(' #')+'</div></div>':'')+

}

function _slDelRecord(id,type){
  if(type==='photo'){
    photos=photos.filter(function(p){return p.id!==id;});
    var mi=LAYERS.photo.mkrs.findIndex(function(mk){return mk._pid===id;});
    if(mi>=0){ map.removeLayer(LAYERS.photo.mkrs[mi]); LAYERS.photo.mkrs.splice(mi,1); LAYERS.photo.cnt=LAYERS.photo.mkrs.length; }
    idbDel('photos',id);
  } else {
    surveys=surveys.filter(function(s){return s.id!==id;});
    var mi=LAYERS.survey.mkrs.findIndex(function(mk){return mk._sv&&mk._sv.id===id;});
    if(mi>=0){ map.removeLayer(LAYERS.survey.mkrs[mi]); LAYERS.survey.mkrs.splice(mi,1); LAYERS.survey.cnt=LAYERS.survey.mkrs.length; }
    idbDel('surveys',id);
  }
  delete _expSel[id];
}
function _slDeleteOne(id,type){
  var rec=type==='photo'?photos.find(function(p){return p.id===id;}):surveys.find(function(s){return s.id===id;});
  var nm=rec?(type==='photo'?rec.name:rec.title):'';
  if(!confirm('"'+(nm||'이 기록')+'" 삭제할까요?')) return;
  _slDelRecord(id,type); updCounts(); _expGroupsBuild(); _renderSurveyList(); _slTitleSync();
}
function _slDeleteSelected(){
  var ids=Object.keys(_expSel).filter(function(k){return _expSel[k];});
  if(!ids.length) return;
  var np=ids.filter(function(id){return photos.some(function(p){return p.id===id;});}).length, ns=ids.length-np;
  var parts=[]; if(np)parts.push('사진 '+np); if(ns)parts.push('노트 '+ns);
  if(!confirm('선택한 '+parts.join(' · ')+' (총 '+ids.length+'개)를 삭제할까요?\n되돌릴 수 없습니다.')) return;
  ids.forEach(function(id){ var type=photos.some(function(p){return p.id===id;})?'photo':'survey'; _slDelRecord(id,type); });
  _expSel={}; updCounts(); _expGroupsBuild(); _renderSurveyList(); _slTitleSync();
  toast('🗑 '+ids.length+'개 삭제됨');
}
function _slGoto(id,type){
  var rec=type==='photo'?photos.find(function(p){return p.id===id;}):surveys.find(function(s){return s.id===id;});
  if(!rec)return;
  if(!(rec.lat!=null && isFinite(rec.lat) && rec.lng!=null && isFinite(rec.lng))){ toast('⚠️ 위치 정보가 없는 '+(type==='photo'?'사진':'노트')+'입니다'); return; }
  closeAll();
  map.flyTo([rec.lat,rec.lng],17,{duration:.8});
  setTimeout(function(){
    if(type==='photo'){ var m=LAYERS.photo.mkrs.find(function(mk){return mk._pid===id;}); if(m)m.fire('click'); }
    else { var m=LAYERS.survey.mkrs.find(function(mk){return mk._sv&&mk._sv.id===id;}); if(m)m.fire('click'); }
  },450);
}
function _slClick(e){
  var t=e.target.closest('[data-act],[data-rid],[data-id]'); if(!t)return;
  if(t.hasAttribute('data-act')){
    var act=t.getAttribute('data-act');
    if(act==='all'){ _expGroups.forEach(function(g){_expSetRegion(g.id,true);}); _renderSurveyList(); }
    else if(act==='none'){ _expSel={}; _renderSurveyList(); }
    else if(act==='export'){ if(_expCount()) runSelectiveExport(); }
    else if(act==='del'){ _slDeleteSelected(); }
    else if(act==='saveorig'){ saveAllMissingOriginals(); }
    return;
  }
  if(t.hasAttribute('data-rid')){
    var rid=t.getAttribute('data-rid');
    if(t.classList.contains('sl-rchk')){
      var g=null; _expGroups.forEach(function(x){if(x.id===rid)g=x;});
      var ids=g.photos.map(function(p){return p.id;}).concat(g.surveys.map(function(s){return s.id;}));
      var allOn=ids.length>0 && ids.every(function(id){return _expSel[id];});
      _expSetRegion(rid,!allOn);
    } else { _expOpen[rid]=!_expOpen[rid]; }
    _renderSurveyList(); return;
  }
  if(t.hasAttribute('data-id')){
    var id=t.getAttribute('data-id'), ty=t.getAttribute('data-type');
    if(t.classList.contains('sl-chk')){ _expSel[id]=!_expSel[id]; _renderSurveyList(); }
    else if(t.classList.contains('sl-del')){ _slDeleteOne(id,ty); }
    else if(t.classList.contains('sl-go')){ _slGoto(id,ty); }
  }
}

// ══ DATA SHEET ══
// 레이어 ID → 데이터 배열 매핑 (지역 확장 시 함께 추가)
function getLayerData(lid) {
  switch(lid){
    case 'vacant':      return VACANT;
    case 'light':       return LIGHTS;
    case 'cctv':        return CCTV;
    case 'vacant_smj':  return VACANT_SMJ;
    case 'light_smj':   return LIGHTS_SMJ;
    case 'cctv_smj':    return CCTV_SMJ;
    case 'vacant_sj':   return VACANT_SJ;
    case 'cctv_sj':     return CCTV_SJ;
    case 'bell_sj':     return BELL_SJ;
    case 'vacant_bs':   return VACANT_BS;
    case 'light_bs':    return LIGHTS_BS;
    case 'cctv_bs':     return CCTV_BS;
    case 'light_gn':    return LIGHTS_GN;
    case 'cctv_gn':     return CCTV_GN;
    case 'cctv_un':     return CCTV_UN;
    case 'light_un':    return LIGHTS_UN;
    case 'park_un':     return PARK_UN;
    case 'post_un':     return POST_UN;
    case 'bell_un':     return BELL_UN;
    default:            return [];
  }
}

// 지역 그룹별 데이터 시트 (레이어 시트와 동일한 구조)
function openDataSheet(){
  openSheet('📊 데이터','');
  buildDataSheet();
}

function buildDataSheet() {
  var body = document.getElementById('shBody');
  if(!body) return;
  body.innerHTML='';

  REGIONS.slice().reverse().forEach(function(rg){
    // 데이터가 있는 카테고리만 (빈집·가로등·CCTV — boundary 제외) · 최근 추가 지역이 위로
    var dataCats = rg.layers.filter(function(lid){
      return getLayerData(lid).length > 0 || lid.startsWith('vacant') || lid.startsWith('light') || lid.startsWith('cctv') || lid.startsWith('bell');
    });
    if (!dataCats.length) return;

    var totalItems = dataCats.reduce(function(s, lid){ return s + getLayerData(lid).length; }, 0);

    // 지역 그룹 헤더
    var grp = document.createElement('div'); grp.className='lp-grp';
    var hd = document.createElement('div'); hd.className='lp-grp-hd' + (rg.expanded?' open':'');
    hd.innerHTML =
      '<span class="lp-grp-caret">'+svgIc('chevron-r','width:13px;height:13px')+'</span>'+
      '<span>'+svgIc('pin','width:14px;height:14px;color:var(--accent);vertical-align:-2px;margin-right:2px')+rg.name+'</span>'+
      '<span class="lp-grp-cnt">'+totalItems+'개</span>'+
      (rg.center ? '<span class="lp-grp-fly" data-rid="'+rg.id+'" title="이 지역으로 이동" style="cursor:pointer;padding:2px 8px;border-radius:4px;font-size:12px;color:var(--accent);margin-left:auto;">'+svgIc('navigate','width:16px;height:16px')+'</span>' : '');
    grp.appendChild(hd);

    var bd = document.createElement('div'); bd.className='lp-grp-body'+(rg.expanded?' open':'');

    // 각 카테고리별 (빈집·가로등·CCTV) 하위 토글
    dataCats.forEach(function(lid){
      if (!LAYERS[lid] || lid.startsWith('boundary')) return;
      var ly = LAYERS[lid];
      var items = getLayerData(lid);

      var catWrap = document.createElement('div');
      catWrap.style.cssText = 'border-bottom:1px solid var(--border);';

      // 카테고리 헤더 (펼침/접힘)
      var catHd = document.createElement('div');
      catHd.style.cssText = 'display:flex;align-items:center;gap:8px;padding:10px 16px 10px 32px;cursor:pointer;font-size:12px;user-select:none;background:var(--p2);';
      catHd.dataset.lid = lid;
      catHd.dataset.expanded = 'false';
      catHd.innerHTML =
        '<span class="lp-grp-caret" style="color:var(--muted);">'+svgIc('chevron-r','width:13px;height:13px')+'</span>'+
        '<span style="font-weight:600;color:var(--text);">'+svgIc(ly.icon,'color:'+ly.color+';width:15px;height:15px;margin-right:5px;vertical-align:-2px')+ly.name+'</span>'+
        '<span style="font-family:monospace;color:var(--muted);font-size:10px;margin-left:auto;">'+items.length+'개</span>';
      catWrap.appendChild(catHd);

      // 항목 리스트 (기본 접힘)
      var itemList = document.createElement('div');
      itemList.style.cssText = 'display:none;background:var(--bg);';

      if (items.length === 0) {
        var empty = document.createElement('div');
        empty.style.cssText = 'padding:12px 16px 12px 56px;color:var(--muted);font-size:12px;font-style:italic;';
        empty.textContent = '데이터 없음';
        itemList.appendChild(empty);
      } else {
        items.forEach(function(item){
          var name, sub, color;
          if (lid.indexOf('vacant')===0) {
            name = '빈집 ' + item.id + '번 · ' + item.addr;
            sub = (item.type||'-') + (item.grade && item.grade!=='-' ? ' · 등급 '+item.grade : '');
            color = '#f97316';
          } else if (lid.indexOf('light')===0) {
            name = item.addr;
            sub = (item.type||'-') + ' · ' + (item.count||'-') + '등' + (item.time?' · '+item.time:'');
            color = '#f59e0b';
          } else if (lid.indexOf('cctv')===0) {
            name = item.addr;
            sub = '카메라 ' + (item.count||'-') + '대' + (item.rotation?' · '+item.rotation:'') + (item.purpose?' · '+item.purpose:'');
            color = '#3b82f6';
          } else if (lid.indexOf('bell')===0) {
            name = '비상벨 #' + item.id + ' — ' + item.addr;
            sub = (item.manager||'-') + (item.note?' · '+item.note:'');
            color = '#ef4444';
          }
          var d = document.createElement('div');
          d.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 16px 10px 56px;cursor:pointer;border-top:1px solid var(--border);';
          d.innerHTML =
            '<div style="width:8px;height:8px;border-radius:50%;background:'+color+';flex-shrink:0;"></div>'+
            '<div style="flex:1;min-width:0;">'+
              '<div style="font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+name+'</div>'+
              '<div style="font-family:monospace;font-size:10px;color:var(--muted);margin-top:2px;">'+sub+'</div>'+
            '</div>';
          d.addEventListener('mouseenter', function(){ d.style.background='var(--p2)'; });
          d.addEventListener('mouseleave', function(){ d.style.background=''; });
          d.addEventListener('click', function(){
            map.flyTo([item.lat, item.lng], 18, {duration:.8});
            closeAll();
          });
          itemList.appendChild(d);
        });
      }
      catWrap.appendChild(itemList);

      // 카테고리 클릭 → 펼침/접힘
      catHd.addEventListener('click', function(){
        var expanded = catHd.dataset.expanded === 'true';
        catHd.dataset.expanded = expanded ? 'false' : 'true';
        catHd.querySelector('.lp-grp-caret').style.transform = expanded ? '' : 'rotate(90deg)';
        itemList.style.display = expanded ? 'none' : 'block';
      });

      bd.appendChild(catWrap);
    });

    grp.appendChild(bd);

    // 지역 헤더 클릭
    hd.addEventListener('click', function(e){
      if (e.target.classList.contains('lp-grp-fly')) return;
      rg.expanded = !rg.expanded;
      hd.classList.toggle('open', rg.expanded);
      bd.classList.toggle('open', rg.expanded);
    });
    var flyBtn = hd.querySelector('.lp-grp-fly');
    if (flyBtn) flyBtn.addEventListener('click', function(e){
      e.stopPropagation();
      if (rg.center) {
        gotoRegion(rg);
        closeAll();
        toast('📍 '+rg.name+'로 이동');
      }
    });

    body.appendChild(grp);
  });
}

// ══ CRIME SHEET (범죄주의구간 — 5종) ══
function openCrimeSheet(){
  openSheet('🛡 범죄현황','');
  buildCrimeSheet();
}

function buildCrimeSheet(){
  var body = document.getElementById('shBody');
  if(!body) return;
  body.innerHTML = '';

  // 안내 박스
  var info = document.createElement('div');
  info.style.cssText = 'padding:14px 16px;background:rgba(220,38,38,.06);border-bottom:1px solid var(--border);';
  info.innerHTML =
    '<div style="font-size:12px;color:var(--m2);line-height:1.6;">'+
      '경찰청 5대 범죄 행정구역별 격자 밀도 (생활안전지도 WMS)<br>'+
      '<span style="color:var(--muted);font-size:11px;">© 경찰청 범죄분석담당관 · 2025년 데이터 · 1년 단위 갱신</span>'+
    '</div>';
  body.appendChild(info);

  var crimeIds = ['safemap','safemap_violence','safemap_theft','safemap_burglary','safemap_rape'];
  var activeId = crimeIds.find(function(id){ return LAYERS[id] && LAYERS[id].visible; });

  // 현재 선택 표시 + 모두 끄기
  var ctrl = document.createElement('div');
  ctrl.style.cssText = 'display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--p2);';
  ctrl.innerHTML =
    '<div style="flex:1;font-size:12px;color:var(--m2);">'+
      (activeId
        ? '현재 표시: <b style="color:'+LAYERS[activeId].color+';">'+svgIc(LAYERS[activeId].icon,'color:'+LAYERS[activeId].color+';width:15px;height:15px;margin-right:5px;vertical-align:-2px')+LAYERS[activeId].name+'</b>'
        : '<span style="color:var(--muted);">선택된 항목 없음 — 아래에서 한 가지를 선택하세요</span>')+
    '</div>'+
    '<button id="crime-all-off" style="padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--m2);font-size:12px;font-weight:600;cursor:pointer;"'+(!activeId?' disabled style="opacity:.4;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--m2);font-size:12px;font-weight:600;"':'')+'>끄기</button>';
  body.appendChild(ctrl);

  // 5종 범죄 — 라디오 버튼식 (한 번에 하나만)
  crimeIds.forEach(function(id){
    var ly = LAYERS[id]; if (!ly) return;
    var isActive = ly.visible;
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;'
      + (isActive ? 'background:rgba(220,38,38,.05);' : '');
    row.innerHTML =
      '<div style="width:22px;height:22px;border-radius:50%;border:2px solid '+(isActive?ly.color:'var(--border)')+';display:flex;align-items:center;justify-content:center;flex-shrink:0;background:'+(isActive?ly.color:'transparent')+';">'
        +(isActive?'<div style="width:8px;height:8px;border-radius:50%;background:#fff;"></div>':'')
      +'</div>'
      +'<div style="font-size:20px;width:30px;text-align:center;flex-shrink:0;">'+svgIc(ly.icon,'color:'+ly.color+';width:21px;height:21px')+'</div>'
      +'<div style="flex:1;min-width:0;">'
        +'<div style="font-size:14px;font-weight:'+(isActive?'700':'500')+';color:'+(isActive?ly.color:'var(--text)')+';">'+ly.name+'</div>'
        +'<div style="font-family:monospace;font-size:10px;color:var(--muted);margin-top:2px;">'+(ly.info||'')+'</div>'
      +'</div>'
      +(isActive
        ? '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:90px;">'
          +'<span style="font-family:monospace;font-size:9px;color:var(--muted);">투명도 <span id="ov-'+id+'">'+Math.round(ly.opacity*100)+'%</span></span>'
          +'<input class="lp-sl" type="range" min="0" max="1" step=".05" value="'+ly.opacity+'" data-id="'+id+'" data-tp="op" style="width:80px;">'
          +'</div>'
        : '');
    // 클릭 → 이것만 켜기 (활성이면 끄기)
    row.addEventListener('click', function(e){
      if (e.target.tagName === 'INPUT') return; // 슬라이더 클릭 시 무시
      var wasActive = ly.visible;
      // 다른 범죄 레이어 모두 끄기
      crimeIds.forEach(function(otherId){
        if (LAYERS[otherId] && LAYERS[otherId].visible) {
          LAYERS[otherId].visible = false; applyVis(otherId);
        }
      });
      // 활성이 아니었다면 이것만 켜기
      if (!wasActive) { ly.visible = true; applyVis(id); }
      saveLayers(); buildCrimeSheet();
    });
    // 투명도 슬라이더
    var sl = row.querySelector('.lp-sl');
    if (sl) _sliderFill(sl);
    if (sl) sl.addEventListener('input', function(e){
      e.stopPropagation();
      _sliderFill(this);
      var v = parseFloat(this.value);
      setLayerOp(id, v);
      var ov = document.getElementById('ov-'+id);
      if (ov) ov.textContent = Math.round(v*100)+'%';
    });
    body.appendChild(row);
  });

  // 키 미설정 안내
  if (!LAYERS.safemap.wms) {
    var warn = document.createElement('div');
    warn.style.cssText = 'margin:14px 16px;padding:12px 14px;background:rgba(217,119,6,.08);border:1px solid rgba(217,119,6,.25);border-radius:8px;font-size:12px;color:var(--orange);line-height:1.6;';
    warn.innerHTML = '⚠ <b>VWorld 또는 SafeMap 인증키가 필요</b>합니다.<br>'+
      '<span style="color:var(--m2);font-size:11px;">키 없이는 범죄 격자가 표시되지 않습니다. 한국 IP에서만 작동.</span>';
    body.appendChild(warn);
  }

  // 모두 끄기 버튼
  var offBtn = document.getElementById('crime-all-off');
  if (offBtn) offBtn.addEventListener('click', function(){
    crimeIds.forEach(function(id){ if (LAYERS[id]) { LAYERS[id].visible = false; applyVis(id); } });
    saveLayers(); buildCrimeSheet();
  });
}

// 단일 레이어 행 생성 (지역 내부에서도 사용)
function makeLayerRow(id) {
  var ly = LAYERS[id];
  var isBoundary = (id==='boundary' || id==='boundary_smj' || id==='boundary_un');
  var isWms = !!ly.wmsId;
  var hasSz = !isBoundary && !isWms;
  var row = document.createElement('div'); row.className='lp-row';

  // 슬라이더 HTML 구성
  var slHtml = '';
  if (isBoundary) {
    // 경계: 채움 투명도 + 선 두께
    slHtml =
      '<div class="lp-sl-row"><span class="lp-sl-l">채움</span><span class="lp-sl-v" id="ov-'+id+'">'+(Math.round(ly.opacity*100))+'%</span><input class="lp-sl" type="range" min="0" max="1" step=".05" value="'+ly.opacity+'" data-id="'+id+'" data-tp="op"></div>'+
      '<div class="lp-sl-row"><span class="lp-sl-l">두께</span><span class="lp-sl-v" id="sv-'+id+'">'+(ly.weight||2.5).toFixed(1)+'</span><input class="lp-sl" type="range" min="1" max="6" step=".5" value="'+(ly.weight||2.5)+'" data-id="'+id+'" data-tp="sz"></div>';
  } else {
    slHtml = '<div class="lp-sl-row"><span class="lp-sl-l">투명</span><span class="lp-sl-v" id="ov-'+id+'">'+(Math.round(ly.opacity*100))+'%</span><input class="lp-sl" type="range" min="0" max="1" step=".05" value="'+ly.opacity+'" data-id="'+id+'" data-tp="op"></div>'+
      (hasSz?'<div class="lp-sl-row"><span class="lp-sl-l">크기</span><span class="lp-sl-v" id="sv-'+id+'">'+(Math.round(ly.sz*100))+'%</span><input class="lp-sl" type="range" min=".3" max="3" step=".1" value="'+ly.sz+'" data-id="'+id+'" data-tp="sz"></div>':'');
  }

  row.innerHTML =
    '<div class="lp-ico">'+svgIc(ly.icon,'color:'+ly.color+';width:18px;height:18px')+'</div>'+
    '<div class="lp-cnt">'+(isWms?(ly.wms?'활성':'키없음'):(ly.cnt>0?ly.cnt:''))+'</div>'+
    '<div class="lp-nm">'+ly.name+'</div>'+
    '<div class="lp-eye'+(ly.visible?'':' off')+'" data-id="'+id+'"></div>';
  row.querySelector('.lp-eye').addEventListener('click', function(e){
    e.stopPropagation();
    var lid=this.dataset.id; LAYERS[lid].visible=!LAYERS[lid].visible;
    applyVis(lid); saveLayers();
    // 활성 시트별 재렌더 (시트 제목 기준)
    var t = (document.getElementById('shTitle')||{}).textContent || '';
    if (t.indexOf('범죄') >= 0) buildCrimeSheet();
    else buildLP();
  });
  return row;
}

// ── 레이어 항목 라벨 (모든 카테고리 안전 처리: 속성 있으면 풍부, 없으면 #번호+좌표)
function _itemMeta(lid, item){
  var ly = LAYERS[lid];
  var name='', sub='', color = ly.color || '#888';
  function cs(){ return (item.lat!=null ? item.lat.toFixed(5)+', '+item.lng.toFixed(5) : ''); }
  if (lid.indexOf('vacant')===0){
    name='빈집 '+(item.id||'')+'번'+(item.addr?' · '+item.addr:'');
    sub=(item.type||'-')+(item.grade&&item.grade!=='-'?' · 등급 '+item.grade:'');
  } else if (lid.indexOf('cctv')===0){
    name=item.addr || ('CCTV #'+(item.idx||item.id||''));
    sub=item.addr ? ('카메라 '+(item.count||'-')+'대'+(item.rotation?' · '+item.rotation:'')+(item.purpose?' · '+item.purpose:'')) : cs();
  } else if (lid.indexOf('light')===0){
    name=item.addr || ('보안등 #'+(item.idx||item.id||''));
    sub=item.addr ? ((item.type?item.type+' · ':'')+(item.count||'-')+'등'+(item.time?' · '+item.time:'')) : cs();
  } else if (lid.indexOf('bell')===0){
    name=item.addr ? ('비상벨 #'+(item.id||item.idx||'')+' — '+item.addr) : ('비상벨 #'+(item.idx||item.id||''));
    sub=item.addr ? ((item.manager||'-')+(item.note?' · '+item.note:'')) : cs();
  } else if (lid.indexOf('park')===0){
    name='공영주차장'+(item.addr?' — '+item.addr:' #'+(item.idx||''));
    sub=(item.spaces?item.spaces:'-')+(item.note?' · '+item.note:'');
  } else if (lid.indexOf('post')===0){
    name='방범초소'+(item.addr?' — '+item.addr:' #'+(item.idx||''));
    sub=(item.manager||'-')+(item.note?' · '+item.note:'');
  } else {
    name='#'+(item.idx||item.id||''); sub=cs();
  }
  return {name:name, sub:sub, color:color};
}

// ── 레이어 행 + 펼침 항목 목록 (레이어 제어 + 데이터 드릴다운 통합)
function appendLayerRow(parent, lid){
  var ly = LAYERS[lid]; if(!ly) return;
  var row = makeLayerRow(lid);
  var items = getLayerData(lid);
  var hasItems = items.length>0 && lid.indexOf('boundary')!==0 && !ly.wmsId;
  if (!hasItems){
    var sp=document.createElement('div'); sp.style.cssText='width:16px;flex-shrink:0;';
    row.insertBefore(sp, row.firstChild);
    parent.appendChild(row); return;
  }
  // 캐럿(행 맨 앞)
  var caret=document.createElement('div'); caret.innerHTML=svgIc('chevron-r','width:14px;height:14px;color:var(--faint)');
  caret.style.cssText='cursor:pointer;color:var(--muted);font-size:11px;width:16px;text-align:center;flex-shrink:0;user-select:none;transition:transform .15s;';
  row.insertBefore(caret, row.firstChild);
  // 항목 목록(기본 접힘)
  var list=document.createElement('div'); list.style.cssText='display:none;background:var(--bg);';
  items.forEach(function(item){
    var meta=_itemMeta(lid,item);
    var d=document.createElement('div');
    d.style.cssText='display:flex;align-items:center;gap:10px;padding:9px 16px 9px 50px;cursor:pointer;border-top:1px solid var(--border);';
    d.innerHTML='<div style="width:8px;height:8px;border-radius:50%;background:'+meta.color+';flex-shrink:0;"></div>'+
      '<div style="flex:1;min-width:0;">'+
        '<div style="font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+meta.name+'</div>'+
        (meta.sub?'<div style="font-family:monospace;font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+meta.sub+'</div>':'')+
      '</div>';
    d.addEventListener('mouseenter',function(){d.style.background='var(--p2)';});
    d.addEventListener('mouseleave',function(){d.style.background='';});
    d.addEventListener('click',function(){ if(item.lat!=null){ map.flyTo([item.lat,item.lng],18,{duration:.8}); closeAll(); } });
    list.appendChild(d);
  });
  caret.addEventListener('click',function(e){
    e.stopPropagation();
    var open=list.style.display!=='none';
    list.style.display=open?'none':'block';
    caret.style.transform=open?'':'rotate(90deg)';
  });
  parent.appendChild(row);
  parent.appendChild(list);
}

// 현재 보고 있는 지역 id (지도 초기화 위치 = 가장 최근 추가 지역)
var curRegionId = REGIONS.length ? REGIONS[REGIONS.length-1].id : null;
// 지역 바로가기: 해당 지역 경계선이 화면에 다 들어오도록 이동 (경계 없으면 center로 폴백)
function gotoRegion(rg){
  if (rg && rg.id) curRegionId = rg.id; // 현재 지역 갱신
  var pts=[];
  if (rg && rg.layers){
    for (var gi=0; gi<rg.layers.length; gi++){
      var lid=rg.layers[gi];
      if (lid.indexOf('boundary')===0 && LAYERS[lid] && LAYERS[lid].rings){
        LAYERS[lid].rings.forEach(function(ring){ for(var j=0;j<ring.length;j++) pts.push(ring[j]); }); // [위도,경도]
      }
    }
  }
  if (pts.length>=2){ try{ map.fitBounds(L.latLngBounds(pts), {padding:[40,80], maxZoom:18}); return; }catch(_){} }
  if (rg && rg.center) map.flyTo(rg.center, rg.zoom||15, {duration:1.2}); // 폴백
}
function buildLP(){
  var body = document.getElementById('shBody');
  if(!body) return;
  body.innerHTML = '';

  // ── 1. 공통 — 현장 작업 (사용자 입력 데이터)
  var lab1 = document.createElement('div'); lab1.className='lp-sec-lbl';
  lab1.textContent = '현장 작업'; body.appendChild(lab1);
  ['survey','photo'].forEach(function(id){ appendLayerRow(body, id); });

  // ── 2. 지역별 그룹 · 최근 추가 지역이 위로
  REGIONS.slice().reverse().forEach(function(rg){
    var grp = document.createElement('div'); grp.className='lp-grp'+(rg.id===curRegionId?' cur':'');
    // 그룹 내 켜진 레이어 수 / 전체
    var onCnt = rg.layers.filter(function(lid){ return LAYERS[lid] && LAYERS[lid].visible; }).length;
    var totalMkrs = rg.layers.reduce(function(s,lid){ return s + (LAYERS[lid] ? LAYERS[lid].cnt : 0); }, 0);
    // 헤더
    var hd = document.createElement('div'); hd.className='lp-grp-hd' + (rg.expanded?' open':'');
    hd.dataset.rid = rg.id;
    hd.innerHTML =
      '<span class="lp-grp-caret" title="펼치기/접기">'+svgIc('chevron-r','width:18px;height:18px')+'</span>'+
      '<span class="lp-grp-name" title="이 지역으로 이동">'+svgIc('pin','width:15px;height:15px;color:var(--accent);vertical-align:-2px;margin-right:3px')+''+rg.name+(rg.center?' '+svgIc('navigate','width:14px;height:14px;color:var(--accent);vertical-align:-2px;margin-left:1px'):'')+'</span>'+
      '<span class="lp-grp-cnt">'+totalMkrs+'개</span>'+
      '<span class="lp-grp-act">'+
        '<span class="lp-grp-note" data-rid="'+rg.id+'" title="이 지역에 노트 추가">'+svgIc('note','width:20px;height:20px;color:var(--muted)')+'</span>'+
        '<div class="lp-grp-sw'+(onCnt>0?'':' off')+'" data-rid="'+rg.id+'" title="지역 전체 켜기/끄기"></div>'+
      '</span>';
    grp.appendChild(hd);
    // 본문 (레이어 행들)
    var bd = document.createElement('div'); bd.className='lp-grp-body'+(rg.expanded?' open':'');
    rg.layers.forEach(function(lid){
      if (LAYERS[lid]) appendLayerRow(bd, lid);
    });
    grp.appendChild(bd);

    // 헤더 클릭 → 펼침/접힘
    // 꺽쇠 클릭/터치 → 펼침·접힘
    var caretEl = hd.querySelector('.lp-grp-caret');
    if (caretEl) caretEl.addEventListener('click', function(e){
      e.stopPropagation();
      rg.expanded = !rg.expanded;
      hd.classList.toggle('open', rg.expanded);
      bd.classList.toggle('open', rg.expanded);
    });
    // 이 지역으로 이동
    var flyBtn = hd.querySelector('.lp-grp-name');  // 지역명 클릭 = 바로가기
    if (flyBtn) flyBtn.addEventListener('click', function(e){
      e.stopPropagation();
      if (rg.center && rg.center.length === 2) {
        gotoRegion(rg);
        closeAll();
        toast('📍 ' + rg.name + '로 이동');
      }
    });
    // 이 지역에 노트 추가
    var noteBtn = hd.querySelector('.lp-grp-note');
    if (noteBtn) noteBtn.addEventListener('click', function(e){
      e.stopPropagation();
      closeAll();
      setTimeout(function(){ openSurveyForm(null, rg); }, 250);
    });
    // 전체 켜기/끄기 버튼
    hd.querySelector('.lp-grp-sw').addEventListener('click', function(e){
      e.stopPropagation();
      var anyOn = rg.layers.some(function(lid){ return LAYERS[lid] && LAYERS[lid].visible; });
      rg.layers.forEach(function(lid){
        if (LAYERS[lid]) { LAYERS[lid].visible = !anyOn; applyVis(lid); }
      });
      saveLayers(); buildLP();
    });

    body.appendChild(grp);
  });

  // 범죄주의구간은 '범죄현황' 탭으로 이동했음
}

function escCSV(v){
  var s=String(v==null?'':v).replace(/"/g,'""');
  return (s.indexOf(',')>=0||s.indexOf('\n')>=0||s.indexOf('"')>=0)?'"'+s+'"':s;
}
function dataUrlToBlob(dataUrl){
  var arr=dataUrl.split(','), mime=(arr[0].match(/:(.*?);/)||['','image/jpeg'])[1];
  var bstr=atob(arr[1]), u8=new Uint8Array(bstr.length);
  for(var i=0;i<bstr.length;i++) u8[i]=bstr.charCodeAt(i);
  return new Blob([u8],{type:mime});
}
function buildSurveyTxt(sv){
  return ['=== CPTED 현장노트 ===',
    '제목: '+(sv.title||''),
    '일시: '+(sv.time||''),
    '위도: '+(sv.lat||''),
    '경도: '+(sv.lng||''),
    '위치출처: '+(sv.gpsSource||''),
    '태그: '+(sv.tag||''),
    '---',
    sv.note||''
  ].join('\n');
}
function buildPhotoCSV(arr){
  var rows=['\uFEFF유형,ID,제목,조사일,위도,경도,주소,위치출처,CPTED원칙,취약도,태그,설명'];
  arr.forEach(function(p){
    rows.push(['사진',p.id,p.name,p.date||'',p.lat||'',p.lng||'',
      p.address||'',p.gpsSource||'',(p.cats||[]).join('|'),p.rating||0,
      (p.tags||[]).join('|'),p.desc||''].map(escCSV).join(','));
  });
  return rows.join('\n');
}
function buildSurveyCSV(arr){
  var rows=['\uFEFF유형,ID,제목,일시,위도,경도,위치출처,태그,메모'];
  arr.forEach(function(sv){
    rows.push(['노트',sv.id,sv.title,sv.time||'',sv.lat||'',sv.lng||'',
      sv.gpsSource||'',sv.tag||'',sv.note||''].map(escCSV).join(','));
  });
  return rows.join('\n');
}


// ── 공유/다운로드 통합 (iOS Share Sheet ↔ PC 다운로드 자동 전환)
// iOS만 공유 시트 / Android·PC는 직접 다운로드
function isIOS(){
  return /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.maxTouchPoints > 1 && /Mac/i.test(navigator.userAgent));
}
async function shareOrDownload(blob, filename, shareTitle) {
  if (isIOS() && navigator.share && navigator.canShare) {
    var file = new File([blob], filename, {type: blob.type});
    if (navigator.canShare({files: [file]})) {
      try {
        await navigator.share({files: [file], title: shareTitle || filename});
        return true;
      } catch(e) {
        if (e.name === 'AbortError') return false;
      }
    }
  }
  // PC: 직접 다운로드
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
  return true;
}

// exifr 지연 로딩 — 사진 EXIF 추출 시에만 다운로드 (시작 로딩 가속)
var _heic2anyP = null;
// HEIC/HEIF → JPEG 변환 라이브러리 지연 로드 (아이폰 사진 호환). HEIC 감지 시에만 1.3MB 로드.
function ensureHeic2any(){
  if (window.heic2any) return Promise.resolve(window.heic2any);
  if (_heic2anyP) return _heic2anyP;
  _heic2anyP = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
    s.onload = function(){ res(window.heic2any); };
    s.onerror = function(){ _heic2anyP = null; rej(new Error('heic2any load failed')); };
    document.head.appendChild(s);
  });
  return _heic2anyP;
}
var _exifrP = null;
function ensureExifr(){
  if (window.exifr) return Promise.resolve(window.exifr);
  if (_exifrP) return _exifrP;
  _exifrP = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js';
    s.onload = function(){ res(window.exifr); };
    s.onerror = function(){ _exifrP = null; rej(new Error('exifr load failed')); };
    document.head.appendChild(s);
  });

}

/* ═══════════════ 선택 내보내기 (지역별 ZIP · 50장 분할) ═══════════════ */
function _escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// 두 좌표 간 대략 거리(m) — 등거리 근사(국내 단거리면 충분)
function _distM(aLat,aLng,bLat,bLng){
  var R=6371000, la=(aLat+bLat)/2*Math.PI/180;
  var x=(bLng-aLng)*Math.PI/180*Math.cos(la), y=(bLat-aLat)*Math.PI/180;
  return Math.sqrt(x*x+y*y)*R;
}
// 좌표 → 가장 가까운 지역 (15km 초과·좌표없음 → 미분류)
function regionOf(rec){
  if(rec==null||rec.lat==null||rec.lng==null||isNaN(rec.lat)||isNaN(rec.lng)) return {id:'_none',name:'미분류'};
  var best=null,bd=Infinity;
  REGIONS.forEach(function(r){ if(!r.center)return; var d=_distM(rec.lat,rec.lng,r.center[0],r.center[1]); if(d<bd){bd=d;best=r;} });
  if(!best||bd>15000) return {id:'_none',name:'미분류'};
  return {id:best.id,name:best.name};
}
function _safeName(s){ return (String(s||'미분류').replace(/[\[\]()]/g,'').replace(/[\\\/:*?"<>|]/g,'').replace(/\s+/g,'_').trim())||'미분류'; }
function _tsFromId(id,pre){
  var m=id&&String(id).match(new RegExp('^'+pre+'(\\d+)'));
  var d=m?new Date(parseInt(m[1])):new Date(), z=function(n){return String(n).padStart(2,'0');};
  return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'_'+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds());
}
function _dlBlob(blob,name){ var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);},10000); }

var _expSel={}, _expOpen={}, _expGroups=[];
function _expGroupsBuild(){

  photos.forEach(function(p){ ens(regionOf(p)).photos.push(p); });
  surveys.forEach(function(s){ ens(regionOf(s)).surveys.push(s); });
  var order=REGIONS.map(function(r){return r.id;}); order.push('_none');
  _expGroups=Object.keys(map).sort(function(a,b){return order.indexOf(a)-order.indexOf(b);}).map(function(k){return map[k];});

function _expSetRegion(rid,on){

// 선택 사진을 XMP 삽입된 JPEG File 객체로 변환 (방위·메모·위치 포함)
// 내보내기용 이미지 Blob — 원본(풀해상도+EXIF) 우선, 없으면 메모리 1280px, 최후 썸네일
async function exportImageBlob(p){
  if(_origFiles[p.id] instanceof Blob) return _origFiles[p.id];   // ① 이번 세션 원본(메모리) 우선
  try{ var rec=await idbGet('photos', p.id); if(rec && rec.origBlob instanceof Blob) return rec.origBlob; }catch(_){}  // ② IDB 영속 원본
  if(p.dataUrl) return dataUrlToBlob(p.dataUrl);   // ③ 1280px 폴백
  return p.thumb ? dataUrlToBlob(p.thumb) : null;
}
async function _photoToFile(p){
  var pts=_tsFromId(p.id,'p');
  var blob = await exportImageBlob(p);   // 원본(풀+EXIF) 우선
  var xmp=buildXMPPacket({title:p.name,description:p.desc||'',tags:p.tags||[],rating:p.rating||0,heading:p.heading,location:p.lat?p.lat.toFixed(6)+','+p.lng.toFixed(6):''});
  var annotated; try{annotated=await injectXMPIntoJPEG(blob,xmp);}catch(_){annotated=blob;}
  return new File([annotated],'CPTED_'+pts+'.jpg',{type:'image/jpeg'});
}

// ══ 원본 보관 상태(배지·저장) ══════════════════════════════
// 'safe'   : 원본이 디스크 저장됨(origSafe) 또는 IDB 영속(origBlob) → 새로고침해도 안전
// 'session': 원본이 이번 세션 메모리에만 있음 → 지금 저장 안 하면 유실 위험
// 'none'   : 원본이 앱에 없음(1280px 표시본만 존재)
function origState(p){
  if(p && p.origSafe) return 'safe';
  if(p && _origFiles[p.id] instanceof Blob) return 'session';
  return 'none';
}
// 미보관(세션 메모리에만 있는) 사진 목록 — 일괄 저장 대상
function missingOriginals(){
  return photos.filter(function(p){ return origState(p)==='session'; });
}
// 카드용 원본 배지 HTML (미보관이면 '원본 저장' 버튼 포함)
function origBadgeHtml(p){

  if(st==='safe') return '<span style="font-size:11px;padding:3px 9px;border-radius:6px;background:rgba(5,150,105,.12);color:var(--green);border:1px solid rgba(5,150,105,.28);">✓ 원본 보관됨</span>';
  if(st==='session') return '<span style="font-size:11px;padding:3px 9px;border-radius:6px;background:rgba(217,119,6,.13);color:#b45309;border:1px solid rgba(217,119,6,.32);">⚠ 원본 미보관</span>'+
    '<button onclick="saveCardOrig(\'' + p.id + '\')" style="font-size:11px;padding:3px 10px;margin-left:6px;border:0.5px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);cursor:pointer;">⬇ 원본 저장</button>';
  return '<span style="font-size:11px;padding:3px 9px;border-radius:6px;background:var(--p2);color:var(--muted);border:0.5px solid var(--border);">원본 없음 · 1280px</span>';

// 카드 배지 영역만 다시 그리기
function paintOrigBadge(pid){

// origSafe 표시(메모리 + IDB 영속)
function _markOrigSafe(p){ if(!p) return; p.origSafe=true; updatePhotoMeta(p.id,{origSafe:true}); }
// 사진 1장 원본 저장(디스크) — 성공 시 origSafe 표시
async function saveCardOrig(pid){
  var p=photos.find(function(x){return x.id===pid;}); if(!p) return;

}
// 미보관 원본 일괄 저장 — PC/안드로이드 ZIP 1개, iOS 공유 시트

// 선택 내보내기: 선택한 사진(JPG+XMP)·노트(TXT)를 PC·안드로이드는 ZIP 한 개로, iOS는 공유 시트로
async function runSelectiveExport(){
  var selP=photos.filter(function(p){return _expSel[p.id];});
  var selS=surveys.filter(function(s){return _expSel[s.id];});
  if(!selP.length && !selS.length){ toast('선택된 항목이 없습니다'); return; }
  closeAll();
  toast('📦 내보내기 준비 중...'); pb(0.05);
  try{
    // 파일 객체 구성: 사진(JPG+XMP) + 노트(TXT)
    var files=[];
    for(var i=0;i<selP.length;i++){
      files.push(await _photoToFile(selP[i]));
      pb(0.05+0.55*(i+1)/Math.max(selP.length,1));
    }
    selS.forEach(function(sv){
      files.push(new File([buildSurveyTxt(sv)], 'NOTE_'+_tsFromId(sv.id,'sv')+'.txt', {type:'text/plain'}));
    });
    // 목록 CSV (엑셀에서 바로 열림 · UTF-8 BOM 내장으로 한글 정상)
    if(selP.length) files.push(new File([buildPhotoCSV(selP)],  '사진목록.csv', {type:'text/csv;charset=utf-8'}));
    if(selS.length) files.push(new File([buildSurveyCSV(selS)], '노트목록.csv', {type:'text/csv;charset=utf-8'}));
    pb(0.62);
    var _dt=new Date(), _pd=function(n){return String(n).padStart(2,'0');};
    var base='CPTED_'+_dt.getFullYear()+_pd(_dt.getMonth()+1)+_pd(_dt.getDate())+'_'+_pd(_dt.getHours())+_pd(_dt.getMinutes())+_pd(_dt.getSeconds());
    var summary='('+selP.length+'장'+(selS.length?', 노트 '+selS.length+'건':'')+')';

    // iOS: 공유 시트(사진을 사진 앱에 저장 가능)
    var shared=false;
    if(isIOS() && navigator.share && navigator.canShare && navigator.canShare({files:files})){
      try{ await navigator.share({files:files, title:'CPTED 현장기록'}); shared=true; }
      catch(e){ if(e.name==='AbortError'){pb(0);return;} }
    }
    if(shared){ pb(1); setTimeout(function(){pb(0);},600); toast('✅ 내보내기 완료 '+summary); return; }

    // PC·안드로이드(및 iOS 공유 실패 시): ZIP 한 개로 묶어 다운로드
    loadJSZip(async function(JSZip){
      try{
        var zip=new JSZip();
        files.forEach(function(f){
          var ext=f.name.split('.').pop().toLowerCase();
          var sub=ext==='jpg'?base+'/사진/':ext==='txt'?base+'/노트/':base+'/';
          zip.file(sub+f.name, f);
        });
        pb(0.85);
        var zipBlob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
        _dlBlob(zipBlob, base+'.zip');
        pb(1); setTimeout(function(){pb(0);},600);
        toast('✅ ZIP 내보내기 완료 '+summary);
      }catch(ze){ pb(0); toast('❌ ZIP 생성 실패: '+(ze&&ze.message||ze)); }
    });
  }catch(err){ pb(0); toast('❌ 내보내기 실패: '+(err&&err.message||err)); }
}

        shareFiles.forEach(function(f){
          var ext=f.name.split('.').pop().toLowerCase();
          var sub=ext==='jpg'?base+'/사진/':ext==='txt'?base+'/노트/':base+'/';
          zip.file(sub+f.name, f);
        });
        var zipBlob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
        dlOne(zipBlob, base+'.zip');
        afterExport();
      });
      return;
    }

    afterExport();

  }catch(err){
    pb(0); toast('❌ 내보내기 실패: '+err.message);
  }

  function afterExport(){
    pb(1); setTimeout(function(){pb(0);},500);
    toast('✅ 내보내기 완료! ('+photos.length+'장 + '+surveys.length+'건)');
  }
}

// ── 구조화된 설명 파싱 (불러오기용)
function parseStructuredDesc(desc){
  var r={cats:[],rating:0,tags:[],lat:null,lng:null,date:'',memo:''};
  if(!desc) return r;
  var parts=String(desc).split('---');
  if(parts[1]) r.memo=parts[1].trim();
  parts[0].split('\n').forEach(function(line){
    var m;
    if((m=line.match(/^원칙:\s*(.+)/)))    r.cats=m[1].split(',').map(function(s){return s.trim();}).filter(Boolean);
    if((m=line.match(/\((\d)\/5\)/)))       r.rating=parseInt(m[1]);
    if((m=line.match(/^태그:\s*(.+)/)))     r.tags=m[1].split(',').map(function(s){return s.trim();}).filter(Boolean);
    if((m=line.match(/^위치:\s*([\d.]+),\s*([\d.]+)/))){ r.lat=parseFloat(m[1]); r.lng=parseFloat(m[2]); }
    if((m=line.match(/^조사일:\s*(.+)/)))   r.date=m[1].trim();
  });
  return r;
}

function _finNum(v){ var n=(v==null||v==='')?NaN:parseFloat(v); return isFinite(n)?n:null; }
function parseSurveyTxt(text){
  var data={}, memo=[], inMemo=false;
  text.split('\n').forEach(function(line){
    if(line.indexOf('===')===0) return;
    if(line.trim()==='---'){inMemo=true;return;}
    if(inMemo){memo.push(line);return;}
    var m=line.match(/^([^:]+):\s*(.*)/);
    if(m) data[m[1].trim()]=m[2].trim();
  });
  return {
    id:'sv'+Date.now()+'_'+Math.random().toString(36).slice(2,5),
    title:data['제목']||'불러온 노트',
    note:memo.join('\n').trim(),
    tag:data['태그']||'',
    lat:_finNum(data['위도']),
    lng:_finNum(data['경도']),
    gpsSource:data['위치출처']||'복원',
    time:data['일시']||new Date().toLocaleString('ko-KR'),
    photo:null
  };
}

async function importFromFiles(files){
  var arr=Array.from(files).filter(function(f){
    return f.type.startsWith('image/')||f.name.match(/\.(jpe?g|png|webp|heic|heif|gif|bmp)$/i)||f.name.match(/\.txt$/i);
  });
  if(!arr.length){ toast('⚠️ 이미지 또는 TXT 파일을 선택하세요'); return; }
  toast('📥 불러오는 중... ('+arr.length+'개)');
  pb(0.05);
  var cnt={p:0,s:0,skip:0,e:0}; _thumbFail=0;
  var newPts=[];

  for(var i=0;i<arr.length;i++){
    var f=arr[i];
    pb(0.05+(i/arr.length)*0.9);
    try{
      if(f.type.startsWith('image/')||f.name.match(/\.(jpe?g|png|webp|heic|heif|gif|bmp)$/i)){
        // ── 이미지 불러오기 (HEIC/HEIF는 JPEG로 변환 후 처리)
        var imgFile = f;   // 이미지 데이터용. HEIC면 변환본, EXIF/GPS는 항상 원본 f에서 추출
        var isHeic = /image\/hei[cf]/i.test(f.type||'') || /\.(heic|heif)$/i.test(f.name);
        if(isHeic){
          try{
            var _h2 = await ensureHeic2any();
            var _jpg = await _h2({ blob:f, toType:'image/jpeg', quality:0.85 });
            if(Array.isArray(_jpg)) _jpg = _jpg[0];
            if(_jpg) imgFile = _jpg;
            cnt.heic = (cnt.heic||0)+1;
          }catch(he){ console.warn('[import] HEIC 변환 실패:', f.name, he); cnt.heicFail=(cnt.heicFail||0)+1; }
        }
        var dataUrl=await toDataURL(imgFile);
        try{ dataUrl = await compressImage(dataUrl, 1280, 0.72); }catch(_){}  // 마커·저장용 축소(메타데이터는 원본 f에서 추출하므로 영향 없음)

        // 1순위: JPEG 바이너리에서 XMP 직접 추출·파싱 (HEIC엔 앱 XMP 없으므로 건너뜀)
        var xmpRaw = isHeic ? '' : await extractXMPRaw(f);
        var xmpFields = parseXMPRaw(xmpRaw);

        // 2순위: exifr (GPS 등 EXIF 추출용)
        var ex={};
        try{ ex=await (await ensureExifr()).parse(f,{gps:true,ifd0:true})||{}; }
        catch(xe){ console.warn('[import] exifr 실패:',f.name,xe); }

        // 제목: XMP 직접 추출 → 파일명 폴백
        var title = xmpFields.title;
        if(!title) title=f.name.replace(/\.(jpe?g|heic|heif|png|webp)$/i,'').replace(/^CPTED_\d+_/,'').replace(/[_-]/g,' ').trim();

        // 설명: XMP 직접 추출
        var desc = xmpFields.description;

        console.log('[import]', f.name, '→ title:', title, '| desc:', desc.length, 'chars | tags:', xmpFields.tags.length, '| rating:', xmpFields.rating);

        var parsed = parseStructuredDesc(desc);

        // 태그: XMP 직접 추출(dc:subject) 우선, 파싱 폴백
        var tags = xmpFields.tags.length ? xmpFields.tags : parsed.tags;

        // 등급: XMP 직접 추출 우선
        var rating = xmpFields.rating || parsed.rating;

        // GPS: EXIF 우선, 없으면 desc 파싱
        // EXIF GPS는 '유효한 숫자'일 때만 사용. 없거나 NaN이면 설명("위치:" 줄) 좌표로 폴백
        var exLat = (typeof ex.latitude==='number'  && isFinite(ex.latitude))  ? ex.latitude  : null;
        var exLng = (typeof ex.longitude==='number' && isFinite(ex.longitude)) ? ex.longitude : null;
        var lat = exLat != null ? exLat : parsed.lat;   // parsed.lat = 설명에서 추출한 좌표
        var lng = exLng != null ? exLng : parsed.lng;
        if(!(typeof lat==='number'&&isFinite(lat))) lat=null;
        if(!(typeof lng==='number'&&isFinite(lng))) lng=null;

        var p={
          id:'p'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,5),
          name:title||'불러온 사진',
          desc:desc, memo:parsed.memo,
          tags:tags, cats:parsed.cats,
          rating:rating,
          dataUrl:dataUrl, lat:lat, lng:lng,
          gpsSource:lat!=null?(exLat!=null?'EXIF GPS':'설명 복원'):'위치 없음',
          date:parsed.date||new Date().toLocaleDateString('ko-KR'),
          hasXmp:!!xmpRaw,
          heading:(xmpFields.heading!=null)?xmpFields.heading:((ex.GPSImgDirection!=null&&!isNaN(ex.GPSImgDirection))?Math.round(((ex.GPSImgDirection%360)+360)%360):null)
        };

        // 중복: 파일명(id 포함) 기반으로 완화
        var isDup=photos.find(function(ep){
          return ep.name===p.name && Math.abs(ep.lat-p.lat)<0.0001 && Math.abs(ep.lng-p.lng)<0.0001;
        });
        if(!isDup){
          var _lite = photoLite(p);             // 메타데이터(+썸네일·1280px는 아래)
          photos.push(_lite);                   // ★ 항상 먼저 적재 — 썸네일/IDB 실패와 무관하게 데이터 보존
          if(p.lat!=null && p.lng!=null){ newPts.push([p.lat,p.lng]); }  // 마커는 루프 후 rebuildPhotoMarkers()로 일괄 생성
          cnt.p++;
          var _disp = await compressImage(dataUrl, 1280, 0.72);   // 1280px (저장 안정·메모리 경량)
          _lite.dataUrl = _disp; p.dataUrl = _disp;               // 메모리에 1280px(카드·내보내기 직접 사용)
          _lite.thumb = await makeThumbSafe(_disp);   // 200px 썸네일
          p.thumb = _lite.thumb;
          try{ await idbPut('photos', photoRecord(p, _disp, _lite.thumb)); }catch(_pe){}   // 1280px 표시 레코드
          // 원본(풀해상도+EXIF) 별도 보관 (JPEG만)
          // ★ 세션 원본 = 압축 전 원본 파일(f). HEIC는 변환된 풀해상도 JPEG(imgFile). dataUrl은 1280px라 쓰면 안 됨!
          try{ var _orig=isHeic?imgFile:f; if(_orig instanceof Blob && (_orig.type==='image/jpeg'||/\.jpe?g$/i.test(f.name||''))){ _origFiles[p.id]=_orig; await updatePhotoMeta(p.id, {origBlob:_orig}); } }catch(_){}
        } else { cnt.skip++; }

      } else if(f.name.match(/\.txt$/i)){
        // ── TXT 불러오기
        var text=await f.text();
        if(text.indexOf('CPTED')<0){ cnt.skip++; continue; } // CPTED 파일이 아님
        var sv=parseSurveyTxt(text);
        // 중복: 제목만으로 판별 (시간은 포맷 차이로 불일치 가능)
        var isDupSv=surveys.find(function(es){ return es.title===sv.title; });
        if(!isDupSv){
          surveys.push(sv);
          await idbPut('surveys',sv);
          if(sv.lat!=null && isFinite(sv.lat)){ try{ addMkr('survey',mkSurveyMkr(sv)); newPts.push([sv.lat,sv.lng]); }catch(me){ console.warn('[import] 노트 마커 실패:',sv.title,me); } }
          cnt.s++;
        } else { cnt.skip++; }
      }
    }catch(e){ console.error('[import] 오류:',f.name, e); cnt.e++; }
  }

  pb(1); setTimeout(function(){pb(0);},500);
  if(cnt.p) LAYERS.photo.visible = true;   // 불러온 사진 레이어 ON
  rebuildPhotoMarkers({toast:true});       // photos[] 기준 마커 일괄 생성 + 결과 토스트
  if(cnt.p) saveLayers();

  var msg='📥 복원: 사진 '+cnt.p+'개, 노트 '+cnt.s+'건';
  if(cnt.heic) msg+=' · HEIC '+cnt.heic+'장 변환';
  if(cnt.heicFail) msg+=' · ⚠️HEIC변환실패 '+cnt.heicFail+'건';
  if(cnt.skip) msg+=' (중복 '+cnt.skip+'건 건너뜀)';
  if(cnt.e) msg+=' ⚠️오류 '+cnt.e+'건';
  if(_thumbFail) msg+=' · 썸네일 '+_thumbFail+'건 원본대체';
  toast(msg, 4000);
  console.log('[import] 완료:', cnt, '총', arr.length, '파일');

  if(newPts.length){
    setTimeout(function(){ map.fitBounds(newPts,{padding:[40,80]}); },500);
  }
}

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(function(){
      // 일부 브라우저(특히 모바일에서 권한 거부)는 폴백
      var ta = document.createElement('textarea'); ta.value=text;

      ta.select();
      try { document.execCommand('copy'); done(); } catch(_) { fail(); }
      document.body.removeChild(ta);
    });
  } else {
    var ta = document.createElement('textarea'); ta.value=text;
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch(_) { fail(); }
    document.body.removeChild(ta);
  }
});

  for(var _pi=0; _pi<savedP.length; _pi++){

    var _chg=false;

    var _img = _p.dataUrl || _p.originalUrl || ((_p.full instanceof Blob) ? await blobToDataURL(_p.full) : null);
    // 썸네일 보강 (없을 때만)

    // 과대 이미지 → 1280px 축소
    if(_img && _img.length > 600000){ try{ var _sm=await compressImage(_img,1280,0.72); if(_sm && _sm.length<_img.length) _img=_sm; }catch(_e){} }
    // base64(dataUrl)로 통일 — 레거시 Blob/originalUrl 제거 (IDB 저장 안정성 확보)
    if(_img && (_p.full || _p.originalUrl || _p.dataUrl !== _img)){ _p.dataUrl = _img; delete _p.full; delete _p.originalUrl; _chg=true; }
    if(_img) _lite.dataUrl = _img;   // 메모리도 최종(압축) 1280px로 — 카드·내보내기 직접 사용
    // 원본이 전혀 없는(썸네일만 남은) 손상 레코드 집계
    if(!_p.dataUrl && !_p.originalUrl && !(_p.full instanceof Blob)) _noFull++;
    if(_chg){ try{ await idbPut('photos', _p); }catch(_e2){} }
    // 마커는 루프 후 rebuildPhotoMarkers()로 일괄 생성
  }

  rebuildPhotoMarkers();   // photos[] 기준 사진 마커 일괄 생성

  // Restore surveys

  if(_noFull>0)
    setTimeout(function(){ toast('⚠ 원본 손상 사진 '+_noFull+'개 — 썸네일만 남음(재업로드 필요)'); }, 2800);

  // 앱 시작 시 나침반 시작 (방향 콘 표시 — 안드로이드 즉시, iOS는 권한 탭 후)
  startCompass();
  // iOS 워밍업: 방향센서 권한은 사용자 제스처가 필요 → 지도 첫 조작 시 1회 요청
  // (FAB 촬영 탭과 분리하여 파일 선택창 가로채기 방지). 안드로이드는 위 호출로 이미 시작.
  (function(){
    try {
      var _mc = map.getContainer();
      var _warm = function(){ try{ startCompass(); }catch(_){} };
      _mc.addEventListener('pointerdown', _warm, {once:true, passive:true});
      _mc.addEventListener('touchstart', _warm, {once:true, passive:true});
    } catch(_){}
  })();

  // 앱 시작 시 자동 위치 요청
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        var lat=pos.coords.latitude, lng=pos.coords.longitude;
        setLoc(lat, lng, pos.coords.accuracy);
        lastPos = {lat:lat, lng:lng};
        startLocated = true;
        map.setView([lat, lng], 17);  // 앱 시작 시 현재 위치로 이동
      },
      function(){ /* 실패·거부 시 폴백(마지막 사례지) 유지 */ },
      {enableHighAccuracy:true, timeout:10000, maximumAge:30000}
    );
    // 백그라운드 연속 추적 시작
    watcher = navigator.geolocation.watchPosition(
      function(pos) {
        var lat=pos.coords.latitude, lng=pos.coords.longitude;
        setLoc(lat, lng, pos.coords.accuracy);
        lastPos = {lat:lat, lng:lng};
        if (naviDest) updateNavi(lat, lng);
        // 네비 모드 회전은 나침반(deviceHeading)이 담당
      },
      function(){},
      {enableHighAccuracy:true, timeout:30000, maximumAge:3000}
    );
  }

  window.addEventListener('resize', function(){ map.invalidateSize(); });
})();

})(); // end IIFE
</script>
</body>
</html>
