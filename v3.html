<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>CPTED MAP</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://api.vworld.kr" crossorigin>
<link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#f0f4f8;--panel:#ffffff;--p2:#f1f5f9;--border:#dde3ec;
  --accent:#2563eb;--text:#0f172a;--muted:#64748b;--m2:#475569;
  --green:#059669;--orange:#ea580c;--yellow:#d97706;--purple:#9333ea;
  --danger:#dc2626;
  --nav:60px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html,body{width:100%;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  background:var(--bg);color:var(--text);}

/* ── MAP ── */
#map{
  position:fixed;
  top:0;left:0;right:0;
  bottom:calc(var(--nav) + var(--safe-b));
  z-index:1;
}


/* ── TOP BAR ── */
.top{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;gap:6px;
  padding:calc(var(--safe-t) + 8px) 12px 8px;
  background:linear-gradient(180deg,rgba(15,23,42,.95) 60%,transparent);
  pointer-events:none;
}
.top>*{pointer-events:all;}
.top-logo{font-size:15px;font-weight:800;color:#93c5fd;flex:1;letter-spacing:-.3px;text-shadow:0 1px 3px rgba(0,0,0,.5);}
.chip{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid;
  white-space:nowrap;font-family:monospace;font-weight:600;
  backdrop-filter:blur(6px);text-shadow:0 1px 2px rgba(0,0,0,.4);}
.tbtn{width:38px;height:38px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.3);
  background:rgba(15,23,42,.82);backdrop-filter:blur(8px);
  color:#fff;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.3);}
.tbtn:active{opacity:.7;}

/* ── BOTTOM NAV ── */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  display:flex;
  height:calc(var(--nav) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:rgba(255,255,255,.97);
  border-top:1px solid var(--border);
  backdrop-filter:blur(12px);
}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;border:none;background:transparent;
  color:var(--muted);font-family:inherit;cursor:pointer;padding:6px 0;}
.ni.on{color:var(--accent);}
.ni-i{font-size:20px;line-height:1;}
.ni-l{font-size:10px;font-weight:600;}

/* ── MAP CONTROLS ── */
.mctrl{
  position:fixed;right:12px;
  bottom:calc(var(--nav) + var(--safe-b) + 12px);
  z-index:50;display:flex;flex-direction:column;gap:8px;
}
.mc{width:44px;height:44px;border-radius:12px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(15,23,42,.82);backdrop-filter:blur(8px);
  color:var(--text);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.4);}
.mc:active{opacity:.7;}
.mc.on{background:rgba(59,130,246,.25);border-color:var(--accent);}
/* 정북/방위 버튼: 원형 흰배경 */
.mc-north{border-radius:50%;background:#fff;border:1.5px solid rgba(0,0,0,.12);
  box-shadow:0 2px 10px rgba(0,0,0,.35);}
.mc-north:active{opacity:1;transform:scale(.92);}
#northNeedle{transition:transform .12s linear;transform-origin:50% 50%;}
.mc-north.locked{background:#6366f1;border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.35);}
.mc-north.locked #northNeedle text{fill:#fff;}
.nlock-banner{position:fixed;top:calc(var(--safe-t) + 50px);left:50%;transform:translateX(-50%) translateY(-8px);
  z-index:150;display:none;align-items:center;gap:7px;background:rgba(99,102,241,.96);color:#fff;
  font-size:13px;font-weight:700;padding:8px 16px;border-radius:22px;box-shadow:0 4px 14px rgba(99,102,241,.4);
  letter-spacing:-.2px;white-space:nowrap;cursor:pointer;opacity:0;transition:opacity .2s,transform .2s;}
.nlock-banner.on{display:flex;opacity:1;transform:translateX(-50%) translateY(0);}
.nlock-hint{font-size:11px;font-weight:500;opacity:.85;}
/* 줌 +/- 흰색 글자 */
#ziBtn, #zoBtn{color:#fff;font-weight:700;}

/* ── FAB ── */
.fab-wrap{
  position:fixed;
  bottom:calc(var(--nav) + var(--safe-b) + 24px);
  left:50%;transform:translateX(-50%);
  z-index:50;display:flex;flex-direction:column;align-items:center;gap:10px;
}
.fab{width:58px;height:58px;border-radius:50%;
  border:none;color:#fff;font-size:24px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(0,0,0,.4);transition:all .2s;}
.fab:active{transform:scale(.9);}
.fab-green{background:var(--green);box-shadow:0 4px 20px rgba(16,185,129,.45);}
.fab-red  {background:var(--danger);box-shadow:0 4px 20px rgba(239,68,68,.45);}
.fab-menu{display:none;flex-direction:row;gap:16px;align-items:flex-end;}
.fab-menu.on{display:flex;}
.fab-item{display:flex;flex-direction:column;align-items:center;gap:4px;}
.fab-mini{width:50px;height:50px;border-radius:50%;
  background:rgba(15,23,42,.92);border:2px solid rgba(255,255,255,.25);
  color:#fff;font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,.4);position:relative;
  backdrop-filter:blur(8px);}
.fab-mini:active{opacity:.7;}
.fab-mini input{position:absolute;inset:0;opacity:0;cursor:pointer;
  width:100%;height:100%;border-radius:50%;}
.fab-lbl{font-size:11px;font-weight:600;color:#fff;
  background:rgba(15,23,42,.85);border-radius:6px;
  padding:3px 8px;white-space:nowrap;
  text-shadow:0 1px 2px rgba(0,0,0,.5);}

/* ── NAVI BAR ── */
.navi{
  position:fixed;top:0;left:0;right:0;z-index:200;
  background:linear-gradient(135deg,#1e3a8a,#1e40af);
  padding:calc(var(--safe-t)+8px) 16px 12px;
  display:none;flex-direction:column;gap:6px;
}
.navi.on{display:flex;}
.navi-r1{display:flex;align-items:center;gap:10px;}
.navi-dist{font-size:30px;font-weight:800;color:#fff;}
.navi-unit{font-size:13px;color:rgba(255,255,255,.7);}
.navi-dir{flex:1;font-size:13px;color:rgba(255,255,255,.9);}
.navi-stop{padding:8px 14px;background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;
  font-size:12px;font-weight:700;cursor:pointer;}
.navi-addr{font-size:11px;color:rgba(255,255,255,.65);font-family:monospace;}

/* ── OVERLAY ── */
.ov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.6);
  opacity:0;pointer-events:none;transition:opacity .22s;}
.ov.on{opacity:1;pointer-events:all;}

/* ── SHEET ── */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:400;
  background:var(--panel);border-radius:20px 20px 0 0;
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.32,1,.6,1);
  max-height:88vh;max-height:88svh;display:flex;flex-direction:column;
  padding-bottom:var(--safe-b);
}
.sheet.on{transform:translateY(0);}
.sh-bar{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0;flex-shrink:0;}
.sh-hd{display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px 10px;border-bottom:1px solid var(--border);flex-shrink:0;}
.sh-title{font-size:15px;font-weight:700;}
.sh-x{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);
  background:var(--p2);color:var(--m2);cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;}
.sh-body{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;}

/* ── INFO CARD ── */
.ic{padding:10px 16px 20px;}
.ic-img{width:100%;height:auto;max-height:60vh;object-fit:contain;border-radius:12px;margin-bottom:14px;background:var(--p2);display:block;}
.ic-ico{width:100%;height:90px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:44px;margin-bottom:14px;}
.ic-name{font-size:16px;font-weight:700;margin-bottom:12px;}
.ic-row{display:flex;gap:10px;margin-bottom:8px;}
.ic-k{font-family:monospace;font-size:11px;color:var(--muted);min-width:70px;flex-shrink:0;padding-top:1px;}
.ic-v{font-size:13px;color:var(--m2);flex:1;line-height:1.5;}
.ic-note{margin-top:10px;padding:10px 12px;background:var(--p2);border-radius:10px;
  font-size:13px;color:var(--m2);line-height:1.6;white-space:pre-wrap;}
.ic-addr{margin-top:10px;padding:10px 12px;background:rgba(37,99,235,.08);
  border-left:3px solid var(--accent);border-radius:8px;
  font-size:13px;color:var(--text);line-height:1.55;}
.ic-addr span{font-weight:600;}
.ic-coords{margin-top:10px;padding:10px 12px;background:var(--p2);border-radius:10px;
  cursor:pointer;user-select:none;transition:background .15s, transform .1s;
  font-family:monospace;font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;}
.ic-coords:hover{background:#e2e8f0;}
.ic-coords:active{transform:scale(.98);}
.ic-coords span{color:var(--accent);}
.ic-coords::after{content:'📋';position:absolute;right:14px;top:50%;transform:translateY(-50%);
  opacity:.35;font-size:14px;}
.ic-coords{position:relative;}
.ic-navi{margin-top:12px;width:100%;padding:14px;background:var(--accent);
  color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;}
.ic-navi:active{opacity:.85;}

/* ── LIST ── */
.li{display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--border);cursor:pointer;}
.li:active{background:var(--p2);}
.li-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.li-th{width:48px;height:48px;border-radius:9px;object-fit:cover;
  flex-shrink:0;background:var(--border);display:flex;align-items:center;
  justify-content:center;font-size:22px;}
.li-inf{flex:1;min-width:0;}
.li-n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li-s{font-family:monospace;font-size:10px;color:var(--muted);margin-top:2px;}
.li-del{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);
  background:var(--p2);color:var(--muted);cursor:pointer;font-size:13px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.li-del:active{background:rgba(239,68,68,.15);color:var(--danger);}

/* ── SURVEY FORM ── */
.sf{padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px;}
.sf-lbl{font-size:12px;color:var(--m2);margin-bottom:4px;}
.sf-photo{width:100%;height:190px;border-radius:12px;background:var(--p2);
  display:flex;align-items:center;justify-content:center;font-size:44px;
  position:relative;overflow:hidden;cursor:pointer;}
.sf-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.sf-photo-lbl{position:absolute;bottom:8px;right:8px;background:rgba(15,23,42,.8);
  color:#fff;border-radius:6px;padding:3px 9px;font-size:11px;}
.sf-inp{width:100%;padding:12px 14px;background:var(--p2);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none;}
.sf-inp:focus{border-color:var(--accent);}
.sf-area{resize:none;height:96px;line-height:1.6;}
.sf-loc{display:flex;align-items:center;gap:8px;padding:10px 14px;
  background:var(--p2);border:1px solid var(--border);border-radius:10px;
  font-family:monospace;font-size:12px;color:var(--m2);}
.sf-loc-r{margin-left:auto;font-size:17px;cursor:pointer;color:var(--accent);}
.sf-save{padding:14px;background:var(--accent);color:#fff;border:none;
  border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;width:100%;}
.sf-save:active{opacity:.85;}

/* ── LAYER SLIDERS ── */
.lp-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);}
/* 지역 그룹 */
.lp-grp{margin-top:4px;}
.lp-grp-hd{display:flex;align-items:center;gap:8px;padding:10px 14px;
  background:var(--p2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  cursor:pointer;user-select:none;font-size:13px;font-weight:700;color:var(--text);}
.lp-grp-hd:hover{background:rgba(37,99,235,.06);}
.lp-grp-caret{font-size:10px;color:var(--muted);width:14px;transition:transform .15s;}
.lp-grp-hd.open .lp-grp-caret{transform:rotate(90deg);}
.lp-grp-cnt{font-family:monospace;font-size:10px;color:var(--muted);}
.lp-grp-eye{margin-left:auto;font-size:16px;cursor:pointer;padding:2px 6px;border-radius:4px;}
.lp-grp-eye:hover{background:rgba(37,99,235,.1);}
.lp-grp-body{display:none;}
.lp-grp-body.open{display:block;}
.lp-grp-body .lp-row{padding-left:32px;}
.lp-sec-lbl{padding:14px 16px 6px;font-size:10px;font-weight:700;letter-spacing:.1em;
  color:var(--muted);text-transform:uppercase;}
.lp-eye{font-size:20px;cursor:pointer;width:28px;text-align:center;flex-shrink:0;}
.lp-eye.off{opacity:.2;}
.lp-col{width:14px;height:14px;border-radius:3px;flex-shrink:0;}
.lp-inf{flex:1;min-width:0;}
.lp-n{font-size:13px;font-weight:600;}
.lp-c{font-family:monospace;font-size:10px;color:var(--muted);}
.lp-sls{display:flex;flex-direction:column;gap:4px;flex-shrink:0;min-width:94px;}
.lp-sl-row{display:flex;align-items:center;gap:3px;}
.lp-sl-l{font-family:monospace;font-size:9px;color:var(--muted);width:22px;}
.lp-sl-v{font-family:monospace;font-size:9px;color:var(--m2);width:28px;text-align:right;}
.lp-sl{-webkit-appearance:none;appearance:none;width:58px;height:3px;border-radius:2px;background:var(--border);outline:none;cursor:pointer;}
.lp-sl::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);}

/* ── MAP GRID ── */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px;}
.mg-sec{font-family:monospace;font-size:10px;text-transform:uppercase;color:var(--muted);
  letter-spacing:.1em;padding:6px 0 2px;grid-column:1/-1;}
.mg-btn{padding:14px 10px;border-radius:10px;background:var(--p2);border:1px solid var(--border);cursor:pointer;text-align:center;}
.mg-btn:active,.mg-btn.on{background:rgba(59,130,246,.15);border-color:var(--accent);}
.mg-btn.dis{opacity:.3;pointer-events:none;}
.mg-i{font-size:26px;display:block;margin-bottom:5px;}
.mg-l{font-size:12px;font-weight:600;color:var(--m2);}
.mg-btn.on .mg-l{color:var(--accent);}

/* ── VWorld key ── */
.kf{padding:16px;display:flex;flex-direction:column;gap:10px;}
.kf-lbl{font-size:13px;color:var(--m2);}
.kf-row{display:flex;gap:8px;}
.kf-inp{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:10px;
  font-family:monospace;font-size:13px;background:var(--p2);color:var(--text);outline:none;}
.kf-inp:focus{border-color:var(--accent);}
.kf-ok{padding:12px 18px;background:var(--accent);color:#fff;border:none;
  border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}
.kf-ok:active{opacity:.85;}
.kf-ok-badge{display:none;align-items:center;gap:8px;padding:12px;
  background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:10px;}
.kf-ok-badge.on{display:flex;}
.kf-ok-badge span{font-size:13px;color:var(--green);font-weight:600;}
.kf-link{font-size:12px;color:var(--accent);text-decoration:none;}

/* ── DATA TABS ── */
.dtabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
.dtab{flex:1;padding:10px 0;background:transparent;border:none;color:var(--muted);
  font-size:12px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;}
.dtab.on{color:var(--accent);border-bottom-color:var(--accent);}

/* ── TOAST & PB ── */
.toast{position:fixed;bottom:calc(var(--nav)+var(--safe-b)+14px);left:50%;
  transform:translateX(-50%) translateY(8px);z-index:999;
  background:var(--p2);border:1px solid var(--border);border-radius:14px;
  padding:10px 20px;font-size:12px;font-family:monospace;color:var(--m2);
  white-space:nowrap;box-shadow:0 4px 18px rgba(0,0,0,.4);
  opacity:0;transition:all .28s;pointer-events:none;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.pb{position:fixed;top:0;left:0;right:0;height:3px;background:var(--accent);
  z-index:999;transform:scaleX(0);transform-origin:left;transition:transform .25s;}

/* ── COMPASS ── */


/* ── LOC MARKER (구글맵 스타일 방향 콘) ── */
.loc-marker{position:relative;width:48px;height:48px;}
.loc-cone{position:absolute;left:0;top:0;width:48px;height:48px;
  transform-origin:50% 50%;
  transition:transform .12s linear;
  pointer-events:none;display:none;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));}
.loc-dot{position:absolute;left:50%;top:50%;
  width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
  background:#2563eb;border:3px solid #fff;
  box-shadow:0 0 0 1.5px rgba(0,0,0,.3),0 1px 7px rgba(0,0,0,.55);
  z-index:2;}
.loc-dot::after{content:'';position:absolute;inset:-8px;border-radius:50%;
  border:2px solid rgba(37,99,235,.45);animation:locpulse 2s ease-out infinite;}
@keyframes locpulse{0%{transform:scale(.6);opacity:.8;}100%{transform:scale(1.7);opacity:0;}}

/* Leaflet override */
.leaflet-control-zoom{display:none;}
.leaflet-control-attribution{display:none !important;}

/* ── PHOTO META SHEET ── */
.pm{padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px;}
.pm-preview{width:100%;height:200px;border-radius:12px;overflow:hidden;position:relative;background:var(--p2);flex-shrink:0;}
.pm-preview img{width:100%;height:100%;object-fit:cover;display:block;}
.pm-gps{position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(to top,rgba(0,0,0,.8),transparent);
  padding:10px 12px 8px;display:flex;align-items:center;gap:6px;
  font-family:monospace;font-size:11px;color:rgba(255,255,255,.75);}
.pm-addr{position:absolute;bottom:36px;left:12px;right:12px;
  font-size:12px;font-weight:600;line-height:1.45;color:#fff;
  background:rgba(0,0,0,.55);padding:6px 10px;border-radius:6px;
  backdrop-filter:blur(8px);box-shadow:0 2px 8px rgba(0,0,0,.3);}
.pm-addr span{color:#bfdbfe;}
.pm-gps-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;animation:gpspulse 2s infinite;}
.pm-gps-dot.wait{background:var(--yellow);animation:gpspulse 1s infinite;}
.pm-gps-dot.fail{background:var(--danger);animation:none;}
@keyframes gpspulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.pm-lbl{font-size:12px;color:var(--m2);margin-bottom:5px;}
.pm-inp{width:100%;padding:11px 14px;background:var(--p2);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none;}
.pm-inp:focus{border-color:var(--accent);}
/* CPTED 원칙 */
.pm-cats{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.pm-cat{display:flex;align-items:center;gap:8px;padding:9px 11px;
  border-radius:9px;border:1px solid var(--border);background:var(--p2);
  cursor:pointer;font-size:12px;color:var(--m2);transition:all .15s;user-select:none;}
.pm-cat.on{border-color:var(--accent);background:rgba(59,130,246,.12);color:var(--accent);}
.pm-cat-dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;transition:all .15s;}
.pm-cat.on .pm-cat-dot{background:var(--accent);border-color:var(--accent);}
/* Tag input */
.pm-tags-wrap{min-height:42px;padding:5px 8px;background:var(--p2);
  border:1px solid var(--border);border-radius:10px;
  display:flex;flex-wrap:wrap;gap:5px;cursor:text;}
.pm-tags-wrap:focus-within{border-color:var(--accent);}
.pm-tag{display:flex;align-items:center;gap:4px;padding:3px 9px;
  background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);
  border-radius:5px;font-size:11px;color:#93c5fd;white-space:nowrap;}
.pm-tag-x{background:none;border:none;color:#93c5fd;cursor:pointer;font-size:14px;line-height:1;padding:0 1px;opacity:.7;}
.pm-tag-x:active{opacity:1;}
.pm-tag-inp{border:none;background:transparent;color:var(--text);font-size:13px;
  font-family:inherit;outline:none;min-width:80px;flex:1;padding:3px 4px;}
/* Preset chips */
.pm-presets{display:flex;flex-wrap:wrap;gap:5px;}
.pm-chip{padding:4px 10px;border-radius:5px;border:1px solid var(--border);
  background:var(--p2);color:var(--muted);font-size:11px;cursor:pointer;transition:all .15s;}
.pm-chip:active,.pm-chip.on{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,.1);}
/* Star */
.pm-stars{display:flex;gap:5px;}
.pm-star{font-size:22px;color:var(--border);cursor:pointer;line-height:1;transition:color .1s;user-select:none;}
.pm-star.on{color:var(--yellow);}
/* Buttons */
.pm-btns{display:flex;gap:8px;}
.pm-save{flex:1;padding:14px;background:var(--accent);color:#fff;border:none;
  border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;}
.pm-save:active{opacity:.85;}
.pm-dl{padding:14px 16px;background:var(--p2);color:var(--m2);border:1px solid var(--border);
  border-radius:12px;font-size:13px;cursor:pointer;white-space:nowrap;}
.pm-dl:active{opacity:.7;}
.pm-dl.ready{border-color:var(--green);color:var(--green);}
.pm-area{resize:none;height:88px;line-height:1.6;}
.build-tag{position:fixed;left:8px;bottom:calc(var(--nav) + var(--safe-b) + 6px);z-index:40;
  font-size:9px;line-height:1;color:rgba(255,255,255,.6);background:rgba(15,23,42,.45);
  padding:3px 6px;border-radius:8px;pointer-events:none;letter-spacing:-0.2px;
  backdrop-filter:blur(3px);font-variant-numeric:tabular-nums;}
.basemap{filter:saturate(var(--map-sat,1)) brightness(var(--map-bri,1));transition:filter .25s;}
.msat-preset{flex:1;padding:9px 6px;border-radius:8px;border:1px solid var(--border);background:var(--p2);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;}
.msat-preset:active{background:var(--accent);color:#fff;}

/* ═══════════════ Apple-style refinement (iOS HIG) · v2.15 ═══════════════ */
:root{
  --accent:#1E3A5F; --accent-press:#16304F; --accent-soft:#E3E9F1;   /* Sightline · prussian navy */
  --green:#1E9E6A; --orange:#EA6A1F; --yellow:#E0890A; --purple:#8B5CF6; --danger:#E0322B;
  --text:#16202B; --ink:#16202B; --muted:#6A7888; --m2:#39475A; --faint:#9AA6B4;
  --border:#D8DFEA; --line:#D8DFEA; --line2:#C9D2DE; --sep:#D8DFEA; --sep2:#C9D2DE;
  --fill:#F1F4F9; --fill2:#E8EEF6;
  --panel:#FFFFFF; --p2:#F1F4F9; --bg:#EBEFF4; --card:#FFFFFF;
  --glass:rgba(255,255,255,.80); --sheet-bg:rgba(255,255,255,.90); --bar-bg:rgba(248,250,252,.85);
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sh-card:0 1px 2px rgba(16,32,43,.05),0 2px 8px rgba(16,32,43,.05);
  --sh-fab:0 6px 18px rgba(30,58,95,.34),0 2px 6px rgba(16,32,43,.16);
  --track:#C6D0DD; --track-fill:#7E93A8; --tog-off:#BCC7D5;
}
.glassblur{backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);}

/* ── 상단바: 투명 + 라이트 프로스트 로고/버튼 ── */
.top{background:transparent;padding:calc(var(--safe-t) + 10px) 12px 8px;}
.top-logo{flex:1;color:var(--accent);text-shadow:none;font-weight:700;letter-spacing:-.3px;font-size:14px;
  background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  padding:7px 12px;border-radius:11px;box-shadow:0 1px 4px rgba(0,0,0,.10);}
.chip{border:none;border-radius:11px;background:var(--glass);color:var(--text);font-weight:600;text-shadow:none;
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  box-shadow:0 1px 4px rgba(0,0,0,.10);padding:5px 11px;}
.tbtn,.mc{border:none;background:var(--glass);color:var(--text);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  box-shadow:0 1px 4px rgba(0,0,0,.10);transition:transform .15s ease;}
.tbtn{border-radius:11px;}
.mc{border-radius:13px;}
.tbtn:active,.mc:active{transform:scale(.92);}

/* ── FAB: 인디고 + 스프링 + 글로우 ── */
.fab,.fab-green{background:var(--accent);box-shadow:0 6px 20px rgba(88,86,214,.42),0 2px 6px rgba(0,0,0,.16);
  transition:transform .18s cubic-bezier(.2,.9,.3,1.3);}
.fab:active{transform:scale(.9);}

/* ── 하단 탭바: 프로스트 + 인디고 활성 ── */
.nav{background:var(--bar-bg);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  border-top:.5px solid var(--sep);}
.ni{color:var(--muted);transition:color .15s ease;}
.ni-i{font-size:22px;}
.ni-l{font-size:10px;font-weight:500;letter-spacing:-.1px;}
.ni.on{color:var(--accent);}

/* ── 바텀시트: 프로스트 + 큰 코너 + 그래버 ── */
.sheet{background:var(--sheet-bg);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border-radius:18px 18px 0 0;box-shadow:0 -.5px 0 var(--sep),0 -12px 40px rgba(20,24,40,.16);}
.sh-bar{width:36px;height:5px;background:var(--fill2);margin-top:8px;}
.sh-hd{border-bottom:.5px solid var(--sep);padding:10px 18px 12px;}
.sh-title{font-size:17px;font-weight:600;letter-spacing:-.4px;}
.sh-x{border:none;background:var(--fill);color:var(--muted);transition:transform .15s ease;}
.sh-x:active{transform:scale(.92);}

/* ── 레이어: iOS 토글 스위치 + 슬라이더 ── */
.lp-row{border-bottom:.5px solid var(--sep);padding:11px 16px;}
.lp-eye{width:46px;height:28px;border-radius:15px;background:#1E3A5F;position:relative;flex-shrink:0;
  font-size:0;color:transparent;cursor:pointer;transition:background .25s ease;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.04);}
.lp-eye::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.04);transition:transform .25s cubic-bezier(.3,1.3,.5,1);transform:translateX(18px);}
.lp-eye.off{background:var(--fill2);}
.lp-eye.off::after{transform:translateX(0);}
.lp-ico{width:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.lp-cnt{font-size:12px;font-weight:500;color:var(--muted);min-width:18px;text-align:center;flex-shrink:0;}
.lp-nm{flex:1;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lp-grp.cur > .lp-grp-hd{background:#C9D7E8;}
.lp-grp.cur .lp-grp-body .lp-row{background:#EAF0F7;}
.lp-grp-sw{width:46px;height:28px;border-radius:15px;background:#1E3A5F;position:relative;flex-shrink:0;cursor:pointer;outline:2px solid #16314F;outline-offset:-1px;}
.lp-grp-sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;transform:translateX(18px);box-shadow:0 1px 2px rgba(0,0,0,.25);}
.lp-grp-sw.off{background:var(--fill2);outline-color:var(--border);}
.lp-grp-sw.off::after{transform:translateX(0);}
.lp-col{width:11px;height:11px;border-radius:50%;}
.lp-n{font-size:15px;font-weight:500;letter-spacing:-.2px;}
.lp-c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
.lp-sl{height:4px;background:var(--fill2);border-radius:2px;}
.lp-sl::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.05);}
.lp-sl::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:none;box-shadow:0 1px 4px rgba(0,0,0,.28);}
.lp-sl-v{font-variant-numeric:tabular-nums;}
.lp-grp-hd{padding:11px 16px;}
.lp-grp-cnt{font-variant-numeric:tabular-nums;}
.lp-grp-eye{border-radius:9px;}
.lp-sec-lbl{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);}

/* ── 리스트/정보 행 ── */
.li{border-bottom:.5px solid var(--sep);}
.li-th{border-radius:11px;}
.li-n{font-weight:500;letter-spacing:-.2px;}
.li-s{font-variant-numeric:tabular-nums;}

/* ── 버튼 ── */
.sf-save,.kf-ok{background:var(--accent);border-radius:12px;font-weight:600;letter-spacing:-.2px;
  box-shadow:0 2px 10px rgba(88,86,214,.28);transition:transform .15s ease,filter .15s ease;}
.sf-save:active,.kf-ok:active{transform:scale(.985);filter:brightness(.94);}
.mg-btn{border:.5px solid var(--sep);background:var(--card);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:transform .15s ease;}
.mg-btn:active{transform:scale(.97);}
.mg-btn.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(88,86,214,.18);}

/* ── 입력 필드: 흰 카드 + 포커스 링 ── */
.sf-inp,.pm-inp,.kf-inp,.sf-loc{background:var(--card);border:.5px solid var(--sep2);border-radius:11px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.sf-inp:focus,.pm-inp:focus,.kf-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(88,86,214,.15);}
.sf-lbl{font-size:13px;font-weight:500;color:var(--m2);letter-spacing:-.1px;}

/* ── 정보 카드 ── */
.ic-name{letter-spacing:-.3px;}
.ic-row{border-bottom:.5px solid var(--sep);}
.ic-coords{font-variant-numeric:tabular-nums;}

/* ── 토스트: iOS 다크 HUD ── */
.toast{background:rgba(30,30,32,.90);color:#fff;border:none;border-radius:14px;
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 8px 30px rgba(0,0,0,.28);font-weight:500;}
/* ════════════════════════════════════════════════════════════════════════ */


/* ░ Sightline 아이콘 시스템 ░ */
.svi{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle;flex-shrink:0}

/* ░ 하단 탭 리프레시 ░ */
.ni{position:relative}
.ni-i{display:flex !important;align-items:center;justify-content:center;height:24px}
.ni.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:2.5px;border-radius:0 0 3px 3px;background:var(--accent)}

/* Sightline 레이어 패널 */
.lp-eye{background:var(--accent)}
.lp-grp-caret{display:inline-flex;align-items:center;justify-content:center}
.lp-grp-note,.lp-grp-fly{display:inline-flex;align-items:center;justify-content:center;border-radius:8px;transition:background .12s}
.lp-grp-note:hover,.lp-grp-fly:hover{background:var(--fill2)}
.lp-grp-eye{display:inline-flex;align-items:center;justify-content:center}

/* Sightline 시트 헤더 · 컨트롤 · FAB */
.sh-title{display:flex;align-items:center;gap:9px}
.sh-ico{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);display:inline-flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.sh-x{background:var(--fill2);color:var(--m2);border:none}
.sh-x:active{transform:scale(.92)}
.mc{box-shadow:var(--sh-card)}
.fab{box-shadow:var(--sh-fab)}
.lp-sl{accent-color:var(--accent)}
.lp-sl::-webkit-slider-thumb{border:1.5px solid var(--accent);box-shadow:0 1px 2px rgba(16,32,43,.18)}

/* ═══════════════ v3.0 가독성 (전 탭 공통) ═══════════════ */
/* 상단바 — 로고·칩 배경 도형 제거 (지도 위 글씨/아이콘만) */
.top-logo{background:transparent!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;padding:0;
  text-shadow:0 1px 2px rgba(255,255,255,.92),0 0 2px rgba(255,255,255,.7)}
.chip{background:transparent!important;border:none!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;padding:0;
  text-shadow:0 1px 2px rgba(255,255,255,.92)}
/* 토글 OFF — 뚜렷한 회색으로 (껐을 때 명확) */
.lp-eye{box-shadow:inset 0 0 0 1px rgba(16,32,43,.07)}
.lp-eye.off{background:var(--tog-off)}
/* 슬라이더 — 글씨 확대+얇게 · 트랙 가시화 + 연한 채움 · 조정원 또렷 */
.lp-sl-row{gap:5px}
.lp-sl-l{font-size:11px;font-weight:400;color:var(--m2);width:24px}
.lp-sl-v{font-size:12px;font-weight:400;color:var(--ink);width:34px}
.lp-sls{min-width:130px;gap:7px}
.lp-sl{height:5px;width:60px;background:var(--track);border-radius:3px}
.lp-sl::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:17px;height:17px;border-radius:50%;background:#fff;border:2.5px solid var(--accent);box-shadow:0 1px 3px rgba(16,32,43,.30)}
.lp-sl::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:#fff;border:2.5px solid var(--accent);box-shadow:0 1px 3px rgba(16,32,43,.30)}
/* 행 구분 강화 — 레이어·리스트·정보·시트헤더 (전 탭 동일) */
.lp-row{border-bottom:1px solid var(--line2);padding:13px 16px}
.lp-grp-hd{border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.li{border-bottom:1px solid var(--line2)}
.sh-hd{border-bottom:1px solid var(--line2)}

/* ═══════════════ v3.1 제목·내용 색 위계 (옵션 A · 진하게) ═══════════════ */
/* ① 시트 제목 헤더 — 네이비 톤 (전 시트 공통: 레이어·범죄현황·현장조사·더보기·정보) */
.sh-hd{background:#CBD9EC;border-bottom:1px solid #B6C8E0}
.sh-title{color:var(--accent)}
.sh-ico{background:var(--accent);color:#fff}
.sh-x{background:#fff;color:var(--m2)}
/* ② 섹션 제목(현장 작업) — 네이비 글씨 + 액센트 바 */
.lp-sec-lbl{display:flex;align-items:center;gap:7px;color:var(--accent);font-weight:700}
.lp-sec-lbl::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--accent);flex-shrink:0}
/* ③ 그룹 제목(지역) — 옅은 네이비 톤 + 네이비 글씨 (내용 행은 흰 바탕 유지) */
.lp-grp-hd{background:#E1EAF5;color:var(--accent)}
.lp-grp-hd:hover{background:#D8E3F2}

/* ═══════════════ v3.2 지도 선택 시트 + 시트 상단 색 ═══════════════ */
/* 시트 상단 라운드 부분도 색으로 (헤더와 연속) · 본문은 흰색 */
.sheet{background:#CBD9EC}
.sh-bar{background:#AEC0D8}
.sh-body{background:var(--panel)}
/* === 시트 헤더 네이비 (전 시트 공통) — 헤더가 둥근 상단까지 꽉 차게 === */
.sheet{overflow:hidden;}
.sh-bar{width:100%;height:auto;margin:0;padding:11px 0 0;background:#1E3A5F;display:flex;justify-content:center;flex-shrink:0;border-radius:0;}
.sh-bar::after{content:"";width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.4);}
.sh-hd{background:#1E3A5F;border-bottom:none;padding:8px 16px 14px;}
.sh-title{color:#fff;}
.sh-x{background:rgba(255,255,255,.16);color:#fff;border:none;}
/* 더보기(설정 성격)는 기존 라이트블루 헤더 유지 */
.sheet.more-sheet .sh-bar{width:36px;height:4px;margin:9px auto 0;padding:0;background:#AEC0D8;display:block;border-radius:2px;}
.sheet.more-sheet .sh-bar::after{content:none;}
.sheet.more-sheet .sh-hd{background:#CBD9EC;border-bottom:1px solid #B6C8E0;}
.sheet.more-sheet .sh-title{color:var(--accent);}
.sheet.more-sheet .sh-x{background:#fff;color:var(--m2);}
/* 지도·방위표 버튼: 우상단 세로 배치 + 원형 통일 */
.tbtn{width:40px;height:40px;border-radius:50%;}
.mc-north{width:40px;height:40px;border-radius:50%;}
.top-rstack{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
/* 지도 선택 — 섹션 라벨(글로벌·VWorld) 네이비로 또렷하게 */
.mg-sec{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12px;font-weight:700;
  color:var(--accent);letter-spacing:.02em;text-transform:none;padding:12px 2px 5px}
.mg-sec::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--accent);flex-shrink:0}
/* 지도 선택 — 아이콘 색(선택 시 네이비) */
.mg-i{color:var(--m2)}
.mg-btn.on .mg-i{color:var(--accent)}
/* 채도·밝기 슬라이더 — 레이어 탭과 동일 유형 */
.msld{-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:var(--track);outline:none;cursor:pointer;flex:1;min-width:0}
.msld::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:17px;height:17px;border-radius:50%;background:#fff;border:2.5px solid var(--accent);box-shadow:0 1px 3px rgba(16,32,43,.3)}
.msld::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:#fff;border:2.5px solid var(--accent);box-shadow:0 1px 3px rgba(16,32,43,.3)}

/* ═══ v3.3 상단 CPTED MAP 로고 배경 펄 (텍스트 폭 + 약간 여유) ═══ */
.logo-bg{display:inline-block;background:rgba(255,255,255,.9);
  backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);
  padding:6px 16px;border-radius:12px;box-shadow:0 1px 5px rgba(16,32,43,.16),0 0 0 .5px rgba(16,32,43,.04);
  color:var(--accent);text-shadow:none;line-height:1;letter-spacing:-.3px}

var toastTimer;
function toast(msg, ms) {
  clearTimeout(toastTimer);
  var el = document.getElementById('toastEl');
  el.textContent = msg; el.classList.add('on');
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, ms || 2500);
}
function pb(v) { document.getElementById('pb').style.transform = 'scaleX(' + v + ')'; }
function lsSave(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(_) {} }
function lsLoad(k, d) { try { var v = localStorage.getItem(k); return v != null ? JSON.parse(v) : d; } catch(_) { return d; } }
function toDataURL(file) {
  return new Promise(function(res, rej) {
    var r = new FileReader();
    r.onload = function(e) { res(e.target.result); };
    r.onerror = function(){ rej(new Error('파일 읽기 실패')); };
    r.readAsDataURL(file);
  });
}
function fmtDate(d) {
  if (!d) return '';
  try { return (d instanceof Date ? d : new Date(d)).toLocaleString('ko-KR'); } catch(_) { return ''; }
}
function calcDist(a, b, c2, d2) {
  var R=6371000, t=Math.PI/180;
  var da=(c2-a)*t, db=(d2-b)*t;
  var x=Math.sin(da/2)*Math.sin(da/2)+Math.cos(a*t)*Math.cos(c2*t)*Math.sin(db/2)*Math.sin(db/2);
  return R*2*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}
function calcBear(a,b,c2,d2) {
  var t=Math.PI/180;
  var y=Math.sin((d2-b)*t)*Math.cos(c2*t);
  var x=Math.cos(a*t)*Math.sin(c2*t)-Math.sin(a*t)*Math.cos(c2*t)*Math.cos((d2-b)*t);
  return ((Math.atan2(y,x)/t)+360)%360;
}

// ══ INDEXEDDB ══
var db = null;
function openDB() {
  return new Promise(function(res, rej) {
    if (db) { res(db); return; }
    var req = indexedDB.open('cpted_v3', 1);
    req.onupgradeneeded = function(e) {
      var d = e.target.result;
      if (!d.objectStoreNames.contains('photos'))  d.createObjectStore('photos',  {keyPath:'id'});
      if (!d.objectStoreNames.contains('surveys')) d.createObjectStore('surveys', {keyPath:'id'});
    };
    req.onsuccess  = function(e) { db = e.target.result; res(db); };
    req.onerror    = function() { rej(); };
  });
}
function idbAll(store) {
  return openDB().then(function(d) {
    return new Promise(function(res) {
      var q = d.transaction(store,'readonly').objectStore(store).getAll();
      q.onsuccess = function() { res(q.result || []); };
      q.onerror   = function() { res([]); };
    });
  });
}
function idbPut(store, obj) {
  return openDB().then(function(d) {
    return new Promise(function(res) {
      try {
        var tx = d.transaction(store,'readwrite');
        tx.objectStore(store).put(obj);
        tx.oncomplete = function(){ res(true); };
        tx.onerror = function(){ try{console.warn('idbPut 실패', store, tx.error);}catch(_){} res(false); };
        tx.onabort  = function(){ try{console.warn('idbPut 중단', store, tx.error);}catch(_){} res(false); };
      } catch(e){ try{console.warn('idbPut 예외', store, e);}catch(_){} res(false); }
    });
  });
}
function idbDel(store, key) {
  return openDB().then(function(d) {
    return new Promise(function(res) {
      var tx = d.transaction(store,'readwrite');
      tx.objectStore(store).delete(key);
      tx.oncomplete = res; tx.onerror = res;
    });
  });
}
function idbClear(store) {
  return openDB().then(function(d) {
    return new Promise(function(res) {
      var tx = d.transaction(store,'readwrite');
      tx.objectStore(store).clear();
      tx.oncomplete = res; tx.onerror = res;
    });
  });
}
// ── 사진 경량화 헬퍼 (메모리엔 썸네일만, 원본은 IDB에) ──
function idbGet(store, key) {
  return openDB().then(function(d) {

function blobToDataURL(blob){

    try{ var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=function(){res(null);}; r.readAsDataURL(blob); }

function getPhotoFull(id) {

    if (rec.originalUrl) return rec.originalUrl;
    if (rec.full instanceof Blob) return blobToDataURL(rec.full);   // 레거시 Blob 복호

  }).catch(function(){ return null; });

    if (b) return dataUrlToBlob(b);

function photoRecord(meta, imageDataUrl, thumb){
  var rec = photoLite(meta);        // 이미지 필드 제거된 메타데이터
  rec.thumb = thumb || meta.thumb || null;
  if(imageDataUrl){ rec.dataUrl = imageDataUrl; }   // 원본 → base64 문자열(가장 확실한 저장)

function updatePhotoMeta(id, patch){

function makeThumbSafe(src){

// 좌표 → 한국 주소 (VWorld 우선, 실패 시 OSM Nominatim 폴백)
var _addrCache = {};
async function revGeocode(lat, lng) {
  if (lat == null || lng == null) return null;
  var key = lat.toFixed(5) + ',' + lng.toFixed(5);
  if (_addrCache[key]) return _addrCache[key];

  // 1차: VWorld
  if (vwKey) {
    try {
      var url1 = 'https://api.vworld.kr/req/address?service=address&request=getAddress&version=2.0' +
        '&crs=epsg:4326&point=' + lng + ',' + lat +
        '&format=json&type=both&key=' + vwKey;
      var resp = await fetch(url1);
      if (resp.ok) {
        var j = await resp.json();
        if (j && j.response && j.response.status === 'OK' && j.response.result && j.response.result.length) {
          var r = j.response.result.find(function(x){return x.type==='ROAD';}) || j.response.result[0];
          if (r && r.text) {
            var t = r.text.trim();
            var s = r.structure || {};
            if (s.detail && t.indexOf(s.detail) === -1) t = t + ' ' + s.detail;
            _addrCache[key] = t; return t;
          }
        }
      }
    } catch(_) {}
  }

  // 2차: Nominatim
  try {
    var url2 = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1' +
      '&lat=' + lat + '&lon=' + lng + '&accept-language=ko';
    var r2 = await fetch(url2, {headers:{'Accept':'application/json'}});
    if (r2.ok) {
      var j2 = await r2.json();
      var a = j2.address || {};
      var parts = [];
      if (a.province || a.state) parts.push(a.province || a.state);
      if (a.city || a.county) parts.push(a.city || a.county);
      var dist = a.city_district || a.borough;
      if (dist && dist !== (a.city||a.county)) parts.push(dist);
      var town = a.town || a.suburb || a.village || a.hamlet;
      if (town) parts.push(town);
      if (a.road) {
        var rn = a.road;
        if (a.house_number) rn += ' ' + a.house_number;
        parts.push(rn);
      }
      if (parts.length >= 2) {
        var nice = parts.join(' ');
        _addrCache[key] = nice; return nice;
      }
    }
  } catch(_) {}

  return null;
}

function startCompass() {
  if (compassStarted) return;
  var _lastNavRot = 0, _lastApplied = -999;
  function onOrient(e) {
    var h = null;
    if (e.webkitCompassHeading != null) {
      h = e.webkitCompassHeading;                 // iOS: 정북 기준 시계방향(정확)
    } else if (e.alpha != null) {
      h = 360 - e.alpha;                          // Android alpha
      // 화면 세로/가로 회전 보정
      var so = 0;
      if (screen.orientation && screen.orientation.angle != null) so = screen.orientation.angle;
      else if (window.orientation != null) so = window.orientation;
      h = h - so;
    }
    if (h == null || isNaN(h)) return;
    h = ((h % 360) + 360) % 360;
    var sh = smoothHeading(h);
    deviceHeading = sh;
    if (navMode && !northLock) {
      _navTarget = -sh;                                       // 추종 목표만 갱신 (실제 회전은 navTick)
      if (!_navRaf) _navRaf = requestAnimationFrame(navTick);
    } else {
      updateLocCone(sh);
    }
  }
  // deviceorientationabsolute 우선 (절대 방위 — 안드로이드 안정성 ↑)
  if ('ondeviceorientationabsolute' in window) {
    window.addEventListener('deviceorientationabsolute', onOrient, true);
    compassStarted = true;
  } else if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    if (_compassAsking) return;   // iOS: 같은 탭의 pointerdown+touchstart 중복 권한요청 방지
    _compassAsking = true;
    DeviceOrientationEvent.requestPermission().then(function(resp){
      _compassAsking = false;
      if (resp === 'granted') {
        window.addEventListener('deviceorientation', onOrient, true);
        compassStarted = true;
        toast('🧭 방향 표시 활성화');
      } else { toast('나침반 권한 거부됨'); }
    }).catch(function(){ _compassAsking = false; });
  } else {
    window.addEventListener('deviceorientation', onOrient, true);
    compassStarted = true;
  }
}
// 방위를 즉시 잡되, 아직 첫 측정값이 없으면 최대 1.5초까지 기다렸다가 콜백
function captureHeadingSoon(cb) {
  try { startCompass(); } catch(_){}
  function val(){ return (deviceHeading != null && !isNaN(deviceHeading)) ? Math.round(((deviceHeading % 360) + 360) % 360) : null; }
  var v = val();
  if (v != null) { cb(v); return; }
  var tries = 0;
  var iv = setInterval(function(){
    tries++;
    var vv = val();
    if (vv != null) { clearInterval(iv); cb(vv); }
    else if (tries >= 15) { clearInterval(iv); cb(null); }
  }, 100);
}

function requestLocation(btn) {
  btn.textContent = '⏳';
  locRequesting = true;
  startCompass();  // 방향 표시 활성화 (iOS 권한 요청 포함)

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      btn.textContent = '📍';
      locRequesting = false;
      var lat = pos.coords.latitude, lng = pos.coords.longitude, acc = pos.coords.accuracy;
      setLoc(lat, lng, acc);
      lastPos = {lat: lat, lng: lng};
      map.setView([lat, lng], 17);
      toast('📍 ' + lat.toFixed(5) + ', ' + lng.toFixed(5));

      // 성공 후에만 연속 추적 시작
      if (watcher) { navigator.geolocation.clearWatch(watcher); watcher = null; }
      watcher = navigator.geolocation.watchPosition(
        function(p) {
          setLoc(p.coords.latitude, p.coords.longitude, p.coords.accuracy);
          lastPos = {lat: p.coords.latitude, lng: p.coords.longitude};
          // 네비 모드 회전은 나침반(deviceHeading)이 담당 — GPS heading 사용 안 함
        },
        function(){},
        {enableHighAccuracy: true, timeout: 30000, maximumAge: 3000}
      );
    },
    function(err) {
      btn.textContent = '📍';
      locRequesting = false;
      if (err.code === 1) {       // PERMISSION_DENIED
        toast('📍 위치 권한이 거부됨 — 브라우저 설정에서 허용 필요');
      } else if (err.code === 2) { // POSITION_UNAVAILABLE
        toast('❌ 위치를 확인할 수 없음 — 실내거나 GPS 신호 약함');
      } else if (err.code === 3) { // TIMEOUT
        toast('❌ 시간 초과 — 다시 시도하거나 야외에서 시도');
      } else {
        toast('❌ ' + err.message);
      }
    },
    {enableHighAccuracy: true, timeout: 15000, maximumAge: 0}
  );
}

document.getElementById('locBtn').addEventListener('click', function() {
  if (!navigator.geolocation) { toast('❌ GPS를 지원하지 않는 기기'); return; }
  if (!window.isSecureContext) { toast('📍 위치 기능은 HTTPS(willtill.github.io)에서만 작동'); return; }
  var btn = this;
  // Permissions API로 사전 확인 (지원 기기)
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({name:'geolocation'}).then(function(res){
      if (res.state === 'denied') { toast('📍 위치 권한이 거부됨 — 브라우저 설정에서 허용 필요'); return; }
      requestLocation(btn);
    }).catch(function(){ requestLocation(btn); });
  } else {
    requestLocation(btn);
  }
});

function applyVis(id) {
  var ly = LAYERS[id];
  if (id==='boundary'||id==='boundary_smj'||id==='boundary_sj'||id==='boundary_bs'||id==='boundary_gn'||id==='boundary_un') { drawBoundaries(); return; }
  if (ly.wmsId && ly.wms) { ly.visible ? map.addLayer(ly.wms) : map.removeLayer(ly.wms); return; }
  if (id==='photo') { cullPhotoMarkers(); return; }   // 사진: 가시성+뷰포트 동시 반영
  ly.mkrs.forEach(function(m){ ly.visible ? map.addLayer(m) : map.removeLayer(m); });
}
function addMkr(id, m) {
  var ly = LAYERS[id];
  ly.mkrs.push(m); ly.cnt = ly.mkrs.length;
  if (!ly.visible) map.removeLayer(m);
  var setOp = function(){ var e=m.getElement(); if(e) e.style.opacity=ly.opacity; };
  setOp(); m.on('add', setOp);
}
function setLayerOp(id, v) {
  LAYERS[id].opacity = v;
  if (id==='boundary'||id==='boundary_smj'||id==='boundary_sj'||id==='boundary_bs'||id==='boundary_gn'||id==='boundary_un') { drawBoundaries(); saveLayers(); return; }
  if (LAYERS[id].wmsId && LAYERS[id].wms) { LAYERS[id].wms.setOpacity(v); saveLayers(); return; }
  LAYERS[id].mkrs.forEach(function(m){ var e=m.getElement(); if(e) e.style.opacity=v; });
  saveLayers();
}
function _baseSz(id){
  if(L_BASE[id]!=null) return L_BASE[id];
  if(id.indexOf('bell')===0) return 18;
  if(id.indexOf('vacant')===0||id.indexOf('light')===0||id.indexOf('cctv')===0||id.indexOf('park')===0||id.indexOf('post')===0) return 16;
  return 20;
}
function setLayerSz(id, v) {
  // 경계선: sz 슬라이더는 선 두께를 의미
  if (id==='boundary' || id==='boundary_smj' || id==='boundary_sj' || id==='boundary_bs' || id==='boundary_gn' || id==='boundary_un') {
    LAYERS[id].weight = v;
    drawBoundaries();
    saveLayers(); return;
  }
  LAYERS[id].sz = v;
  var base = _baseSz(id), sz = Math.round(base*v);
  LAYERS[id].mkrs.forEach(function(m){
    var ico;
    if (id.indexOf('vacant')===0)  ico = L.divIcon({html:'<div class="vh-pin">'+vhSvg(sz)+'</div>',className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz]});
    else if (id.indexOf('light')===0)  ico = ciIcon('#f59e0b','💡',sz);
    else if (id.indexOf('cctv')===0)   ico = ciIcon('#3b82f6','📹',sz);
    else if (id.indexOf('bell')===0)   ico = ciIcon(LAYERS[id].color,'🔔',sz);
    else if (id.indexOf('park')===0)   ico = ciIcon(LAYERS[id].color,'🅿',sz);
    else if (id.indexOf('post')===0)   ico = ciIcon(LAYERS[id].color,'🚨',sz);
    else if (id==='survey') ico = svIcon(m._sv, sz);
    else if (id==='photo')  ico = pinIcon(m._pd||'', sz, m._heading);
    if (ico) m.setIcon(ico);
  });
  saveLayers();
}
function saveLayers() {
  var s={};
  Object.keys(LAYERS).forEach(function(k){s[k]={visible:LAYERS[k].visible,opacity:LAYERS[k].opacity,sz:LAYERS[k].sz,weight:LAYERS[k].weight};});
  lsSave('ly4', s);
}
function loadLayers() {
  var s = lsLoad('ly4', null); if (!s) return;
  Object.keys(s).forEach(function(k){if(LAYERS[k]){LAYERS[k].visible=s[k].visible;LAYERS[k].opacity=s[k].opacity;LAYERS[k].sz=s[k].sz||1;if(s[k].weight)LAYERS[k].weight=s[k].weight;}});
}

// ══ SAFEMAP WMS (범죄주의구간 — 5종) ══
// 경찰청 생활안전지도: IF_0083(폭력)·0084(절도)·0085(성폭력)·0086(강도)·0087(전체)
function initSafemap() {
  if (!_sk) {
    console.log('[SafeMap] 키 미설정 — 임베드 후 사용 가능');
    return;
  }
  // wmsId가 있는 모든 레이어 자동 초기화 (범죄 5종 + 시설물 2종)
  var errOnce = false;
  Object.keys(LAYERS).forEach(function(lid){
    var ly = LAYERS[lid];
    if (!ly.wmsId) return;
    var url = 'https://www.safemap.go.kr/openapi2/' + ly.wmsId + '_WMS?serviceKey=' + encodeURIComponent(_sk);
    var wms = L.tileLayer.wms(url, {
      layers:      ly.wmsLayer || 'A2SM_CRMNLHSPOT_TOT',
      styles:      ly.wmsStyle || '',
      format:      'image/png',
      transparent: true,
      version:     '1.1.1',
      opacity:     ly.opacity,
      attribution: '© 경찰청 · 생활안전지도',
      pane:        'tilePane',
      zIndex:      200
    });
    wms.on('tileerror', function(){
      if (errOnce) return; errOnce = true;
      toast('⚠ 생활안전지도 타일 오류 — 키 또는 도메인 제한 확인', 4000);
    });
    ly.wms = wms;
    ly.cnt = 1;
  });
}

function pinIcon(dataUrl, sz, heading) {

    var rot = heading + b; // 화면상 각도 = 촬영방위 + 지도 회전각 (locCone과 동일 보정)
    dir = '<div class="pin-dir" data-h="'+heading+'" style="position:absolute;left:0;top:0;width:'+sz+'px;height:'+sz+'px;transform:rotate('+rot+'deg);transform-origin:50% 50%;pointer-events:none;z-index:2;">'

// ESC 키로 열린 팝업/시트 닫기 (PC)
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Escape' && e.key !== 'Esc') return;
  var infoOpen  = document.getElementById('infoSheet').classList.contains('on');
  var sheetOpen = document.getElementById('sheet').classList.contains('on');
  if (infoOpen)        { closeInfo(); }     // 마커 클릭 정보창 우선
  else if (sheetOpen)  { closeAll(); }      // 데이터·레이어·현장조사 등 시트
  else if (typeof fabOpen !== 'undefined' && fabOpen) { fabClose(); }
});
// swipe down to close — 상단(손잡이·헤더)에서 시작한 드래그만 닫기. 본문 드래그는 닫지 않음(작업 중 오작동 방지)
['sheet','infoSheet'].forEach(function(id){
  var el=document.getElementById(id), sy=0, armed=false;
  el.addEventListener('touchstart',function(e){
    var t=e.target;
    armed = !!(t && t.closest && t.closest('.sh-bar, .sh-hd'));   // 손잡이·헤더에서 시작할 때만 무장
    sy=e.touches[0].clientY;

  el.addEventListener('touchend',function(e){
    if(armed && e.changedTouches[0].clientY-sy>70) closeAll();
    armed=false;
  },{passive:true});

// ══ INIT LAYERS ══
// ── 경계 커스텀 오버레이 (회전 중에도 정확) ──
// 마커와 동일한 회전 좌표계로 직접 그려, 플러그인의 벡터 회전 버그를 우회
function simplifyRing(ring, tol){
  // 인접 중복점 제거(거리 tol 이하) — 모양 유지하며 점 수 감소 → 다시 그리기 비용↓
  if (!ring || ring.length <= 4) return ring;
  var out = [ring[0]], last = ring[0], t2 = tol*tol;
  for (var i=1; i<ring.length-1; i++){
    var dy = ring[i][0]-last[0], dx = ring[i][1]-last[1];
    if (dx*dx + dy*dy >= t2){ out.push(ring[i]); last = ring[i]; }
  }
  out.push(ring[ring.length-1]);
  return out;
}
function bndRings(){
  // 청림동(geoJSON): coordinates [[[lng,lat],...]] → [[lat,lng],...]
  try {
    var coords = BOUNDARY.features[0].geometry.coordinates;
    LAYERS.boundary.rings = coords.map(function(ring){
      return ring.map(function(c){ return [c[1], c[0]]; });
    });
  } catch(_) { LAYERS.boundary.rings = []; }
  LAYERS.boundary_smj.rings = (typeof BOUNDARY_SMJ!=='undefined' && BOUNDARY_SMJ.length) ? [BOUNDARY_SMJ] : [];
  LAYERS.boundary_sj.rings  = (typeof BOUNDARY_SJ!=='undefined'  && BOUNDARY_SJ.length)  ? [BOUNDARY_SJ]  : [];
  LAYERS.boundary_bs.rings  = (typeof BOUNDARY_BS!=='undefined'  && BOUNDARY_BS.length)  ? [BOUNDARY_BS]  : [];
  LAYERS.boundary_gn.rings  = (typeof BOUNDARY_GN!=='undefined'  && BOUNDARY_GN.length)  ? [BOUNDARY_GN]  : [];
  LAYERS.boundary_un.rings  = (typeof BOUNDARY_UN!=='undefined'  && BOUNDARY_UN.length)  ? [BOUNDARY_UN]  : [];
  LAYERS.boundary.cnt = LAYERS.boundary.rings.length ? 1 : 0;
  LAYERS.boundary_smj.cnt = LAYERS.boundary_smj.rings.length ? 1 : 0;
  LAYERS.boundary_sj.cnt = LAYERS.boundary_sj.rings.length ? 1 : 0;
  LAYERS.boundary_bs.cnt = LAYERS.boundary_bs.rings.length ? 1 : 0;
  LAYERS.boundary_gn.cnt = LAYERS.boundary_gn.rings.length ? 1 : 0;
  LAYERS.boundary_un.cnt = LAYERS.boundary_un.rings.length ? 1 : 0;
  // 간소화(약 3m) + 경계별 bbox 계산(화면 밖 컬링용)
  ['boundary','boundary_smj','boundary_sj','boundary_bs','boundary_gn','boundary_un'].forEach(function(id){
    var ly = LAYERS[id];
    if (!ly.rings || !ly.rings.length) { ly._bbox = null; return; }
    ly.rings = ly.rings.map(function(r){ return simplifyRing(r, 0.00003); });
    var b = L.latLngBounds();
    ly.rings.forEach(function(r){ r.forEach(function(ll){ b.extend(ll); }); });
    ly._bbox = b.isValid() ? b : null;
  });
}
var bndSvg = null, bndPaneEl = null, _bndRaf = null, _bndPaths = {};
function initBoundary(){
  bndRings();
  // 타일(아래)과 마커(위) 사이 전용 pane 생성
  if (!map.getPane('bndPane')) {
    map.createPane('bndPane');
    bndPaneEl = map.getPane('bndPane');
    bndPaneEl.style.zIndex = 250;
    bndPaneEl.style.pointerEvents = 'none';
    // 경계가 타일 위·마커 아래에 오도록 회전/논회전 pane z-index 명시
    if (map.getPane('rotatePane'))   map.getPane('rotatePane').style.zIndex = 200;
    if (map.getPane('norotatePane')) map.getPane('norotatePane').style.zIndex = 300;
  } else {
    bndPaneEl = map.getPane('bndPane');
  }
  var NS = 'http://www.w3.org/2000/svg';
  bndSvg = document.createElementNS(NS, 'svg');
  bndSvg.style.cssText = 'position:absolute;top:0;left:0;overflow:visible;';
  bndPaneEl.appendChild(bndSvg);
  // 경로 요소를 미리 만들어 재사용 (매번 DOM 재생성하지 않음 → 빠름)
  ['boundary','boundary_smj','boundary_sj','boundary_bs','boundary_gn','boundary_un'].forEach(function(id){
    var p = document.createElementNS(NS,'path');
    p.setAttribute('stroke-dasharray','6 4');
    p.setAttribute('stroke-linejoin','round');
    bndSvg.appendChild(p);
    _bndPaths[id] = p;
  });
  // 줌(핀치 중 포함)·회전·뷰 변경 시 좌표 재계산. pan은 mapPane가 함께 옮기므로 제외.
  map.on('zoom zoomend rotate viewreset resize moveend', requestBndDraw);
  map.on('moveend zoomend', cullPhotoMarkers);   // 사진 마커 뷰포트 컬링(이동·줌 종료 시)
  requestBndDraw();
}
function requestBndDraw(){
  if (_bndRaf) return;
  _bndRaf = requestAnimationFrame(function(){ _bndRaf = null; drawBoundaries(); });
}
function drawBoundaries(){
  if (!bndSvg) return;
  var view = null;
  try { view = map.getBounds().pad(0.3); } catch(_){}   // 회전 포함 현재 화면 범위(여유 30%)
  ['boundary','boundary_smj','boundary_sj','boundary_bs','boundary_gn','boundary_un'].forEach(function(id){
    var ly = LAYERS[id], path = _bndPaths[id];
    if (!path) return;
    if (!ly || !ly.visible || !ly.rings || !ly.rings.length) { path.setAttribute('d',''); return; }
    if (view && ly._bbox && !view.intersects(ly._bbox)) { path.setAttribute('d',''); return; } // 화면 밖이면 건너뜀
    var d = '';
    ly.rings.forEach(function(ring){
      for (var i=0; i<ring.length; i++){
        var lp = map.latLngToLayerPoint(ring[i]);
        var p = map._rotate ? map.rotatedPointToMapPanePoint(lp) : lp;  // 마커와 동일한 좌표계
        d += (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ' ';
      }
      d += 'Z ';
    });
    path.setAttribute('d', d);            // 좌표만 갱신 — DOM 재생성 없음
    path.setAttribute('fill', ly.color);
    path.setAttribute('fill-opacity', ly.opacity);
    path.setAttribute('stroke', ly.color);
    path.setAttribute('stroke-width', ly.weight);
    path.setAttribute('stroke-opacity', '0.95');
  });
}

// ══ PHOTOS ══
var photos = [];
var _origFiles = {};   // 세션 원본 파일 보관(id→File/Blob) — IDB가 대용량 저장에 실패해도 내보내기 원본 확보. 바이트는 내보낼 때만 읽음.
// 사진 마커용 CPTED 정보 HTML 생성
function buildPhotoInfoRows(p) {
  var parsed = (typeof parseStructuredDesc==='function') ? parseStructuredDesc(p.desc||'') : {cats:[],rating:0,tags:[],date:'',memo:''};
  var cats   = (p.cats&&p.cats.length) ? p.cats   : parsed.cats;
  var tags   = (p.tags&&p.tags.length) ? p.tags   : parsed.tags;
  var rating = (p.rating && !isNaN(p.rating)) ? Number(p.rating) : parsed.rating;
  var memo   = p.memo                          || parsed.memo;
  var date   = p.date                          || parsed.date;
  cats = cats.filter(function(c){ return c && c!=='[object Object]'; });
  tags = tags.filter(function(t){ return t && t!=='[object Object]'; });
  if (typeof date==='object') date = extractXMPString(date);

  var rows = '';

  // ── 1. 빠른 메타 정보 (조사일·위치·날짜)
  if (date)        rows += '<div class="ic-row"><div class="ic-k">조사일</div><div class="ic-v">'+date+'</div></div>';
  if (p.gpsSource) rows += '<div class="ic-row"><div class="ic-k">위치출처</div><div class="ic-v">'+p.gpsSource+'</div></div>';

  // ── 2. CPTED 분류 카드 (강조)
  if (cats.length || rating || tags.length) {
    rows += '<div style="margin:12px 0;padding:12px 14px;background:rgba(37,99,235,.06);border-left:3px solid var(--accent);border-radius:8px;">';
    rows += '<div style="font-size:10px;font-weight:700;color:var(--accent);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;">CPTED MAP</div>';
    if (cats.length) rows += '<div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;">📌 '+cats.join(' · ')+'</div>';
    if (rating)      rows += '<div style="font-size:14px;margin-bottom:4px;">'
      +'<span style="color:var(--yellow);letter-spacing:2px;">'+'★'.repeat(rating)+'<span style="opacity:.25">'+'★'.repeat(5-rating)+'</span></span>'
      +' <span style="color:var(--muted);font-size:11px;margin-left:6px;">취약도 '+rating+'/5</span></div>';
    if (tags.length) rows += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;">'
      +tags.map(function(t){
        return '<span style="background:#fff;color:var(--accent);border:1px solid rgba(37,99,235,.25);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:500;">#'+t+'</span>';
      }).join('')+'</div>';
    rows += '</div>';
  }

  // ── 3. 관찰 메모 (자유 기록 — 있으면 별도 강조)
  if (memo) {
    rows += '<div style="margin:10px 0;padding:12px 14px;background:var(--p2);border-radius:8px;border-left:3px solid var(--green);">'
      +'<div style="font-size:10px;font-weight:700;color:var(--green);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;">'+svgIc('note','width:13px;height:13px;color:var(--green);vertical-align:-2px;margin-right:4px')+'관찰 메모</div>'
      +'<div style="font-size:13px;line-height:1.7;color:var(--text);white-space:pre-wrap;">'+memo+'</div>'
      +'</div>';
  }

  // ── 4. XMP 원본 설명 (Windows 속성 → 설명에 들어있는 내용 그대로)
  if (p.desc) {
    rows += '<details style="margin-top:10px;background:var(--p2);border-radius:8px;border:1px solid var(--border);">'
      +'<summary style="cursor:pointer;padding:10px 14px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.5px;list-style:none;">📄 XMP 원본 (Windows 속성 「설명」 필드)</summary>'
      +'<div style="padding:0 14px 12px;font-family:monospace;font-size:11px;line-height:1.7;white-space:pre-wrap;color:var(--m2);">'+p.desc+'</div>'
      +'</details>';
  }

  // ── 5. 정보 전혀 없을 때
  if (!cats.length && !rating && !tags.length && !memo && !p.desc)
    rows += '<div style="color:var(--muted);font-size:12px;padding:12px;text-align:center;background:var(--p2);border-radius:8px;margin-top:8px;">CPTED 분류 정보 없음 (촬영 시 미입력)</div>';

  return rows;
}

// 사진 핀 아이콘 — pinIcon 실패 시 기본 핀으로 대체(마커 생성 자체는 절대 막지 않음)
var _pinFail = {n:0, msg:''};
function _photoIcon(p){
  var sz = Math.round(42*(LAYERS.photo.sz||1))||42;
  try{ return pinIcon(p.thumb||p.dataUrl, sz, p.heading); }
  catch(e){
    _pinFail.n++; if(!_pinFail.msg) _pinFail.msg = (e&&e.message)?e.message:String(e);
    return L.divIcon({html:'<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#10b981;border:3px solid #fff;box-shadow:0 3px 10px rgba(16,185,129,.45);"></div>', className:'', iconSize:[sz,sz], iconAnchor:[sz/2,sz]});
  }
}
function mkPhotoMkr(p, noAdd) {
  var sz = Math.round(42 * LAYERS.photo.sz);
  var m = L.marker([p.lat,p.lng], {icon:_photoIcon(p)});
  if(!noAdd) m.addTo(map);   // 컬링 경로(rebuild)는 noAdd=true로 만들고, 화면 안 마커만 cull이 추가
  m._pd = p.thumb||p.dataUrl;   // 크기 슬라이더 재렌더용(썸네일)
  m._pid = p.id;
  m._heading = (p.heading != null ? p.heading : null);

  // ── PC 전용: 호버 팝업 (사진 + 전체 정보)
  m.on('mouseover', function() {
    // 모바일/터치 기기는 호버 비활성화
    if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
        (navigator.maxTouchPoints > 1 && /Mac/i.test(navigator.userAgent))) return;
    var parsed = (typeof parseStructuredDesc==='function') ? parseStructuredDesc(p.desc||'') : {cats:[],rating:0,tags:[],memo:''};
    var cats   = (p.cats&&p.cats.length) ? p.cats : parsed.cats;
    var tags   = (p.tags&&p.tags.length) ? p.tags : parsed.tags;
    var rating = p.rating || parsed.rating;
    var memo   = p.memo || parsed.memo;

    var safeNameH = (p.name && p.name !== '[object Object]') ? p.name : '현장 사진';
    var infoHtml =
      '<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px;line-height:1.3;">'+safeNameH+'</div>';
    if (cats.length) infoHtml += '<div style="font-size:11px;color:var(--accent);margin-bottom:3px;font-weight:600;">📌 '+cats.join(' · ')+'</div>';
    if (rating) infoHtml += '<div style="font-size:12px;margin-bottom:3px;">'
      +'<span style="color:var(--yellow)">'+'★'.repeat(rating)+'</span>'
      +'<span style="color:var(--border)">'+'★'.repeat(5-rating)+'</span>'
      +' <span style="color:var(--muted);font-size:10px;">취약도 '+rating+'/5</span></div>';
    if (tags.length) infoHtml += '<div style="font-size:10px;color:var(--muted);margin-bottom:3px;">'

// 사진 마커 일괄 재생성 — photos[] 기준. 핀이 안 보일 때 복구 + 실패 원인 진단 노출
function rebuildPhotoMarkers(opts){
  opts = opts || {};
  _pinFail = {n:0, msg:''};
  try{ LAYERS.photo.mkrs.forEach(function(m){ try{ map.removeLayer(m); }catch(_){} }); }catch(_){}
  LAYERS.photo.mkrs = []; LAYERS.photo.cnt = 0;
  var withCoords=0, made=0, addFail=0, firstErr='';
  photos.forEach(function(p){
    if(!(typeof p.lat==='number' && isFinite(p.lat) && typeof p.lng==='number' && isFinite(p.lng))) return;
    withCoords++;
    try{ addMkr('photo', mkPhotoMkr(p, true)); made++; }
    catch(e){ addFail++; if(!firstErr) firstErr=(e&&e.message)?e.message:String(e); }
  });
  cullPhotoMarkers();   // 화면 영역의 마커만 지도에 표시
  updCounts();
  var diag={total:photos.length, coords:withCoords, made:made, addFail:addFail, pinFail:_pinFail.n, err:(firstErr||_pinFail.msg)};
  if(opts.toast){
    var msg='\uD83D\uDCF7 \uB9C8\uCEE4 '+made+'\uAC1C \uD45C\uC2DC \u00B7 \uC88C\uD45C\uC788\uC74C '+withCoords+'/'+photos.length;
    if(_pinFail.n) msg+=' \u00B7 \uC0AC\uC9C4\uD540 '+_pinFail.n+'\uAC74\u2192\uAE30\uBCF8\uD540';
    if(addFail) msg+=' \u00B7 \uC2E4\uD328 '+addFail+'\uAC74';
    if(diag.err) msg+=' \u00B7 '+diag.err;
    toast(msg, 8000);
  }
  console.log('[rebuildPhotoMarkers]', diag);
  return diag;
}
// 뷰포트 컬링 — 현재 화면 영역(+여유 30%)에 들어오는 사진 마커만 지도에 표시.
// mkrs 자체는 그대로 두고 지도 멤버십만 토글하므로 카운트·목록엔 영향 없음.
function cullPhotoMarkers(){
  var ly = LAYERS.photo; if(!ly) return;
  if(!ly.visible){ ly.mkrs.forEach(function(m){ if(map.hasLayer(m)) map.removeLayer(m); }); return; }
  var b; try{ b = map.getBounds().pad(0.3); }catch(_){ b=null; }
  if(!b){ ly.mkrs.forEach(function(m){ if(!map.hasLayer(m)) map.addLayer(m); }); return; }
  var s=b.getSouth(), n=b.getNorth(), w=b.getWest(), e=b.getEast();
  ly.mkrs.forEach(function(m){
    var ll; try{ ll=m.getLatLng(); }catch(_){ return; }
    var vis = ll.lat>=s && ll.lat<=n && ll.lng>=w && ll.lng<=e;
    if(vis){ if(!map.hasLayer(m)) map.addLayer(m); }
    else if(map.hasLayer(m)){ map.removeLayer(m); }
  });
}
async function processPhotos(files) {
  var arr = Array.from(files).filter(function(f){return f.type.startsWith('image/');});
  if (!arr.length) return;
  pb(.05);
  for (var i=0; i<arr.length; i++) {
    pb((i+1)/arr.length);
    var url = await toDataURL(arr[i]);
    var lat=null,lng=null,dt=null,imgDir=null;
    try { var ex=await (await ensureExifr()).parse(arr[i],{gps:true,ifd0:true}); if(ex&&ex.latitude!=null){lat=ex.latitude;lng=ex.longitude;} if(ex)dt=fmtDate(ex.DateTimeOriginal||ex.DateTime); if(ex&&ex.GPSImgDirection!=null)imgDir=ex.GPSImgDirection; } catch(_){}
    if (!lat && lastPos) { lat=lastPos.lat; lng=lastPos.lng; toast('📍 EXIF GPS 없음 — 현재 위치 사용'); }
    if (!lat) {
      var gpsResult = await new Promise(function(res) {
        if (!navigator.geolocation) { res(null); return; }
        navigator.geolocation.getCurrentPosition(
          function(p) { lastPos={lat:p.coords.latitude,lng:p.coords.longitude}; res(lastPos); },
          function()  { res(null); },
          {enableHighAccuracy:true, timeout:8000, maximumAge:0}
        );
      });
      if (gpsResult) { lat=gpsResult.lat; lng=gpsResult.lng; toast('📍 현재 위치로 저장됨'); }
      else { toast('⚠️ GPS를 확인할 수 없음 — 위치 없이 저장'); }
    }
    var disp = await compressImage(url, 1280, 0.72);   // 1280px 표시·저장본 (원본 그대로 저장 시 용량 초과로 IDB 저장 실패 → 200px 폴백 발생)
    var p = {id:'p'+Date.now()+'_'+i, name:arr[i].name, dataUrl:disp, lat:lat, lng:lng, date:dt, hasGps:true, heading:(imgDir!=null&&!isNaN(imgDir))?Math.round(((imgDir%360)+360)%360):null};
    p.thumb = await makeThumb(disp);        // 200px 썸네일(지도·목록·호버)
    await idbPut('photos', photoRecord(p, disp, p.thumb));   // 1280px 표시 레코드(작고 확실)
    // 원본(풀해상도+EXIF) 보관 (JPEG만): ① 세션 메모리(파일 핸들, 확실) ② IDB(영속, 용량 가능 시)
    if(arr[i].type==='image/jpeg' || /\.jpe?g$/i.test(arr[i].name)){
      _origFiles[p.id] = arr[i];   // 세션 원본 — 내보낼 때 직접 사용(IDB 실패와 무관)
      try{ await updatePhotoMeta(p.id, {origBlob: arr[i]}); }catch(_){}   // IDB 영속(되는 기기에선 다음 세션도 유지)
    }
    var pLite = photoLite(p);              // 메모리: 메타+썸네일+1280px (원본은 IDB에만)
    photos.push(pLite);
    addMkr('photo', mkPhotoMkr(pLite));
    updCounts();
  }
  setTimeout(function(){pb(0);}, 500);
  toast('📷 '+arr.length+'개 추가됨');
}

// ══ XMP INJECTION ══
function buildXMPPacket(meta) {
  var esc = function(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
  var tagItems = (meta.tags||[]).map(function(t){ return '      <rdf:li>'+esc(t)+'</rdf:li>'; }).join('\n');
  var now = new Date().toISOString();
  var desc = esc(meta.description||'');
  // Windows 속성 필드 매핑:
  //   제목  ← dc:title
  //   주제  ← dc:description (rdf:Alt)
  //   태그  ← dc:subject (rdf:Bag)
  //   등급  ← xmp:Rating
  //   설명  ← exif:UserComment (rdf:Alt)  ← 핵심
  return '<?xpacket begin="\uFEFF" id="W5M0MpCehiHzreSzNTczkc9d"?>\n'+
    '<x:xmpmeta xmlns:x="adobe:ns:meta/">\n'+
    ' <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">\n'+
    '  <rdf:Description rdf:about=""\n'+
    '    xmlns:dc="http://purl.org/dc/elements/1.1/"\n'+
    '    xmlns:xmp="http://ns.adobe.com/xap/1.0/"\n'+
    '    xmlns:exif="http://ns.adobe.com/exif/1.0/">\n'+
    '   <dc:title><rdf:Alt><rdf:li xml:lang="x-default">'+esc(meta.title)+'</rdf:li></rdf:Alt></dc:title>\n'+
    '   <dc:description><rdf:Alt><rdf:li xml:lang="x-default">'+desc+'</rdf:li></rdf:Alt></dc:description>\n'+
    '   <exif:UserComment><rdf:Alt><rdf:li xml:lang="x-default">'+desc+'</rdf:li></rdf:Alt></exif:UserComment>\n'+
    '   <dc:subject><rdf:Bag>\n'+tagItems+'\n   </rdf:Bag></dc:subject>\n'+
    '   <xmp:Rating>'+(meta.rating||0)+'</xmp:Rating>\n'+
    '   <xmp:CreateDate>'+now+'</xmp:CreateDate>\n'+
    ((meta.heading!=null && !isNaN(meta.heading)) ? '   <exif:GPSImgDirection>'+Math.round(((meta.heading%360)+360)%360)+'</exif:GPSImgDirection>\n' : '')+
    '  </rdf:Description>\n'+
    ' </rdf:RDF>\n'+
    '</x:xmpmeta>\n'+
    '<?xpacket end="w"?>';
}

async function injectXMPIntoJPEG(file, xmpString) {
  var buf = await file.arrayBuffer();
  var bytes = new Uint8Array(buf);
  if (bytes[0] !== 0xFF || bytes[1] !== 0xD8) throw new Error('JPEG 파일이 아닙니다');
  var ns = 'http://ns.adobe.com/xap/1.0/\0';
  var nsBytes = new TextEncoder().encode(ns);
  var xmpBytes = new TextEncoder().encode(xmpString);
  var segLen = 2 + nsBytes.length + xmpBytes.length;
  if (segLen > 65533) throw new Error('메타데이터가 너무 큽니다');
  var seg = new Uint8Array(4 + nsBytes.length + xmpBytes.length);
  seg[0]=0xFF; seg[1]=0xE1;
  seg[2]=(segLen>>8)&0xFF; seg[3]=segLen&0xFF;
  seg.set(nsBytes, 4);
  seg.set(xmpBytes, 4 + nsBytes.length);
  // 삽입 위치: SOI 다음, APP0 있으면 그 뒤
  var insertPos = 2;
  if (bytes[2]===0xFF && bytes[3]===0xE0) {
    insertPos = 2 + 2 + ((bytes[4]<<8)|bytes[5]);
  }
  // 기존 XMP APP1 제거
  var scan = insertPos;
  while (scan < bytes.length - 3 && bytes[scan]===0xFF) {
    if (bytes[scan+1]===0xE1) {
      var sl = (bytes[scan+2]<<8)|bytes[scan+3];
      var peek = new TextDecoder().decode(bytes.slice(scan+4, scan+4+28));
      if (peek.indexOf('ns.adobe.com/xap/1.0/')>=0) {
        var b1 = bytes.slice(0, scan);
        var b2 = bytes.slice(scan + 2 + sl);
        var merged = new Uint8Array(b1.length + b2.length);
        merged.set(b1); merged.set(b2, b1.length);
        bytes = merged; break;
      }
    }
    if ((bytes[scan+1]&0xF0)===0xE0 || bytes[scan+1]===0xFE) {
      scan += 2 + ((bytes[scan+2]<<8)|bytes[scan+3]);
    } else break;
  }
  var out = new Uint8Array(bytes.length + seg.length);
  out.set(bytes.slice(0, insertPos));
  out.set(seg, insertPos);
  out.set(bytes.slice(insertPos), insertPos + seg.length);
  return new Blob([out], {type:'image/jpeg'});
}

async function pmAutoGPS(file) {
  var dotEl  = document.getElementById('pmGpsDot');
  var txtEl  = document.getElementById('pmGpsTxt');
  function setGpsTxt(src, lat, lng) {
    pmDraft.lat = lat; pmDraft.lng = lng; pmDraft.gpsSource = src;
    if (dotEl) { dotEl.classList.remove('wait','fail'); }
    if (txtEl) txtEl.textContent = src + '  ' + lat.toFixed(5) + ', ' + lng.toFixed(5);
    // 비동기 주소 조회 — 결과 도착하면 화면 갱신
    var addrBox = document.getElementById('pmAddrTxt');
    if (addrBox) addrBox.style.display = 'none';
    revGeocode(lat, lng).then(function(addr){
      if (!addr) return;
      pmDraft.address = addr;
      var box = document.getElementById('pmAddrTxt');
      if (box) {
        var sp = box.querySelector('span');
        if (sp) sp.textContent = addr;
        box.style.display = 'block';
      }
    });
  }
  function setGpsFail() {
    if (dotEl) { dotEl.classList.remove('wait'); dotEl.classList.add('fail'); }
    if (txtEl) txtEl.textContent = '위치 확인 불가';
  }

  // 1) EXIF GPS 시도
  try {
    var ex = await (await ensureExifr()).parse(file, {gps:true, ifd0:true});
    if (ex && ex.GPSImgDirection != null && !isNaN(ex.GPSImgDirection)) pmDraft.imgDir = ex.GPSImgDirection; // EXIF 촬영방위(있을 때만 — 아이폰 등)
    if (ex && ex.latitude != null) {
      setGpsTxt('EXIF GPS', ex.latitude, ex.longitude);
      if (ex.DateTimeOriginal || ex.DateTime) {
        var _exd = ex.DateTimeOriginal || ex.DateTime;
        pmDraft.exifDate = fmtDate(_exd);
        // 제목이 기본값과 동일하면 EXIF 시각으로 교체
        var _ttl = document.getElementById('pmTitle');
        var _d2 = new Date(_exd);
        if (_ttl && !isNaN(_d2.getTime())) {
          var _p = function(n){return String(n).padStart(2,'0');};
          var _new = _d2.getFullYear()+_p(_d2.getMonth()+1)+_p(_d2.getDate())+'_'+_p(_d2.getHours())+_p(_d2.getMinutes())+_p(_d2.getSeconds());
          _ttl.value = _new;
          pmDraft.defaultTitle = _new;
        }
      }
      return;
    }
  } catch(_) {}

  // 2) 앱 lastPos 사용
  if (lastPos) {
    setGpsTxt('현재 위치', lastPos.lat, lastPos.lng);
    return;
  }

  // 3) 신선한 GPS 요청
  if (!navigator.geolocation) { setGpsFail(); return; }
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      lastPos = {lat: pos.coords.latitude, lng: pos.coords.longitude};
      setGpsTxt('현재 위치', lastPos.lat, lastPos.lng);
    },
    function() { setGpsFail(); },
    {enableHighAccuracy: true, timeout: 10000, maximumAge: 0}
  );
}

// JPEG 바이너리에서 XMP 패킷 직접 추출 (가장 신뢰성 높음)
async function extractXMPRaw(file) {
  try {
    var buf = await file.arrayBuffer();
    var bytes = new Uint8Array(buf);
    if (bytes[0]!==0xFF || bytes[1]!==0xD8) return null;
    var i = 2;
    while (i < bytes.length - 4) {
      if (bytes[i]!==0xFF) break;
      var marker = bytes[i+1];
      if (marker===0xDA) break; // SOS — 이미지 데이터 시작
      var segLen = (bytes[i+2]<<8) | bytes[i+3];
      if (marker===0xE1) { // APP1
        var ns = '';
        for (var k=0; k<32 && i+4+k<bytes.length; k++) {
          if (bytes[i+4+k]===0) break;
          ns += String.fromCharCode(bytes[i+4+k]);
        }
        if (ns.indexOf('ns.adobe.com/xap/1.0') >= 0) {
          var xmpStart = i + 4 + ns.length + 1;
          var xmpEnd = i + 2 + segLen;
          return new TextDecoder('utf-8').decode(bytes.slice(xmpStart, xmpEnd));
        }
      }
      i += 2 + segLen;
    }
  } catch(e) { console.warn('[extractXMPRaw]', e); }
  return null;
}

// XMP XML 문자열에서 필드 직접 파싱 (우리가 만든 XMP 구조 기반)
function parseXMPRaw(xmp) {
  var r = { title:'', description:'', tags:[], rating:0, heading:null };
  if (!xmp) return r;
  function decode(s) {
    return String(s||'').replace(/&amp;/g,'&').replace(/&lt;/g,'<')
      .replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").trim();
  }
  // dc:title → rdf:li
  var mT = xmp.match(/<dc:title[\s\S]*?<rdf:li[^>]*>([\s\S]*?)<\/rdf:li>[\s\S]*?<\/dc:title>/);
  if (mT) r.title = decode(mT[1]);
  // exif:UserComment 또는 dc:description → rdf:li
  var mU = xmp.match(/<exif:UserComment[\s\S]*?<rdf:li[^>]*>([\s\S]*?)<\/rdf:li>[\s\S]*?<\/exif:UserComment>/);
  var mD = xmp.match(/<dc:description[\s\S]*?<rdf:li[^>]*>([\s\S]*?)<\/rdf:li>[\s\S]*?<\/dc:description>/);
  r.description = decode((mU && mU[1]) || (mD && mD[1]) || '');
  // dc:subject → rdf:Bag → rdf:li (복수)
  var mS = xmp.match(/<dc:subject[\s\S]*?<\/dc:subject>/);
  if (mS) {
    var liRe = /<rdf:li[^>]*>([\s\S]*?)<\/rdf:li>/g, mm;
    while ((mm = liRe.exec(mS[0])) !== null) {
      var t = decode(mm[1]);
      if (t) r.tags.push(t);
    }
  }
  // xmp:Rating
  var mR = xmp.match(/<xmp:Rating>(\d+)<\/xmp:Rating>/);
  if (mR) r.rating = parseInt(mR[1]);
  // exif:GPSImgDirection (촬영 방위)
  var mH = xmp.match(/<exif:GPSImgDirection>([\d.]+)<\/exif:GPSImgDirection>/);
  if (mH) r.heading = Math.round(((parseFloat(mH[1]) % 360) + 360) % 360);
  return r;
}

// XMP 필드가 객체({x-default:...})로 올 때 안전하게 문자열 추출
function extractXMPString(val) {
  if (!val) return '';
  if (typeof val === 'string') return val.trim();
  if (typeof val === 'object') {
    var v = val['x-default'] || Object.values(val).find(function(x){ return typeof x==='string'; }) || '';
    return String(v).trim();
  }
  return String(val).trim();
}

// ── 이미지 압축 (지도 썸네일용)
function compressImage(dataUrl, maxPx, quality) {
  return new Promise(function(resolve) {
    if (!dataUrl) { resolve(dataUrl); return; }            // 빈 소스 → 즉시 반환(행 방지)
    var done = false;
    var finish = function(v){ if(done) return; done = true; resolve(v); };
    var to = setTimeout(function(){ finish(dataUrl); }, 8000);  // 8초 내 미완료 → 원본 반환(행 방지)
    var img = new Image();
    img.onload = function() {
      try {
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxPx / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * scale);
        c.height = Math.round(h * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        clearTimeout(to); finish(c.toDataURL('image/jpeg', quality || 0.72));
      } catch(e) { clearTimeout(to); finish(dataUrl); }    // 캔버스/toDataURL 실패 → 원본 반환
    };
    img.onerror = function() { clearTimeout(to); finish(dataUrl); };
    img.src = dataUrl;
  });
}

async function pmSave(onNextCb) {
  var titleEl = document.getElementById('pmTitle');
  if (!titleEl || !titleEl.value.trim()) {
    if (titleEl) { titleEl.focus(); titleEl.style.borderColor='var(--danger)'; setTimeout(function(){ titleEl.style.borderColor=''; },2000); }
