<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>CPTED 분석</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f172a;--panel:#1e293b;--p2:#263244;--border:#334155;
  --accent:#3b82f6;--text:#f1f5f9;--muted:#64748b;--m2:#94a3b8;
  --green:#10b981;--orange:#f97316;--yellow:#f59e0b;--purple:#a855f7;
  --danger:#ef4444;
  --nav:60px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html,body{width:100%;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  background:var(--bg);color:var(--text);}

/* ── MAP ── */
#map{
  position:fixed;
  top:0;left:0;right:0;
  bottom:calc(var(--nav) + var(--safe-b));
  z-index:1;
}

/* ── TOP BAR ── */
.top{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;gap:6px;
  padding:calc(var(--safe-t) + 8px) 12px 8px;
  background:linear-gradient(180deg,rgba(15,23,42,.95) 60%,transparent);
  pointer-events:none;
}
.top>*{pointer-events:all;}
.top-logo{font-size:14px;font-weight:700;color:#60a5fa;flex:1;}
.chip{font-size:10px;padding:3px 8px;border-radius:20px;border:1px solid;
  white-space:nowrap;font-family:monospace;}
.tbtn{width:36px;height:36px;border-radius:50%;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(15,23,42,.75);backdrop-filter:blur(8px);
  color:var(--text);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
.tbtn:active{opacity:.7;}

/* ── BOTTOM NAV ── */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  display:flex;
  height:calc(var(--nav) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:rgba(15,23,42,.97);
  border-top:1px solid var(--border);
  backdrop-filter:blur(12px);
}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;border:none;background:transparent;
  color:var(--muted);font-family:inherit;cursor:pointer;padding:6px 0;}
.ni.on{color:var(--accent);}
.ni-i{font-size:20px;line-height:1;}
.ni-l{font-size:10px;font-weight:600;}

/* ── MAP CONTROLS ── */
.mctrl{
  position:fixed;right:12px;
  bottom:calc(var(--nav) + var(--safe-b) + 12px);
  z-index:50;display:flex;flex-direction:column;gap:8px;
}
.mc{width:44px;height:44px;border-radius:12px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(15,23,42,.82);backdrop-filter:blur(8px);
  color:var(--text);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.4);}
.mc:active{opacity:.7;}
.mc.on{background:rgba(59,130,246,.25);border-color:var(--accent);}

/* ── FAB ── */
.fab-wrap{
  position:fixed;
  bottom:calc(var(--nav) + var(--safe-b) + 14px);
  left:50%;transform:translateX(-50%);
  z-index:50;display:flex;flex-direction:column;align-items:center;gap:10px;
}
.fab{width:58px;height:58px;border-radius:50%;
  border:none;color:#fff;font-size:24px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(0,0,0,.4);transition:all .2s;}
.fab:active{transform:scale(.9);}
.fab-green{background:var(--green);box-shadow:0 4px 20px rgba(16,185,129,.45);}
.fab-red  {background:var(--danger);box-shadow:0 4px 20px rgba(239,68,68,.45);}
.fab-menu{display:none;flex-direction:row;gap:16px;align-items:flex-end;}
.fab-menu.on{display:flex;}
.fab-item{display:flex;flex-direction:column;align-items:center;gap:4px;}
.fab-mini{width:46px;height:46px;border-radius:50%;
  background:var(--panel);border:1px solid var(--border);
  color:var(--text);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 12px rgba(0,0,0,.35);position:relative;}
.fab-mini:active{opacity:.7;}
.fab-mini input{position:absolute;inset:0;opacity:0;cursor:pointer;
  width:100%;height:100%;border-radius:50%;}
.fab-lbl{font-size:10px;color:var(--m2);
  background:rgba(15,23,42,.85);border-radius:6px;
  padding:2px 6px;white-space:nowrap;}

/* ── NAVI BAR ── */
.navi{
  position:fixed;top:0;left:0;right:0;z-index:200;
  background:linear-gradient(135deg,#1e3a8a,#1e40af);
  padding:calc(var(--safe-t)+8px) 16px 12px;
  display:none;flex-direction:column;gap:6px;
}
.navi.on{display:flex;}
.navi-r1{display:flex;align-items:center;gap:10px;}
.navi-dist{font-size:30px;font-weight:800;color:#fff;}
.navi-unit{font-size:13px;color:rgba(255,255,255,.7);}
.navi-dir{flex:1;font-size:13px;color:rgba(255,255,255,.9);}
.navi-stop{padding:8px 14px;background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;
  font-size:12px;font-weight:700;cursor:pointer;}
.navi-addr{font-size:11px;color:rgba(255,255,255,.65);font-family:monospace;}

/* ── OVERLAY ── */
.ov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.6);
  opacity:0;pointer-events:none;transition:opacity .22s;}
.ov.on{opacity:1;pointer-events:all;}

/* ── SHEET ── */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:400;
  background:var(--panel);border-radius:20px 20px 0 0;
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.32,1,.6,1);
  max-height:88vh;display:flex;flex-direction:column;
  padding-bottom:var(--safe-b);
}
.sheet.on{transform:translateY(0);}
.sh-bar{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0;flex-shrink:0;}
.sh-hd{display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px 10px;border-bottom:1px solid var(--border);flex-shrink:0;}
.sh-title{font-size:15px;font-weight:700;}
.sh-x{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);
  background:transparent;color:var(--m2);cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;}
.sh-body{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;}

/* ── INFO CARD ── */
.ic{padding:10px 16px 20px;}
.ic-img{width:100%;height:220px;object-fit:cover;border-radius:12px;margin-bottom:14px;}
.ic-ico{width:100%;height:90px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:44px;margin-bottom:14px;}
.ic-name{font-size:16px;font-weight:700;margin-bottom:12px;}
.ic-row{display:flex;gap:10px;margin-bottom:8px;}
.ic-k{font-family:monospace;font-size:11px;color:var(--muted);min-width:70px;flex-shrink:0;padding-top:1px;}
.ic-v{font-size:13px;color:var(--m2);flex:1;line-height:1.5;}
.ic-note{margin-top:10px;padding:10px 12px;background:var(--p2);border-radius:10px;
  font-size:13px;color:var(--m2);line-height:1.6;white-space:pre-wrap;}
.ic-coords{margin-top:10px;padding:10px 12px;background:var(--p2);border-radius:10px;
  font-family:monospace;font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;}
.ic-coords span{color:var(--accent);}
.ic-navi{margin-top:12px;width:100%;padding:14px;background:var(--accent);
  color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;}
.ic-navi:active{opacity:.85;}

/* ── LIST ── */
.li{display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--border);cursor:pointer;}
.li:active{background:var(--p2);}
.li-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.li-th{width:48px;height:48px;border-radius:9px;object-fit:cover;
  flex-shrink:0;background:var(--border);display:flex;align-items:center;
  justify-content:center;font-size:22px;}
.li-inf{flex:1;min-width:0;}
.li-n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li-s{font-family:monospace;font-size:10px;color:var(--muted);margin-top:2px;}
.li-del{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;font-size:13px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.li-del:active{background:rgba(239,68,68,.15);color:var(--danger);}

/* ── SURVEY FORM ── */
.sf{padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px;}
.sf-lbl{font-size:12px;color:var(--m2);margin-bottom:4px;}
.sf-photo{width:100%;height:190px;border-radius:12px;background:var(--p2);
  display:flex;align-items:center;justify-content:center;font-size:44px;
  position:relative;overflow:hidden;cursor:pointer;}
.sf-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.sf-photo-lbl{position:absolute;bottom:8px;right:8px;background:rgba(15,23,42,.8);
  color:#fff;border-radius:6px;padding:3px 9px;font-size:11px;}
.sf-inp{width:100%;padding:12px 14px;background:var(--p2);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none;}
.sf-inp:focus{border-color:var(--accent);}
.sf-area{resize:none;height:96px;line-height:1.6;}
.sf-loc{display:flex;align-items:center;gap:8px;padding:10px 14px;
  background:var(--p2);border:1px solid var(--border);border-radius:10px;
  font-family:monospace;font-size:12px;color:var(--m2);}
.sf-loc-r{margin-left:auto;font-size:17px;cursor:pointer;color:var(--accent);}
.sf-save{padding:14px;background:var(--accent);color:#fff;border:none;
  border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;width:100%;}
.sf-save:active{opacity:.85;}

/* ── LAYER SLIDERS ── */
.lp-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);}
.lp-eye{font-size:20px;cursor:pointer;width:28px;text-align:center;flex-shrink:0;}
.lp-eye.off{opacity:.2;}
.lp-col{width:14px;height:14px;border-radius:3px;flex-shrink:0;}
.lp-inf{flex:1;min-width:0;}
.lp-n{font-size:13px;font-weight:600;}
.lp-c{font-family:monospace;font-size:10px;color:var(--muted);}
.lp-sls{display:flex;flex-direction:column;gap:4px;flex-shrink:0;min-width:94px;}
.lp-sl-row{display:flex;align-items:center;gap:3px;}
.lp-sl-l{font-family:monospace;font-size:9px;color:var(--muted);width:22px;}
.lp-sl-v{font-family:monospace;font-size:9px;color:var(--m2);width:28px;text-align:right;}
.lp-sl{-webkit-appearance:none;width:58px;height:3px;border-radius:2px;background:var(--border);outline:none;cursor:pointer;}
.lp-sl::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);}

/* ── MAP GRID ── */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px;}
.mg-sec{font-family:monospace;font-size:10px;text-transform:uppercase;color:var(--muted);
  letter-spacing:.1em;padding:6px 0 2px;grid-column:1/-1;}
.mg-btn{padding:14px 10px;border-radius:10px;background:var(--p2);border:1px solid var(--border);cursor:pointer;text-align:center;}
.mg-btn:active,.mg-btn.on{background:rgba(59,130,246,.15);border-color:var(--accent);}
.mg-btn.dis{opacity:.3;pointer-events:none;}
.mg-i{font-size:26px;display:block;margin-bottom:5px;}
.mg-l{font-size:12px;font-weight:600;color:var(--m2);}
.mg-btn.on .mg-l{color:var(--accent);}

/* ── VWorld key ── */
.kf{padding:16px;display:flex;flex-direction:column;gap:10px;}
.kf-lbl{font-size:13px;color:var(--m2);}
.kf-row{display:flex;gap:8px;}
.kf-inp{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:10px;
  font-family:monospace;font-size:13px;background:var(--p2);color:var(--text);outline:none;}
.kf-inp:focus{border-color:var(--accent);}
.kf-ok{padding:12px 18px;background:var(--accent);color:#fff;border:none;
  border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}
.kf-ok:active{opacity:.85;}
.kf-ok-badge{display:none;align-items:center;gap:8px;padding:12px;
  background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:10px;}
.kf-ok-badge.on{display:flex;}
.kf-ok-badge span{font-size:13px;color:var(--green);font-weight:600;}
.kf-link{font-size:12px;color:var(--accent);text-decoration:none;}

/* ── DATA TABS ── */
.dtabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
.dtab{flex:1;padding:10px 0;background:transparent;border:none;color:var(--muted);
  font-size:12px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;}
.dtab.on{color:var(--accent);border-bottom-color:var(--accent);}

/* ── TOAST & PB ── */
.toast{position:fixed;bottom:calc(var(--nav)+var(--safe-b)+14px);left:50%;
  transform:translateX(-50%) translateY(8px);z-index:999;
  background:var(--p2);border:1px solid var(--border);border-radius:14px;
  padding:10px 20px;font-size:12px;font-family:monospace;color:var(--m2);
  white-space:nowrap;box-shadow:0 4px 18px rgba(0,0,0,.4);
  opacity:0;transition:all .28s;pointer-events:none;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.pb{position:fixed;top:0;left:0;right:0;height:3px;background:var(--accent);
  z-index:999;transform:scaleX(0);transform-origin:left;transition:transform .25s;}

/* ── COMPASS ── */
.compass{position:fixed;top:calc(var(--safe-t)+60px);left:50%;
  transform:translateX(-50%);z-index:90;
  width:40px;height:40px;border-radius:50%;
  background:rgba(15,23,42,.82);border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(8px);display:none;align-items:center;
  justify-content:center;font-size:20px;cursor:pointer;}
.compass.on{display:flex;}

/* ── LOC MARKER ── */
.loc-dot{width:18px;height:18px;border-radius:50%;
  background:rgba(59,130,246,.25);border:2px solid var(--accent);}

/* Leaflet override */
.leaflet-control-zoom{display:none;}
.leaflet-control-attribution{display:none !important;}
</style>
</head>
<body>

<div id="map"></div>

<!-- TOP BAR -->
<div class="top">
  <div class="top-logo">CPTED 분석</div>
  <div class="chip" style="color:#10b981;border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.08)">📷<b id="pcnt">0</b></div>
  <div class="chip" style="color:#f59e0b;border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.08)">📋<b id="scnt">0</b></div>
  <div class="chip vw-ok" id="vwOk" style="color:#4ade80;border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.08);display:none">🗝VWorld</div>
  <button class="tbtn" id="mapSwBtn">🗺</button>
  <button class="tbtn" id="vwBtn">🗝</button>
</div>

<!-- COMPASS -->
<div class="compass" id="compass">🧭</div>

<!-- NAVI BAR -->
<div class="navi" id="naviBar">
  <div class="navi-r1">
    <div><span class="navi-dist" id="naviDist">--</span><span class="navi-unit" id="naviUnit"> m</span></div>
    <div class="navi-dir" id="naviDir">이동 중</div>
    <button class="navi-stop" id="naviStop">종료</button>
  </div>
  <div class="navi-addr" id="naviAddr"></div>
</div>

<!-- MAP CONTROLS -->
<div class="mctrl">
  <button class="mc" id="locBtn">📍</button>
  <button class="mc" id="rotBtn">🧭</button>
  <button class="mc" id="ziBtn">＋</button>
  <button class="mc" id="zoBtn">－</button>
</div>

<!-- FAB -->
<div class="fab-wrap">
  <div class="fab-menu" id="fabMenu">
    <div class="fab-item">
      <label class="fab-mini">📸<input type="file" id="camInput" accept="image/*" capture="environment"></label>
      <span class="fab-lbl">촬영·노트</span>
    </div>
    <div class="fab-item">
      <label class="fab-mini">🖼<input type="file" id="gallInput" accept="image/*" multiple></label>
      <span class="fab-lbl">갤러리</span>
    </div>
    <div class="fab-item">
      <button class="fab-mini" id="noteOnlyBtn">📝</button>
      <span class="fab-lbl">노트만</span>
    </div>
  </div>
  <button class="fab fab-green" id="fabBtn">📋</button>
</div>

<!-- BOTTOM NAV -->
<nav class="nav">
  <button class="ni on"  id="ni-map"    >  <span class="ni-i">🗺</span><span class="ni-l">지도</span></button>
  <button class="ni"     id="ni-survey" >  <span class="ni-i">📋</span><span class="ni-l">현장조사</span></button>
  <button class="ni"     id="ni-data"   >  <span class="ni-i">📊</span><span class="ni-l">데이터</span></button>
  <button class="ni"     id="ni-layer"  >  <span class="ni-i">⊞</span><span class="ni-l">레이어</span></button>
  <button class="ni"     id="ni-more"   >  <span class="ni-i">⋯</span><span class="ni-l">더보기</span></button>
</nav>

<!-- OVERLAY -->
<div class="ov" id="ov"></div>

<!-- MAIN SHEET -->
<div class="sheet" id="sheet">
  <div class="sh-bar"></div>
  <div class="sh-hd"><div class="sh-title" id="shTitle"></div><button class="sh-x" id="shX">✕</button></div>
  <div class="sh-body" id="shBody"></div>
</div>

<!-- INFO SHEET -->
<div class="sheet" id="infoSheet" style="max-height:78vh;">
  <div class="sh-bar"></div>
  <div class="sh-hd"><div class="sh-title" id="infoTitle"></div><button class="sh-x" id="infoX">✕</button></div>
  <div class="sh-body"><div class="ic" id="infoCard"></div></div>
</div>

<div class="pb" id="pb"></div>
<div class="toast" id="toastEl"></div>

<!-- SCRIPTS AT END OF BODY -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script>
(function() {

var toastTimer;
function toast(msg, ms) {
  clearTimeout(toastTimer);
  var el = document.getElementById('toastEl');
  el.textContent = msg; el.classList.add('on');
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, ms || 2500);
}
function pb(v) { document.getElementById('pb').style.transform = 'scaleX(' + v + ')'; }
function lsSave(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(_) {} }
function lsLoad(k, d) { try { var v = localStorage.getItem(k); return v != null ? JSON.parse(v) : d; } catch(_) { return d; } }
function toDataURL(file) {
  return new Promise(function(res) {
    var r = new FileReader();
    r.onload = function(e) { res(e.target.result); };
    r.readAsDataURL(file);
  });
}
function fmtDate(d) {
  if (!d) return '';
  try { return (d instanceof Date ? d : new Date(d)).toLocaleString('ko-KR'); } catch(_) { return ''; }
}
function calcDist(a, b, c2, d2) {
  var R=6371000, t=Math.PI/180;
  var da=(c2-a)*t, db=(d2-b)*t;
  var x=Math.sin(da/2)*Math.sin(da/2)+Math.cos(a*t)*Math.cos(c2*t)*Math.sin(db/2)*Math.sin(db/2);
  return R*2*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}
function calcBear(a,b,c2,d2) {
  var t=Math.PI/180;
  var y=Math.sin((d2-b)*t)*Math.cos(c2*t);
  var x=Math.cos(a*t)*Math.sin(c2*t)-Math.sin(a*t)*Math.cos(c2*t)*Math.cos((d2-b)*t);
  return ((Math.atan2(y,x)/t)+360)%360;
}

// ══ INDEXEDDB ══
var db = null;
function openDB() {
  return new Promise(function(res, rej) {
    if (db) { res(db); return; }
    var req = indexedDB.open('cpted_v3', 1);
    req.onupgradeneeded = function(e) {
      var d = e.target.result;
      if (!d.objectStoreNames.contains('photos'))  d.createObjectStore('photos',  {keyPath:'id'});
      if (!d.objectStoreNames.contains('surveys')) d.createObjectStore('surveys', {keyPath:'id'});
    };
    req.onsuccess  = function(e) { db = e.target.result; res(db); };
    req.onerror    = function() { rej(); };
  });
}
function idbAll(store) {
  return openDB().then(function(d) {
    return new Promise(function(res) {
      var q = d.transaction(store,'readonly').objectStore(store).getAll();
      q.onsuccess = function() { res(q.result || []); };
      q.onerror   = function() { res([]); };
    });
  });
}
function idbPut(store, obj) {
  return openDB().then(function(d) {
    return new Promise(function(res) {
      var tx = d.transaction(store,'readwrite');
      tx.objectStore(store).put(obj);
      tx.oncomplete = res; tx.onerror = res;
    });
  });
}
function idbDel(store, key) {
  return openDB().then(function(d) {
    return new Promise(function(res) {
      var tx = d.transaction(store,'readwrite');
      tx.objectStore(store).delete(key);
      tx.oncomplete = res; tx.onerror = res;
    });
  });
}
function idbClear(store) {
  return openDB().then(function(d) {
    return new Promise(function(res) {
      var tx = d.transaction(store,'readwrite');
      tx.objectStore(store).clear();
      tx.oncomplete = res; tx.onerror = res;
    });
  });
}

var curTile = TILES['esri-street'].addTo(map);

function vwUrl(t, e) {
  var base = PROXY
    ? PROXY + '/wmts/' + t + '/{z}/{y}/{x}.' + (e||'png')
    : 'https://api.vworld.kr/req/wmts/1.0.0/' + vwKey + '/' + t + '/{z}/{y}/{x}.' + (e||'png');
  return L.tileLayer(base, {maxZoom:19, crossOrigin:true});
}
function setTile(k) {
  if (k === curKey) return;
  if (k.startsWith('vw-') && !vwKey && !PROXY) { toast('VWorld 키 또는 프록시 설정 필요'); return; }
  map.removeLayer(curTile);
  if (hybridBase) { map.removeLayer(hybridBase); hybridBase = null; }
  if      (k === 'vw-base')   curTile = vwUrl('Base','png').addTo(map);
  else if (k === 'vw-sat')    curTile = vwUrl('Satellite','jpeg').addTo(map);
  else if (k === 'vw-gray')   curTile = vwUrl('gray','png').addTo(map);
  else if (k === 'vw-hybrid') { hybridBase=vwUrl('Satellite','jpeg').addTo(map); curTile=vwUrl('Hybrid','png').addTo(map); }
  else curTile = TILES[k].addTo(map);
  curKey = k;
  lsSave('tile', k);
  setTimeout(function(){ map.invalidateSize(); }, 100);
}

// ══ ROTATION ══
var bearing = 0, rotLock = false;
function setBearing(deg) {
  bearing = ((deg % 360) + 360) % 360;
  var pane = map.getPanes().mapPane;
  if (pane) pane.style.transform = 'rotate(-' + bearing + 'deg)';
  document.querySelectorAll('.leaflet-marker-icon').forEach(function(el) {
    el.style.transform = (el.style.transform || '').replace(/rotate\([^)]+\)/, '') +
      (bearing ? ' rotate(' + bearing + 'deg)' : '');
  });
  var comp = document.getElementById('compass');
  comp.style.transform = 'translateX(-50%) rotate(-' + bearing + 'deg)';
  if (bearing) comp.classList.add('on'); else comp.classList.remove('on');
}
document.getElementById('rotBtn').addEventListener('click', function() {
  rotLock = !rotLock;
  this.classList.toggle('on', rotLock);
  toast(rotLock ? '🧭 방향 고정 ON' : '🧭 방향 고정 OFF');
  if (!rotLock) setBearing(0);
});
document.getElementById('compass').addEventListener('click', function() {
  setBearing(0); rotLock = false;
  document.getElementById('rotBtn').classList.remove('on');
});

// ══ LOCATION ══
var locM = null, locC = null, lastPos = null, watcher = null;
function setLoc(lat, lng, acc) {
  lastPos = {lat: lat, lng: lng};
  if (!locM) {
    locM = L.marker([lat,lng], {
      icon: L.divIcon({html:'<div class="loc-dot"></div>', className:'', iconSize:[18,18], iconAnchor:[9,9]}),
      zIndexOffset: 1000
    }).addTo(map);
    locC = L.circle([lat,lng], {radius:acc||30, color:'#3b82f6', fillColor:'#3b82f6', fillOpacity:.08, weight:1}).addTo(map);
  } else {
    locM.setLatLng([lat,lng]);
    if (locC) locC.setLatLng([lat,lng]).setRadius(acc||30);
  }
}
var locRequesting = false;
document.getElementById('locBtn').addEventListener('click', function() {
  if (!navigator.geolocation) { toast('❌ GPS를 지원하지 않는 기기'); return; }
  var btn = this;
  btn.textContent = '⏳';
  locRequesting = true;

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      btn.textContent = '📍';
      locRequesting = false;
      var lat = pos.coords.latitude;
      var lng = pos.coords.longitude;
      var acc = pos.coords.accuracy;
      setLoc(lat, lng, acc);
      lastPos = {lat: lat, lng: lng};
      // 반드시 flyTo 실행
      map.setView([lat, lng], 17);
      toast('📍 ' + lat.toFixed(5) + ', ' + lng.toFixed(5));
    },
    function(err) {
      btn.textContent = '📍';
      locRequesting = false;
      var msg = {1:'위치 권한 거부됨', 2:'위치를 확인할 수 없음', 3:'시간 초과'};
      toast('❌ ' + (msg[err.code] || err.message));
    },
    {enableHighAccuracy: true, timeout: 15000, maximumAge: 0}
  );

  // watchPosition으로 연속 추적 (내비·회전 목적)
  if (watcher) { navigator.geolocation.clearWatch(watcher); watcher = null; }
  watcher = navigator.geolocation.watchPosition(
    function(pos) {
      var lat = pos.coords.latitude, lng = pos.coords.longitude;
      setLoc(lat, lng, pos.coords.accuracy);
      lastPos = {lat: lat, lng: lng};
      if (naviDest) updateNavi(lat, lng);
      if (rotLock && pos.coords.heading != null && !isNaN(pos.coords.heading))
        setBearing(pos.coords.heading);
    },
    function(){},
    {enableHighAccuracy: true, timeout: 30000, maximumAge: 3000}
  );
});

var naviDest = null, naviLine = null;
function startNavi(lat, lng, name) {
  naviDest = {lat:lat, lng:lng, name:name||'목적지'};
  document.getElementById('naviBar').classList.add('on');
  document.getElementById('naviAddr').textContent = '목적지: ' + naviDest.name;
  if (naviLine) map.removeLayer(naviLine);
  var pts = lastPos ? [[lastPos.lat,lastPos.lng],[lat,lng]] : [[lat,lng],[lat,lng]];
  naviLine = L.polyline(pts, {color:'#3b82f6',weight:4,opacity:.8,dashArray:'8 4'}).addTo(map);
  document.getElementById('locBtn').click();
  closeAll();
  toast('🗺 내비게이션 시작');
}
function updateNavi(lat, lng) {
  if (!naviDest) return;
  var dist = calcDist(lat, lng, naviDest.lat, naviDest.lng);
  document.getElementById('naviDist').textContent = dist < 1000 ? Math.round(dist) : (dist/1000).toFixed(1);
  document.getElementById('naviUnit').textContent  = dist < 1000 ? ' m' : ' km';
  if (naviLine) naviLine.setLatLngs([[lat,lng],[naviDest.lat,naviDest.lng]]);
  var dirs = ['북','북동','동','남동','남','남서','서','북서'];
  document.getElementById('naviDir').textContent = dirs[Math.round(calcBear(lat,lng,naviDest.lat,naviDest.lng)/45)%8] + ' 방향';
  if (dist < 15) { toast('🎯 도착!'); stopNavi(); }
}
function stopNavi() {
  naviDest = null;
  document.getElementById('naviBar').classList.remove('on');

}

var LAYERS = {
  boundary:{id:'boundary',name:'청림동 경계',color:'#6366f1',icon:'🗂',visible:true,opacity:.7,sz:1,leaf:null,mkrs:[],cnt:1},
  vacant:  {id:'vacant',  name:'빈집',       color:'#f97316',icon:'🏚',visible:true,opacity:1, sz:1,mkrs:[],cnt:0},
  light:   {id:'light',   name:'가로등',      color:'#f59e0b',icon:'💡',visible:true,opacity:1, sz:1,mkrs:[],cnt:0},
  cctv:    {id:'cctv',    name:'CCTV',        color:'#3b82f6',icon:'📹',visible:true,opacity:1, sz:1,mkrs:[],cnt:0},
  photo:   {id:'photo',   name:'현장 사진',   color:'#10b981',icon:'📷',visible:true,opacity:1, sz:1,mkrs:[],cnt:0},
  survey:  {id:'survey',  name:'현장 조사',   color:'#a855f7',icon:'📋',visible:true,opacity:1, sz:1,mkrs:[],cnt:0},
};
var L_ORDER = ['survey','photo','cctv','light','vacant','boundary'];
var L_BASE  = {vacant:20, light:20, cctv:20, photo:42, survey:32, boundary:0};

function applyVis(id) {
  var ly = LAYERS[id];
  if (id==='boundary' && ly.leaf) { ly.visible ? map.addLayer(ly.leaf) : map.removeLayer(ly.leaf); return; }
  ly.mkrs.forEach(function(m){ ly.visible ? map.addLayer(m) : map.removeLayer(m); });
}
function addMkr(id, m) {
  var ly = LAYERS[id];
  ly.mkrs.push(m); ly.cnt = ly.mkrs.length;
  if (!ly.visible) map.removeLayer(m);
  var setOp = function(){ var e=m.getElement(); if(e) e.style.opacity=ly.opacity; };
  setOp(); m.on('add', setOp);
}
function setLayerOp(id, v) {
  LAYERS[id].opacity = v;
  if (id==='boundary' && LAYERS[id].leaf) { LAYERS[id].leaf.setStyle({fillOpacity:v*.4,opacity:v}); return; }
  LAYERS[id].mkrs.forEach(function(m){ var e=m.getElement(); if(e) e.style.opacity=v; });
  saveLayers();
}
function setLayerSz(id, v) {
  LAYERS[id].sz = v;
  if (id==='boundary') return;
  var base = L_BASE[id]||20, sz = Math.round(base*v);
  LAYERS[id].mkrs.forEach(function(m){
    var ico;
    if (id==='vacant')  ico = L.divIcon({html:'<div class="vh-pin">'+vhSvg(sz)+'</div>',className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz]});
    else if (id==='light')  ico = ciIcon('#f59e0b','💡',sz);
    else if (id==='cctv')   ico = ciIcon('#3b82f6','📹',sz);
    else if (id==='survey') ico = svIcon(m._sv, sz);
    else if (id==='photo')  ico = L.divIcon({html:'<div class="pin" style="width:'+sz+'px;height:'+sz+'px"><img src="'+(m._pd||'')+'"></div>',className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz]});
    if (ico) m.setIcon(ico);
  });
  saveLayers();
}
function saveLayers() {
  var s={};
  Object.keys(LAYERS).forEach(function(k){s[k]={visible:LAYERS[k].visible,opacity:LAYERS[k].opacity,sz:LAYERS[k].sz};});
  lsSave('ly3', s);
}
function loadLayers() {
  var s = lsLoad('ly3', null); if (!s) return;
  Object.keys(s).forEach(function(k){if(LAYERS[k]){LAYERS[k].visible=s[k].visible;LAYERS[k].opacity=s[k].opacity;LAYERS[k].sz=s[k].sz||1;}});
}

var photos = [];
function mkPhotoMkr(p) {
  var sz = Math.round(42 * LAYERS.photo.sz);
  var m = L.marker([p.lat,p.lng], {icon:pinIcon(p.dataUrl,sz)}).addTo(map);
  m._pd = p.dataUrl;
  m.on('click',function(){openInfo('📷 '+p.name,

    naviBtn(p.lat,p.lng,p.name)
  );});
  return m;
}
async function processPhotos(files) {
  var arr = Array.from(files).filter(function(f){return f.type.startsWith('image/');});
  if (!arr.length) return;
  pb(.05);
  for (var i=0; i<arr.length; i++) {
    pb((i+1)/arr.length);
    var url = await toDataURL(arr[i]);
    var lat=null,lng=null,dt=null;
    try { var ex=await exifr.parse(arr[i],{gps:true,ifd0:true}); if(ex&&ex.latitude!=null){lat=ex.latitude;lng=ex.longitude;} if(ex)dt=fmtDate(ex.DateTimeOriginal||ex.DateTime); } catch(_){}
    // GPS 없으면 현재 위치 실시간 요청
    if (!lat && lastPos) { lat=lastPos.lat; lng=lastPos.lng; toast('📍 EXIF GPS 없음 — 현재 위치 사용'); }
    if (!lat) {
      // lastPos도 없으면 새로 GPS 요청
      var gpsResult = await new Promise(function(res) {
        if (!navigator.geolocation) { res(null); return; }
        navigator.geolocation.getCurrentPosition(
          function(p) { lastPos={lat:p.coords.latitude,lng:p.coords.longitude}; res(lastPos); },
          function()  { res(null); },
          {enableHighAccuracy:true, timeout:8000, maximumAge:0}
        );
      });
      if (gpsResult) { lat=gpsResult.lat; lng=gpsResult.lng; toast('📍 현재 위치로 저장됨'); }
      else { toast('⚠️ GPS를 확인할 수 없음 — 위치 없이 저장'); }
    }
    var p = {id:'p'+Date.now()+'_'+i, name:arr[i].name, dataUrl:url, lat:lat, lng:lng, date:dt, hasGps:true};
    photos.push(p);
    addMkr('photo', mkPhotoMkr(p));
    await idbPut('photos', p);
    updCounts();
  }
  setTimeout(function(){pb(0);}, 500);
  toast('📷 '+arr.length+'개 추가됨');
}

var surveys = [];
var draft = {};
function openSurveyForm(photoFile) {
  draft = { photo:null, file:photoFile, lat:lastPos?lastPos.lat:null, lng:lastPos?lastPos.lng:null };
  // GPS 없으면 자동 요청
  if (!draft.lat && navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos) {
      draft.lat = pos.coords.latitude; draft.lng = pos.coords.longitude;
      lastPos = {lat: draft.lat, lng: draft.lng};
      var el = document.getElementById('sfLocTxt');
      if (el) el.textContent = draft.lat.toFixed(5) + ', ' + draft.lng.toFixed(5);
    }, function(){}, {enableHighAccuracy:true, timeout:10000, maximumAge:0});
  }
  openSheet('📋 현장 조사 작성', '');
  var body = document.getElementById('shBody');
  var wrap = document.createElement('div');
  wrap.className = 'sf';
  wrap.innerHTML =
    '<div>'+
      '<div class="sf-lbl">사진</div>'+
      '<div class="sf-photo" id="sfPreview">'+
        (photoFile?'<span style="font-size:13px;color:var(--m2)">로딩 중...</span>':'<span>📸</span>')+
        '<div class="sf-photo-lbl">탭하여 변경</div>'+
        '<input type="file" id="sfPhotoInp" accept="image/*" capture="environment" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;">'+
      '</div>'+
    '</div>'+
    '<div>'+
      '<div class="sf-lbl">제목 *</div>'+
      '<input class="sf-inp" id="sfTitle" type="text" placeholder="예: 청림로 8번지 빈집 상태">'+
    '</div>'+
    '<div>'+
      '<div class="sf-lbl">현장 메모</div>'+
      '<textarea class="sf-inp sf-area" id="sfNote" placeholder="현장 상태, 위험 요소, 조치 필요 사항 등..."></textarea>'+
    '</div>'+
    '<div>'+
      '<div class="sf-lbl">태그</div>'+
      '<input class="sf-inp" id="sfTag" type="text" placeholder="위험, 출입가능, 파손, 조치필요">'+
    '</div>'+
    '<div class="sf-loc">'+
      '<span id="sfLocTxt">'+(draft.lat?draft.lat.toFixed(5)+', '+draft.lng.toFixed(5):'위치 미확인')+'</span>'+
      '<span class="sf-loc-r" id="sfLocR">🔄</span>'+
    '</div>'+
    '<button class="sf-save" id="sfSave">✅ 저장</button>';
  body.appendChild(wrap);

  // load photo preview
  if (photoFile) {
    var r = new FileReader();
    r.onload = function(e) {
      draft.photo = e.target.result;
      var el = document.getElementById('sfPreview');
      if (el) el.innerHTML = '<img src="'+e.target.result+'"><div class="sf-photo-lbl">탭하여 변경</div><input type="file" id="sfPhotoInp" accept="image/*" capture="environment" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;">';
      bindSfPhoto();
    };
    r.readAsDataURL(photoFile);
  } else {
    bindSfPhoto();
  }

  // GPS refresh
  document.getElementById('sfLocR').addEventListener('click', function(){
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function(pos){
      draft.lat = pos.coords.latitude; draft.lng = pos.coords.longitude;
      var el=document.getElementById('sfLocTxt'); if(el) el.textContent=draft.lat.toFixed(5)+', '+draft.lng.toFixed(5);
      toast('📍 위치 업데이트');
    },{enableHighAccuracy:true,timeout:8000});
  });

  // save button
  document.getElementById('sfSave').addEventListener('click', saveSurvey);
}

function bindSfPhoto(){
  var inp = document.getElementById('sfPhotoInp'); if (!inp) return;
  inp.addEventListener('change', function(e){
    if (!e.target.files||!e.target.files.length) return;
    var r=new FileReader();
    r.onload=function(ev){
      draft.photo=ev.target.result;
      var el=document.getElementById('sfPreview');
      if(el){el.innerHTML='<img src="'+ev.target.result+'"><div class="sf-photo-lbl">탭하여 변경</div><input type="file" id="sfPhotoInp" accept="image/*" capture="environment" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;">';bindSfPhoto();}
    };
    r.readAsDataURL(e.target.files[0]);
  });
}

async function saveSurvey(){
  var title = document.getElementById('sfTitle');
  if (!title||!title.value.trim()) { toast('⚠️ 제목을 입력하세요'); return; }
  var sv = {
    id: 'sv'+Date.now(),
    title: title.value.trim(),
    note: (document.getElementById('sfNote')||{}).value||'',
    tag:  (document.getElementById('sfTag')||{}).value||'',
    photo: draft.photo||null,
    lat: draft.lat, lng: draft.lng,
    time: new Date().toLocaleString('ko-KR')
  };
  surveys.push(sv);
  await idbPut('surveys', sv);
  if (sv.lat) addMkr('survey', mkSurveyMkr(sv));
  updCounts();
  closeAll();
  toast('✅ 저장됨');
  if (sv.lat) map.flyTo([sv.lat,sv.lng],17,{duration:.8});
}

function mkSurveyMkr(sv){
  var sz = Math.round(32*LAYERS.survey.sz);
  var m = L.marker([sv.lat,sv.lng],{icon:svIcon(sv,sz),zIndexOffset:500}).addTo(map);
  m._sv = sv;
  m.on('click',function(){
    openInfo('📋 '+sv.title,
      (sv.photo?'<img class="ic-img" src="'+sv.photo+'">':'<div class="ic-ico" style="background:linear-gradient(135deg,#3b0764,#6b21a8)">📋</div>')+
      '<div class="ic-name">'+sv.title+'</div>'+
      '<div class="ic-row"><div class="ic-k">일시</div><div class="ic-v">'+sv.time+'</div></div>'+
      (sv.tag?'<div class="ic-row"><div class="ic-k">태그</div><div class="ic-v">#'+sv.tag.split(',').map(function(t){return t.trim();}).join(' #')+'</div></div>':'')+
      (sv.note?'<div class="ic-note">'+sv.note+'</div>':'')+
      (sv.lat?'<div class="ic-coords"><div>위도 <span>'+sv.lat.toFixed(6)+'</span></div><div>경도 <span>'+sv.lng.toFixed(6)+'</span></div></div>':'')+
      (sv.lat?naviBtn(sv.lat,sv.lng,sv.title):'')
    );
  });
  return m;
}

function updCounts(){
  document.getElementById('pcnt').textContent = LAYERS.photo.mkrs.length;
  document.getElementById('scnt').textContent = surveys.length;
}

// ══ SURVEY LIST ══
function openSurveyList(){
  openSheet('📋 현장 조사 ('+surveys.length+')', '');
  var body = document.getElementById('shBody');
  if (!surveys.length) {
    body.innerHTML='<div style="padding:40px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:2">아직 기록이 없습니다<br>📸 버튼으로 현장 조사를 시작하세요</div>';
    return;
  }
  surveys.slice().reverse().forEach(function(sv){
    var d=document.createElement('div'); d.className='li';
    var th = sv.photo ? '<img class="li-th" src="'+sv.photo+'">' : '<div class="li-th">📋</div>';
    d.innerHTML = th+'<div class="li-inf"><div class="li-n">'+sv.title+'</div><div class="li-s">'+sv.time+(sv.tag?' · #'+sv.tag:'')+'</div></div><button class="li-del" data-id="'+sv.id+'">✕</button>';
    d.addEventListener('click', function(e){
      if (e.target.classList.contains('li-del')) return;
      if (sv.lat) map.flyTo([sv.lat,sv.lng],17,{duration:.8});
      closeAll();
      setTimeout(function(){
        var m=LAYERS.survey.mkrs.find(function(mk){return mk._sv&&mk._sv.id===sv.id;});
        if (m) m.fire('click');
      },400);
    });
    d.querySelector('.li-del').addEventListener('click',function(e){
      e.stopPropagation();
      var id=this.dataset.id;
      surveys=surveys.filter(function(s){return s.id!==id;});
      var mi=LAYERS.survey.mkrs.findIndex(function(mk){return mk._sv&&mk._sv.id===id;});
      if(mi>=0){map.removeLayer(LAYERS.survey.mkrs[mi]);LAYERS.survey.mkrs.splice(mi,1);LAYERS.survey.cnt=LAYERS.survey.mkrs.length;}
      idbDel('surveys',id); updCounts(); openSurveyList();
    });
    body.appendChild(d);
  });
}

// ══ DATA SHEET ══
function openDataSheet(){
  openSheet('📊 데이터','');
  var body=document.getElementById('shBody');
  var tabs=document.createElement('div'); tabs.className='dtabs';
  [['vacant','🏚 빈집',VACANT.length],['light','💡 가로등',LIGHTS.length],['cctv','📹 CCTV',CCTV.length]].forEach(function(t){
    var b=document.createElement('button'); b.className='dtab'; b.id='dt-'+t[0];
    b.innerHTML=t[1]+'<br><small style="font-family:monospace;font-size:9px">'+t[2]+'개</small>';
    b.addEventListener('click',function(){openDataTab(t[0]);});

  });
  var content=document.createElement('div'); content.id='dt-body';

function openDataTab(type){
  document.querySelectorAll('.dtab').forEach(function(b){b.classList.remove('on');});
  var ab=document.getElementById('dt-'+type); if(ab) ab.classList.add('on');
  var body=document.getElementById('dt-body'); if(!body) return;
  body.innerHTML='';
  var data={vacant:VACANT,light:LIGHTS,cctv:CCTV};
  var color={vacant:'#f97316',light:'#f59e0b',cctv:'#3b82f6'};
  data[type].forEach(function(item){
    var name=type==='vacant'?'빈집 '+item.id+'번 · '+item.addr:item.addr;
    var sub=type==='vacant'?item.type+' · '+(item.grade||'-'):type==='light'?item.type+' · '+item.count+'등':'카메라 '+item.count+'대';
    var d=document.createElement('div'); d.className='li';
    d.innerHTML='<div class="li-dot" style="background:'+color[type]+'"></div><div class="li-inf"><div class="li-n">'+name+'</div><div class="li-s">'+sub+'</div></div>';
    d.addEventListener('click',function(){map.flyTo([item.lat,item.lng],17,{duration:.8});closeAll();});
    body.appendChild(d);
  });
}

// ══ LAYER SHEET ══
function openLayerSheet(){

}
function buildLP(){
  var body=document.getElementById('shBody'); if(!body) return; body.innerHTML='';
  L_ORDER.forEach(function(id){
    var ly=LAYERS[id], hasSz=(id!=='boundary');
    var row=document.createElement('div'); row.className='lp-row';
    row.innerHTML=
      '<div class="lp-eye'+(ly.visible?'':' off')+'" data-id="'+id+'">👁</div>'+
      '<div class="lp-col" style="background:'+ly.color+'"></div>'+
      '<div class="lp-inf"><div class="lp-n">'+ly.icon+' '+ly.name+'</div><div class="lp-c">'+ly.cnt+'개</div></div>'+
      '<div class="lp-sls">'+
        '<div class="lp-sl-row"><span class="lp-sl-l">투명</span><span class="lp-sl-v" id="ov-'+id+'">'+(Math.round(ly.opacity*100))+'%</span><input class="lp-sl" type="range" min="0" max="1" step=".05" value="'+ly.opacity+'" data-id="'+id+'" data-tp="op"></div>'+
        (hasSz?'<div class="lp-sl-row"><span class="lp-sl-l">크기</span><span class="lp-sl-v" id="sv-'+id+'">'+(Math.round(ly.sz*100))+'%</span><input class="lp-sl" type="range" min=".3" max="3" step=".1" value="'+ly.sz+'" data-id="'+id+'" data-tp="sz"></div>':'')+
      '</div>';
    row.querySelector('.lp-eye').addEventListener('click',function(){
      var lid=this.dataset.id; LAYERS[lid].visible=!LAYERS[lid].visible; applyVis(lid); saveLayers(); buildLP();
    });
    row.querySelectorAll('.lp-sl').forEach(function(sl){
      sl.addEventListener('input',function(){
        var v=parseFloat(this.value),lid=this.dataset.id,tp=this.dataset.tp;
        if(tp==='op'){setLayerOp(lid,v);var el=document.getElementById('ov-'+lid);if(el)el.textContent=Math.round(v*100)+'%';}
        else{setLayerSz(lid,v);var el=document.getElementById('sv-'+lid);if(el)el.textContent=Math.round(v*100)+'%';}
      });
    });
    body.appendChild(row);
  });
}

// ══ STARTUP ══
(async function init(){
  // VWorld key
  var sk=''; try{sk=localStorage.getItem('vwKey')||'';}catch(_){}
  if(BUILTIN_KEY&&BUILTIN_KEY!=='__VWORLD_KEY_HERE__') sk=BUILTIN_KEY;
  if(sk){vwKey=sk; document.getElementById('vwOk').style.display='block';}

  // Layer prefs
  loadLayers();

  // Init data
  initBoundary(); initVacant(); initLights(); initCctv();

  // Restore tile
  var st=lsLoad('tile','esri-street');
  // Only switch tile if key is available for vworld
  if(st.startsWith('vw-') && !vwKey) st='esri-street';
  if(st !== 'esri-street') setTile(st);

  // Apply layer visibility
  Object.keys(LAYERS).forEach(function(id){ applyVis(id); });

  // Restore photos
  var savedP = await idbAll('photos');
  savedP.forEach(function(p){ photos.push(p); if(p.lat) addMkr('photo', mkPhotoMkr(p)); });

  // Restore surveys
  var savedS = await idbAll('surveys');
  savedS.forEach(function(sv){ surveys.push(sv); if(sv.lat) addMkr('survey', mkSurveyMkr(sv)); });

  updCounts();

  // Fit map + invalidateSize
  setTimeout(function(){
    map.invalidateSize(true);
    var pts=VACANT.map(function(h){return[h.lat,h.lng];})
      .concat(LIGHTS.map(function(i){return[i.lat,i.lng];}))
      .concat(CCTV.map(function(i){return[i.lat,i.lng];}));
    if(pts.length) map.fitBounds(pts,{padding:[40,80]});
    // Switch to VWorld if key is set
    if((vwKey||PROXY) && st==='esri-street') setTile('vw-base');
  }, 200);

  if(savedP.length+savedS.length>0)
    toast('💾 사진 '+savedP.length+'개, 조사 '+savedS.length+'건 복원');

  // 앱 시작 시 자동 위치 요청
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        var lat=pos.coords.latitude, lng=pos.coords.longitude;
        setLoc(lat, lng, pos.coords.accuracy);
        lastPos = {lat:lat, lng:lng};
      },
      function(){},
      {enableHighAccuracy:true, timeout:10000, maximumAge:30000}
    );
    // 백그라운드 연속 추적 시작
    watcher = navigator.geolocation.watchPosition(
      function(pos) {
        var lat=pos.coords.latitude, lng=pos.coords.longitude;
        setLoc(lat, lng, pos.coords.accuracy);
        lastPos = {lat:lat, lng:lng};
        if (naviDest) updateNavi(lat, lng);
        if (rotLock && pos.coords.heading!=null && !isNaN(pos.coords.heading))
          setBearing(pos.coords.heading);
      },
      function(){},
      {enableHighAccuracy:true, timeout:30000, maximumAge:3000}
    );
  }

  window.addEventListener('resize', function(){ map.invalidateSize(); });
})();

})(); // end IIFE
</script>
