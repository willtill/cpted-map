function escCSV(v){
  var s=String(v==null?'':v).replace(/"/g,'""');
  return (s.indexOf(',')>=0||s.indexOf('\n')>=0||s.indexOf('"')>=0)?'"'+s+'"':s;
}
function dataUrlToBlob(dataUrl){
  var arr=dataUrl.split(','), mime=(arr[0].match(/:(.*?);/)||['','image/jpeg'])[1];
  var bstr=atob(arr[1]), u8=new Uint8Array(bstr.length);
  for(var i=0;i<bstr.length;i++) u8[i]=bstr.charCodeAt(i);
  return new Blob([u8],{type:mime});
}
function buildSurveyTxt(sv){
  return ['=== CPTED 현장노트 ===',
    '제목: '+(sv.title||''),
    '일시: '+(sv.time||''),
    '위도: '+(sv.lat||''),
    '경도: '+(sv.lng||''),
    '위치출처: '+(sv.gpsSource||''),
    '태그: '+(sv.tag||''),
    '---',
    sv.note||''
  ].join('\n');
}
function buildPhotoCSV(arr){
  var rows=['\uFEFF유형,ID,제목,조사일,위도,경도,주소,위치출처,CPTED원칙,취약도,태그,설명'];
  arr.forEach(function(p){
    rows.push(['사진',p.id,p.name,p.date||'',p.lat||'',p.lng||'',
      p.address||'',p.gpsSource||'',(p.cats||[]).join('|'),p.rating||0,
      (p.tags||[]).join('|'),p.desc||''].map(escCSV).join(','));
  });
  return rows.join('\n');
}
function buildSurveyCSV(arr){
  var rows=['\uFEFF유형,ID,제목,일시,위도,경도,위치출처,태그,메모'];
  arr.forEach(function(sv){
    rows.push(['노트',sv.id,sv.title,sv.time||'',sv.lat||'',sv.lng||'',
      sv.gpsSource||'',sv.tag||'',sv.note||''].map(escCSV).join(','));
  });
  return rows.join('\n');
}


// ── 공유/다운로드 통합 (iOS Share Sheet ↔ PC 다운로드 자동 전환)
// iOS만 공유 시트 / Android·PC는 직접 다운로드
function isIOS(){
  return /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.maxTouchPoints > 1 && /Mac/i.test(navigator.userAgent));
}
async function shareOrDownload(blob, filename, shareTitle) {
  if (isIOS() && navigator.share && navigator.canShare) {
    var file = new File([blob], filename, {type: blob.type});
    if (navigator.canShare({files: [file]})) {
      try {
        await navigator.share({files: [file], title: shareTitle || filename});
        return;
      } catch(e) {
        if (e.name === 'AbortError') return;
      }
    }
  }
  // PC: 직접 다운로드
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
}

function loadJSZip(cb){
  if(window.JSZip){cb(window.JSZip);return;}
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
  s.onload=function(){cb(window.JSZip);};
  s.onerror=function(){toast('❌ JSZip 로드 실패 — 인터넷 연결 확인');};
  document.head.appendChild(s);
}

async function exportAll(){
  var total=photos.length+surveys.length;
  if(!total){toast('내보낼 데이터가 없습니다');return;}
  toast('📦 파일 준비 중...');
  pb(0.05);

  try{
    var _dt = new Date(), _pd = function(n){return String(n).padStart(2,'0');};
    var ts = _dt.getFullYear()+_pd(_dt.getMonth()+1)+_pd(_dt.getDate())+'_'+_pd(_dt.getHours())+_pd(_dt.getMinutes())+_pd(_dt.getSeconds());
    var base='CPTED_'+ts;
    var shareFiles=[];

    // ── 사진: XMP 재삽입 JPEG → File 객체
    for(var i=0;i<photos.length;i++){
      var p=photos[i];
      pb(0.1+(i/Math.max(photos.length,1))*0.5);
      try{
        var pidMatch = p.id.match(/^p(\d+)/);
        var pd = pidMatch ? new Date(parseInt(pidMatch[1])) : new Date();
        var pp = function(n){return String(n).padStart(2,'0');};
        var pts = pd.getFullYear()+pp(pd.getMonth()+1)+pp(pd.getDate())+'_'+pp(pd.getHours())+pp(pd.getMinutes())+pp(pd.getSeconds());
        var blob=dataUrlToBlob(p.originalUrl||p.dataUrl); // 원본 화질 우선
        var xmp=buildXMPPacket({title:p.name,description:p.desc||'',tags:p.tags||[],
          rating:p.rating||0,location:p.lat?p.lat.toFixed(6)+','+p.lng.toFixed(6):''});
        var annotated;
        try{annotated=await injectXMPIntoJPEG(blob,xmp);}catch(_){annotated=blob;}
        shareFiles.push(new File([annotated], 'CPTED_'+pts+'.jpg',{type:'image/jpeg'}));
      }catch(e){console.warn('photo',e);}
    }

    // ── 노트: TXT → File 객체
    pb(0.65);
    surveys.forEach(function(sv){
      // 노트별 타임스탬프 (id 기준)
      var sidMatch = sv.id.match(/sv(\d+)/);
      var sd = sidMatch ? new Date(parseInt(sidMatch[1])) : new Date();
      var sp = function(n){return String(n).padStart(2,'0');};
      var sts = sd.getFullYear()+sp(sd.getMonth()+1)+sp(sd.getDate())+'_'+sp(sd.getHours())+sp(sd.getMinutes())+sp(sd.getSeconds());
      shareFiles.push(new File([buildSurveyTxt(sv)], 'NOTE_'+sts+'.txt',{type:'text/plain'}));
    });

    // ── CSV → File 객체
    pb(0.8);
    if(photos.length)  shareFiles.push(new File([buildPhotoCSV(photos)],  base+'_사진목록.csv',{type:'text/csv'}));
    if(surveys.length) shareFiles.push(new File([buildSurveyCSV(surveys)], base+'_노트목록.csv',{type:'text/csv'}));

    pb(0.9);

    // ── 분기: iOS = Share Sheet / Android·PC = ZIP 다운로드 (파일명 보존)
    var shared=false;
    if(isIOS() && navigator.share && navigator.canShare && navigator.canShare({files:shareFiles})){
      try{
        await navigator.share({files:shareFiles, title:'CPTED 현장기록 '+ts});
        shared=true;
      }catch(e){
        if(e.name==='AbortError'){pb(0);return;}
        // 그 외 오류 → ZIP 폴백
      }
    }

    // ── PC: ZIP 다운로드
    if(!shared){
      function dlOne(blob, name){
        var a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download=name; a.click();
        setTimeout(function(){URL.revokeObjectURL(a.href);},8000);
      }
      loadJSZip(async function(JSZip){
        var zip=new JSZip();
        shareFiles.forEach(function(f){
          var ext=f.name.split('.').pop().toLowerCase();
          var sub=ext==='jpg'?base+'/사진/':ext==='txt'?base+'/노트/':base+'/';
          zip.file(sub+f.name, f);
        });
        var zipBlob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
        dlOne(zipBlob, base+'.zip');
        afterExport();
      });
      return;
    }

    afterExport();

  }catch(err){
    pb(0); toast('❌ 내보내기 실패: '+err.message);
  }

  function afterExport(){
    pb(1); setTimeout(function(){pb(0);},500);
    toast('✅ 내보내기 완료! ('+photos.length+'장 + '+surveys.length+'건)');
  }
}

// ── 구조화된 설명 파싱 (불러오기용)
function parseStructuredDesc(desc){
  var r={cats:[],rating:0,tags:[],lat:null,lng:null,date:'',memo:''};
  if(!desc) return r;
  var parts=String(desc).split('---');
  if(parts[1]) r.memo=parts[1].trim();
  parts[0].split('\n').forEach(function(line){
    var m;
    if((m=line.match(/^원칙:\s*(.+)/)))    r.cats=m[1].split(',').map(function(s){return s.trim();}).filter(Boolean);
    if((m=line.match(/\((\d)\/5\)/)))       r.rating=parseInt(m[1]);
    if((m=line.match(/^태그:\s*(.+)/)))     r.tags=m[1].split(',').map(function(s){return s.trim();}).filter(Boolean);
    if((m=line.match(/^위치:\s*([\d.]+),\s*([\d.]+)/))){ r.lat=parseFloat(m[1]); r.lng=parseFloat(m[2]); }
    if((m=line.match(/^조사일:\s*(.+)/)))   r.date=m[1].trim();
  });
  return r;
}

function parseSurveyTxt(text){
  var data={}, memo=[], inMemo=false;
  text.split('\n').forEach(function(line){
    if(line.indexOf('===')===0) return;
    if(line.trim()==='---'){inMemo=true;return;}
    if(inMemo){memo.push(line);return;}
    var m=line.match(/^([^:]+):\s*(.*)/);
    if(m) data[m[1].trim()]=m[2].trim();
  });
  return {
    id:'sv'+Date.now()+'_'+Math.random().toString(36).slice(2,5),
    title:data['제목']||'불러온 노트',
    note:memo.join('\n').trim(),
    tag:data['태그']||'',
    lat:data['위도']?parseFloat(data['위도']):null,
    lng:data['경도']?parseFloat(data['경도']):null,
    gpsSource:data['위치출처']||'복원',
    time:data['일시']||new Date().toLocaleString('ko-KR'),
    photo:null
  };
}

async function importFromFiles(files){
  var arr=Array.from(files).filter(function(f){
    return f.type.startsWith('image/')||f.name.match(/\.jpe?g$/i)||f.name.match(/\.txt$/i);
  });
  if(!arr.length){ toast('⚠️ JPG 또는 TXT 파일을 선택하세요'); return; }
  toast('📥 불러오는 중... ('+arr.length+'개)');
  pb(0.05);
  var cnt={p:0,s:0,skip:0,e:0};
  var newPts=[];

  for(var i=0;i<arr.length;i++){
    var f=arr[i];
    pb(0.05+(i/arr.length)*0.9);
    try{
      if(f.type.startsWith('image/')||f.name.match(/\.jpe?g$/i)){
        // ── JPEG 불러오기
        var dataUrl=await toDataURL(f);

        // 1순위: JPEG 바이너리에서 XMP 직접 추출·파싱 (가장 신뢰성 높음)
        var xmpRaw = await extractXMPRaw(f);
        var xmpFields = parseXMPRaw(xmpRaw);

        // 2순위: exifr (GPS 등 EXIF 추출용)
        var ex={};
        try{ ex=await exifr.parse(f,{gps:true,ifd0:true})||{}; }
        catch(xe){ console.warn('[import] exifr 실패:',f.name,xe); }

        // 제목: XMP 직접 추출 → 파일명 폴백
        var title = xmpFields.title;
        if(!title) title=f.name.replace(/\.jpe?g$/i,'').replace(/^CPTED_\d+_/,'').replace(/[_-]/g,' ').trim();

        // 설명: XMP 직접 추출
        var desc = xmpFields.description;

        console.log('[import]', f.name, '→ title:', title, '| desc:', desc.length, 'chars | tags:', xmpFields.tags.length, '| rating:', xmpFields.rating);

        var parsed = parseStructuredDesc(desc);

        // 태그: XMP 직접 추출(dc:subject) 우선, 파싱 폴백
        var tags = xmpFields.tags.length ? xmpFields.tags : parsed.tags;

        // 등급: XMP 직접 추출 우선
        var rating = xmpFields.rating || parsed.rating;

        // GPS: EXIF 우선, 없으면 desc 파싱
        var lat = ex.latitude != null ? ex.latitude : parsed.lat;
        var lng = ex.longitude != null ? ex.longitude : parsed.lng;

        var p={
          id:'p'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,5),
          name:title||'불러온 사진',
          desc:desc, memo:parsed.memo,
          tags:tags, cats:parsed.cats,
          rating:rating,
          dataUrl:dataUrl, lat:lat, lng:lng,
          gpsSource:lat!=null?(ex.latitude!=null?'EXIF GPS':'XMP 복원'):'위치 없음',
          date:parsed.date||new Date().toLocaleDateString('ko-KR'),
          hasXmp:!!xmpRaw
        };

        // 중복: 파일명(id 포함) 기반으로 완화
        var isDup=photos.find(function(ep){
          return ep.name===p.name && Math.abs(ep.lat-p.lat)<0.0001 && Math.abs(ep.lng-p.lng)<0.0001;
        });
        if(!isDup){
          photos.push(p);
          await idbPut('photos',p);
          if(p.lat!=null && p.lng!=null){ addMkr('photo',mkPhotoMkr(p)); newPts.push([p.lat,p.lng]); }
          cnt.p++;
        } else { cnt.skip++; }

      } else if(f.name.match(/\.txt$/i)){
        // ── TXT 불러오기
        var text=await f.text();
        if(text.indexOf('CPTED')<0){ cnt.skip++; continue; } // CPTED 파일이 아님
        var sv=parseSurveyTxt(text);
        // 중복: 제목만으로 판별 (시간은 포맷 차이로 불일치 가능)
        var isDupSv=surveys.find(function(es){ return es.title===sv.title; });
        if(!isDupSv){
          surveys.push(sv);
          await idbPut('surveys',sv);
          if(sv.lat!=null){ addMkr('survey',mkSurveyMkr(sv)); newPts.push([sv.lat,sv.lng]); }
          cnt.s++;
        } else { cnt.skip++; }
      }
    }catch(e){ console.error('[import] 오류:',f.name, e); cnt.e++; }
  }

  pb(1); setTimeout(function(){pb(0);},500);
  updCounts();

  var msg='📥 복원: 사진 '+cnt.p+'개, 노트 '+cnt.s+'건';
  if(cnt.skip) msg+=' (중복 '+cnt.skip+'건 건너뜀)';
  if(cnt.e) msg+=' ⚠️오류 '+cnt.e+'건';
  toast(msg, 4000);
  console.log('[import] 완료:', cnt, '총', arr.length, '파일');

  if(newPts.length){
    setTimeout(function(){ map.fitBounds(newPts,{padding:[40,80]}); },500);
  }
}

// ══ GLOBAL (for onclick in info cards) ══
window.startNavi = startNavi;

// ══ 전역 드래그앤드롭 (PC — 지도 위 어디서나) ══
(function(){
  var ov = document.getElementById('dropOv');
  var cnt = 0;
  document.addEventListener('dragenter', function(e){
    e.preventDefault(); cnt++;
    ov.style.display = 'flex';
  });
  document.addEventListener('dragleave', function(){
    cnt--; if(cnt<=0){ cnt=0; ov.style.display='none'; }
  });
  document.addEventListener('dragover', function(e){ e.preventDefault(); });
  document.addEventListener('drop', function(e){
    e.preventDefault(); cnt=0; ov.style.display='none';
    var files = e.dataTransfer.files;
    if(!files.length) return;
    // 시트 안의 드롭존에서 온 경우 중복 처리 방지
    if(e.target.closest && e.target.closest('#importZone')) return;
    closeAll();
    setTimeout(function(){ importFromFiles(files); }, 100);
  });
})();

// 좌표 블록 클릭 → 클립보드에 "lat, lng" 복사
document.addEventListener('click', function(e) {
  var el = e.target.closest('.ic-coords');
  if (!el) return;
  var spans = el.querySelectorAll('span');
  if (spans.length < 2) return;
  var lat = (spans[0].textContent||'').trim();
  var lng = (spans[1].textContent||'').trim();
  if (!lat || !lng) return;
  var text = lat + ', ' + lng;
  var done = function(){ toast('📋 좌표 복사됨  '+text); };
  var fail = function(){ toast('복사 실패  '+text); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(function(){
      // 일부 브라우저(특히 모바일에서 권한 거부)는 폴백
      var ta = document.createElement('textarea'); ta.value=text;
      ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch(_) { fail(); }
      document.body.removeChild(ta);
    });
  } else {
    var ta = document.createElement('textarea'); ta.value=text;
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch(_) { fail(); }
    document.body.removeChild(ta);
  }
});

// Event delegation for dynamically created navi buttons
document.addEventListener('click', function(e) {
  var btn = e.target.closest('.ic-navi');
  if (!btn || !btn.dataset.lat) return;
  var lat = parseFloat(btn.dataset.lat);
  var lng = parseFloat(btn.dataset.lng);
  var name = btn.dataset.name || '목적지';
  startNavi(lat, lng, name);
});

// ══ STARTUP ══
(async function init(){
  // VWorld — 내장 키로 자동 연결
  if(vwKey){ document.getElementById('vwOk').style.display='block'; }

  // Layer prefs
  loadLayers();

  // Init data
  var _bt = document.getElementById('buildTag'); if (_bt) _bt.textContent = 'build 2026-05-21 · 19:30';
  setNorthLock(true, true);   // 기본값: 정북 고정 ON (조용히)
  initBoundary(); initVacant(); initLights(); initCctv(); initSafemap();
  initVacantSMJ(); initLightsSMJ(); initCctvSMJ();
  initVacantSJ(); initCctvSJ(); initBellSJ();

  // Restore tile
  var st=lsLoad('tile','esri-street');
  // Only switch tile if key is available for vworld
  if(st.startsWith('vw-') && !vwKey) st='esri-street';
  if(st !== 'esri-street') setTile(st);

  // Apply layer visibility
  Object.keys(LAYERS).forEach(function(id){ applyVis(id); });

  // Restore photos
  var savedP = await idbAll('photos');
  savedP.forEach(function(p){ photos.push(p); if(p.lat) addMkr('photo', mkPhotoMkr(p)); });

  // Restore surveys
  var savedS = await idbAll('surveys');
  savedS.forEach(function(sv){ surveys.push(sv); if(sv.lat) addMkr('survey', mkSurveyMkr(sv)); });

  updCounts();

  // 시작 뷰: 현재 위치 우선(아래 geolocation), 못 잡으면 가장 최근 추가된 사례지로 폴백
  var startLocated = false;
  setTimeout(function(){
    map.invalidateSize(true);
    // 벡터 렌더러(경계 폴리곤) 회전 호환: zoom-animated 클래스 보장 (Leaflet 버전 무관)
    document.querySelectorAll('.leaflet-overlay-pane svg, .leaflet-overlay-pane canvas').forEach(function(el){
      el.classList.add('leaflet-zoom-animated');
    });
    if (!startLocated) {
      var lastR = REGIONS[REGIONS.length - 1];  // 가장 최근 사례지
      if (lastR && lastR.center) map.setView(lastR.center, lastR.zoom || 16);
    }
    if(vwKey && st==='esri-street') setTile('vw-base');
  }, 200);

  if(savedP.length+savedS.length>0)
    toast('💾 사진 '+savedP.length+'개, 조사 '+savedS.length+'건 복원');

  // 앱 시작 시 나침반 시작 (방향 콘 표시 — 안드로이드 즉시, iOS는 권한 탭 후)
  startCompass();

  // 앱 시작 시 자동 위치 요청
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        var lat=pos.coords.latitude, lng=pos.coords.longitude;
        setLoc(lat, lng, pos.coords.accuracy);
        lastPos = {lat:lat, lng:lng};
        startLocated = true;
        map.setView([lat, lng], 17);  // 앱 시작 시 현재 위치로 이동
      },
      function(){ /* 실패·거부 시 폴백(마지막 사례지) 유지 */ },
      {enableHighAccuracy:true, timeout:10000, maximumAge:30000}
    );
    // 백그라운드 연속 추적 시작
    watcher = navigator.geolocation.watchPosition(
      function(pos) {
        var lat=pos.coords.latitude, lng=pos.coords.longitude;
        setLoc(lat, lng, pos.coords.accuracy);
        lastPos = {lat:lat, lng:lng};
        if (naviDest) updateNavi(lat, lng);
        // 네비 모드 회전은 나침반(deviceHeading)이 담당
      },
      function(){},
      {enableHighAccuracy:true, timeout:30000, maximumAge:3000}
    );
  }

  window.addEventListener('resize', function(){ map.invalidateSize(); });
})();

})(); // end IIFE
</script>
